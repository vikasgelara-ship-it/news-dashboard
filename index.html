<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}
.brief .srcs.posts{margin-top:12px}
.bnote.slim{margin:8px 0 0;padding:6px 9px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:12.5px;border-radius:0 8px 8px 0}

    if(it.url){var sl=el('a',null,it.source+' \u2197'); sl.href=it.url; sl.target='_blank'; sl.rel='noopener noreferrer'; sp.appendChild(sl)} else sp.appendChild(document.createTextNode(it.source));
    (it.also||[]).forEach(function(x){sp.appendChild(document.createTextNode(' \u00B7 ')); var al=el('a',null,x.label+' \u2197'); al.href=x.url; al.target='_blank'; al.rel='noopener noreferrer'; sp.appendChild(al)});
    sp.appendChild(document.createTextNode(' \u00B7 Briefing compiled from the source above'+(it.kind==='tweet'?' and related reporting':'')+'; check the original for full detail.'));
    bp.appendChild(sp);
    }
    if(hasBrief) a.appendChild(bp);
    else if(it.note) a.appendChild(el('p','bnote slim','Note: '+it.note));
    return a;
  }

  function xSay(list){
    var d=el('details','srcs xsay'); d.appendChild(el('summary',null,'What X is saying ('+list.length+')'));
    var ul=el('ul');
    list.forEach(function(q){
      var li=el('li'); var who=el('a',null,(q.name||'@'+q.handle)+(q.name&&q.handle?' @'+q.handle:'')); who.href=q.url||'#'; who.target='_blank'; who.rel='noopener noreferrer'; li.appendChild(who);
      var t=(q.text||'').replace(/\s+/g,' ').trim(); if(t.length>230) t=t.slice(0,229).replace(/\s+\S*$/,'')+'\u2026';
      li.appendChild(el('div','pt','\u201C'+t+'\u201D')); ul.appendChild(li);
    });
    d.appendChild(ul);
    d.appendChild(el('p','sn','Posts picked by the Markets X News assistant and matched to this briefing by keywords; commentary, not verified facts. All of them are in the From Markets X News group.'));
    return d;
  }
  function renderXPost(it, secLabel){
    SECNAME[it.id]=secLabel; BYID[it.id]=it; it.xb=true;
    var a=el('article','item tweet xpost'); a.setAttribute('data-id',it.id);
    if(it.src==='large') a.appendChild(el('span','chip','Large trade'));
    var h=el('h3','hl'); h.appendChild(document.createTextNode(it.name||('@'+it.handle)));
    if(it.name&&it.handle) h.appendChild(el('span','xhandle',' @'+it.handle));
    a.appendChild(h);
    if(it.why){var w=el('p','sum xwhy'); w.appendChild(el('strong',null,'Why: ')); w.appendChild(document.createTextNode(it.why)); a.appendChild(w)}
    var tx=it.text||'';
    if(tx){
      var long = tx.length>480 || (tx.match(/\n/g)||[]).length>8;
      var q=el('blockquote','quote xtext'); q.id='xt-'+it.id; a.appendChild(q);
      if(!long) q.textContent=tx;
      else{
        var pv=tx.slice(0,320), cut=pv.search(/\s\S*$/); if(cut>200) pv=pv.slice(0,cut); pv=pv.replace(/\s+$/,'')+'\u2026';
        q.textContent=pv;
        var mb=el('button','btn read xmore'); mb.type='button'; mb.setAttribute('aria-expanded','false'); mb.setAttribute('aria-controls',q.id);
        var lab=document.createTextNode('Read full post ('+Math.max(1,Math.round(tx.length/1000*10)/10)+'k chars) '); mb.appendChild(lab); var car=el('span','car','\u25BC'); mb.appendChild(car);
        mb.addEventListener('click',function(){var o=mb.getAttribute('aria-expanded')!=='true'; mb.setAttribute('aria-expanded',o); q.textContent=o?tx:pv; lab.nodeValue=o?'Show less ':'Read full post ('+Math.max(1,Math.round(tx.length/1000*10)/10)+'k chars) '});
        a.appendChild(mb);
      }
    }
    if(it.eng) a.appendChild(el('p','xeng',it.eng));
    var f=el('div','foot');
    if(it.url){var l=el('a','src','View post on X \u2197'); l.href=it.url; l.target='_blank'; l.rel='noopener noreferrer'; f.appendChild(l)}
    if(it.posted){ if(it.url) f.appendChild(el('span','dot','\u00B7')); f.appendChild(document.createTextNode('posted ')); var tm=el('time','rec'); tm.setAttribute('datetime',it.posted); tm.setAttribute('data-published',it.posted); f.appendChild(tm); a.setAttribute('data-published',it.posted) }
    a.appendChild(f);
    var acts=el('div','acts'); a._btns=askVote(it,acts); a.appendChild(acts);
    return a;
  }
  function xLabel(k,x){
    var ed=fmtEdition(x.date).replace(',','');
    if(k==='morning') return 'Morning brief \u00B7 '+ed+' (SGT)';
    var d=parse(x.as_of); return 'Large trade watch \u00B7 '+(d? (x.time_known? fmtSGT(d).replace(',','') : ed+' (SGT)') : ed);
  }
  function xGroup(){
    var m=XB.morning, l=XB.large, mf=xbFresh('morning'), lf=xbFresh('large');
    if(!mf && !lf && !m) return null;                 // nothing to show: no files (or only a stale large-trades file)
    var n=(mf?m.items.length:0)+(lf?l.items.length:0), secLabel='Finance \u203A From Markets X News';
    var d=el('details','group xg'); d.id='g-fin-xbrief';
    var saved=LS.get('newsdash.open.fin-xbrief'); d.open = saved===null ? n>0 : saved==='1';
    d.addEventListener('toggle',function(){LS.set('newsdash.open.fin-xbrief', d.open?'1':'0')});
    var s=el('summary'); s.appendChild(el('span','gi','\uD83D\uDCE1')); s.appendChild(el('h2','gt','From Markets X News'));
    s.appendChild(el('span','gc',n+(n===1?' post':' posts'))); s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    function sub(k,x){var t=el('div','xsub'); t.appendChild(document.createTextNode(xLabel(k,x).split(' \u00B7 ')[0]+' \u00B7 ')); t.appendChild(el('span',null,xLabel(k,x).split(' \u00B7 ').slice(1).join(' \u00B7 '))); return t}
    function grid(k){var w=el('div','items'); XB[k].items.forEach(function(it){w.appendChild(renderXPost(it,secLabel))}); return w}
    if(m){
      if(mf){ d.appendChild(sub('morning',m)); d.appendChild(grid('morning')) }
      else{
        var ageH=Math.round((Date.now()-Date.parse(m.as_of))/36e5);
        d.appendChild(el('div','xnote', m.items.length
          ? 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief is about '+ageH+' h old, older than '+XB.fresh_h.morning+' h, so its posts are hidden until the next run (daily 6:45 AM SGT).'
          : 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief had no readable posts. It will refresh with the next run (daily 6:45 AM SGT).'));
      }
    }
    if(lf){ d.appendChild(sub('large',l)); d.appendChild(grid('large')) }
    return d;
  }

  function renderGroup(key, title, icon, items, openDefault, secLabel, tours){
    tours=tours||[];
    var d = el('details','group'); d.id='g-'+key;
    var saved = LS.get('newsdash.open.'+key);
    d.open = saved===null ? openDefault : saved==='1';
    d.addEventListener('toggle', function(){LS.set('newsdash.open.'+key, d.open?'1':'0')});
    var s = el('summary'); s.appendChild(el('span','gi',icon)); s.appendChild(el('h2','gt',title));
    s.appendChild(el('span','gc',items.length+(items.length===1?' item':' items')+(tours.length?' \u00B7 '+tours.length+(tours.length===1?' overview':' overviews'):'')));
    s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    var w = el('div','items');
    if(!items.length) w.appendChild(el('div','empty','Nothing verified for this section yet.'));
    items.forEach(function(it){w.appendChild(renderItem(it, secLabel))});
    d.appendChild(w);
    tours.forEach(function(t){d.appendChild(renderTour(t, secLabel, title))});
    return d;
  }

  function askBar(){
    var w=el('div','askbar');
    var a=el('a','btn ask','\u2726 Ask Grok about today\u2019s news'); a.href=grokUrl(overallPrompt()); a.target='_blank'; a.rel='noopener noreferrer'; w.appendChild(a);
    var c=el('button','btn ghost','Copy question'); c.type='button';
    c.addEventListener('click',function(){copyText(overallPrompt()).then(function(ok){toast(ok?'Question copied \u2014 paste it into Grok':'Copy failed \u2014 long-press to copy')})});
    w.appendChild(c);
    w.appendChild(el('span','hint','Opens grok.com with a prefilled question. Each story also has its own Ask Grok button.'));
    return w;
  }

  /* ---------- feedback panel ---------- */
  var REPO='vikasgelara-ship-it/news-dashboard';
  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});
  }
  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports, finance and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each); X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
