<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-10-24T06:07:15+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "d1d2cc5b", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Equity markets: Thursday was a broad, tech-led risk-off day. The Nasdaq 100 closed down 2.9%, its worst day since June 5, wiping out about $1.2 trillion (Kobeissi, about 192.1K views, 3,237 likes, the most-liked market-close post I found). Intraday zerohedge flagged the Nasdaq 100 down 3% and the S&P 500 down 1.5% (about 83.3K views, 715 likes); Charlie Bilello puts the S&P 500 close at -1.2%, its 21st 1%+ drop this year, and argues that is normal (about 14.7K views, 148 likes). zerohedge's 'Korea halted' post (about 169.1K views, 2,889 likes) is a prediction about the Asian open this morning, not a confirmed halt. Charts attached to some posts, not visible to me. Separate posts, not a thread.", "text": "BREAKING: The Nasdaq 100 closes down -2.9%, posting its biggest daily drop since June 5th.\n\nThe index erased nearly -$1.2 trillion in market cap today. https://t.co/38jQv0mtfo\n\n[Also: @zerohedge, https://x.com/zerohedge/status/2113331872306463058]\n\n*NASDAQ 100 EXTENDS DECLINE TO 3%, S&P 500 DOWN 1.5%\n\n[Also: @charliebilello, https://x.com/charliebilello/status/2113386292029309091]\n\nThe S&P 500 fell 1.2% today, its 21st daily decline so far this year with a loss above 1%. This is perfectly normal volatility for the stock market - the average year since 1928 has 29 large declines. Downside risk is the price of admission. Without it, there would be no reward. https://t.co/WUpfsLppeu\n\n[Also: @zerohedge, https://x.com/zerohedge/status/2113376836516548926]\n\nThree hours until Korea is halted seconds after the open", "eng": "", "url": "https://x.com/KobeissiLetter/status/2113361967691760094", "headline": "The Kobeissi Letter (@KobeissiLetter) · BREAKING: The Nasdaq 100 closes down -2.9%, posting its biggest daily drop…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-23T04:08:52+08:00", "chars": 818, "src": "morning"}, {"id": "4b77f53a", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Rates: Treasuries were bid hard as stocks fell. Kobeissi flagged the 10-year back at 5.00% for the first time since Sept 23 (about 339.2K views, 4,530 likes, the most-liked finance post today), and WSJ's Nick Timiraos notes the 19.3bp drop to 4.952% was the biggest one-day fall since SVB failed in March 2023 (about 40.8K views, 406 likes). Different authors, shown together.", "text": "BREAKING: The US 10Y Note Yield falls to 5.00% for the first time since September 23rd as the selloff in technology stocks deepens. https://t.co/ZJZk05yQuM\n\n[Also: @NickTimiraos, https://x.com/NickTimiraos/status/2113390420923441663]\n\nThursday's 10-year Treasury yield decline of 0.193 percentage point (to 4.952%) is the largest single day yield decline since March 10, 2023, which is the day Silicon Valley Bank failed.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2113291786743583022", "headline": "The Kobeissi Letter (@KobeissiLetter) · BREAKING: The US 10Y Note Yield falls to 5.00% for the first time since…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-22T23:29:59+08:00", "chars": 421, "src": "morning"}, {"id": "a7f90628", "name": "Holger Zschaepitz", "handle": "Schuldensuehner", "why": "Credit: the AI-capex story is now showing up in credit markets, with Oracle 5-year CDS above 300bp and Meta at a record 119bp (about 14.8K views, 235 likes). I've added zerohedge's two market pieces from the same session: their close wrap (about 52.6K views, 62 likes) and a TS Lombard 'AI crash' scenario (about 61.6K views, 93 likes); both are headline-plus-link posts and I didn't open the articles. Chart attached to Holger's post, not visible to me.", "text": "AI credit risk hits new highs. Oracle’s 5Y CDS tops 300bps, SpaceX exceeds 200bps, Meta hits a record 119bps as future spending commitments reach $825bn. The AI arms race is becoming a financing race. Insuring the dream against default keeps getting more expensive. https://t.co/YH2OR8yIOf\n\n[Also: @zerohedge, https://x.com/zerohedge/status/2113359766999257213]\n\nZuck'd: Tech Wrecks As AI Credit Cracks Widen; Bonds Panic-Bid, Bitcoin & Bullion Battered https://t.co/5Q0Q86bmP6\n\n[Also: @zerohedge, https://x.com/zerohedge/status/2113340892354326813]\n\nWargaming The AI Crash: TS Lombard Sees A $20 Trillion Wipeout... But Only A \"Mild\" Recession https://t.co/OrX3W95pkq", "eng": "", "url": "https://x.com/Schuldensuehner/status/2113352401990340986", "headline": "Holger Zschaepitz (@Schuldensuehner) · AI credit risk hits new highs. Oracle’s 5Y CDS tops 300bps, SpaceX exceeds…", "tags": ["@Schuldensuehner", "x-brief"], "posted": "2026-10-23T03:30:51+08:00", "chars": 668, "src": "morning"}, {"id": "12149f64", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Oil and geopolitics: the selloff started when Trump said the US is not negotiating with Iran, sending Nasdaq 100 futures down 2% (about 408.6K views, 4,455 likes, the most-viewed finance post I found). Later Trump invoked the Defense Production Act for petroleum capacity (about 30.4K views, 169 likes) and said the US 'may do it a little bit further' on Iran (about 14.2K views, 47 likes). Kobeissi's SPR post shows US emergency oil reserves at the lowest since 1982 (about 222.2K views, 2,255 likes). Separate posts, not a thread.", "text": "BREAKING: Nasdaq 100 futures extend losses to -2% on the day after President Trump says the US is not negotiating with Iran and “something” will happen “fair soon.” https://t.co/fkoitWk67t\n\n[Also: @FirstSquawk, https://x.com/FirstSquawk/status/2113372930151498147]\n\nTRUMP INVOKES DEFENSE PRODUCTION ACT FOR PETROLEUM CAPACITY, SENDS DEFSEC HEGSETH MEMO ON DEFENSE PRODUCTION ACT AND OIL\n\n[Also: @FirstSquawk, https://x.com/FirstSquawk/status/2113393902267019385]\n\nTRUMP SAYS ON IRAN THAT “WE’VE KNOCKED THE HELL OUT OF THEM, AND WE MAY DO IT A LITTLE BIT FURTHER,” ADDING THAT MANY GREAT PATRIOTS REALLY LOVE THE IRAN WAR\n\n[Also: @KobeissiLetter, https://x.com/KobeissiLetter/status/2113247804692832485]\n\nBREAKING: The Strategic Petroleum Reserve (SPR) fell -300,000 barrels last week, to 282.7 million barrels, the lowest level since October 1982.\n\nSince March 20th, US oil inventories in the SPR have dropped -132.8 million, or -32%.\n\nWe have now seen drawdowns in 29 of the last 30 weeks.\n\nFor perspective, oil reserves in the SPR stood at 653.9 million barrels in 2020, or +131% above current levels.\n\nMeanwhile, commercial crude oil stocks excluding the SPR dropped -3.1 million barrels last week, to 412.5 million barrels, the lowest reading since the end of July.\n\nThis is also ~3% below the 5-year average for this time of year.\n\nAmerica's oil stockpiles are at critically low levels.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2113211662614564892", "headline": "The Kobeissi Letter (@KobeissiLetter) · BREAKING: Nasdaq 100 futures extend losses to -2% on the day after President…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-22T18:11:36+08:00", "chars": 1392, "src": "morning"}, {"id": "44ad0c79", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Sovereign debt and global growth: France's 10-year yield is now above the US 10-year for the first time since 2013 (about 159.9K views, 1,279 likes), and a separate Kobeissi post this morning lays out how higher rates would blow out US deficits (about 32.6K views, 147 likes). For Asia this morning, Australia's October flash composite PMI fell into contraction at 47.7 from 51.3 (First Squawk, about 13.0K views, 3 likes). Charts attached to Kobeissi's posts, not visible to me. Separate posts, not a thread.", "text": "Absolutely incredible.\n\nFor the first time since 2013, France's 10Y Government Bond yield has risen above the US 10Y Note Yield.\n\nThat's +550 basis points since the low seen in 2020.\n\nBorrowing costs are skyrocketing in France. https://t.co/5EOc9ihxtZ\n\n[Also: @KobeissiLetter, https://x.com/KobeissiLetter/status/2113400257522303324]\n\nThe US government cannot afford higher interest rates.\n\nIf interest rates average +150 basis points above CBO’s February projections by 2036, US deficits would increase by nearly $6 trillion over this period.\n\nThe deficit would then rise to 8.8% of GDP, the highest level since WWII, excluding 2008 and 2020.\n\nThis would also push the US public Debt-to-GDP ratio to a record 133%, up from ~100% currently.\n\nIf rates average +50 basis points above projections, deficits would increase by nearly $2 trillion, lifting the Debt-to-GDP ratio to 124% by 2036.\n\nJust weeks ago, the 10Y Note yield traded at ~5.30%, or ~100 basis points above CBO’s average projected rate over the next 10 years.\n\nThe US government needs rate cuts.\n\n[Also: @FirstSquawk, https://x.com/FirstSquawk/status/2113391835213430874]\n\nAUSTRALIA S&P GLOBAL OCTOBER FLASH COMPOSITE PMI FELL TO 47.7 FROM 51.3 IN SEPTEMBER, WITH THE SERVICES PMI DROPPING TO 47.8 FROM 51.9 AND THE MANUFACTURING PMI EDGING UP TO 49.7 FROM 49.6", "eng": "", "url": "https://x.com/KobeissiLetter/status/2113306134115172812", "headline": "The Kobeissi Letter (@KobeissiLetter) · Absolutely incredible.", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-23T00:27:00+08:00", "chars": 1324, "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-23", "as_of": "2026-10-23T06:55:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-10-23T06:55:12+08:00"}, "large": {"kind": "large", "items": [{"id": "ac54cd6b", "name": "Tracy Shuchart", "handle": "chigrl", "why": "", "text": "Position: Piling into global equity shorts: short sales outpaced long purchases about 5 to 1 this month; short leverage on Goldman's prime book is at the 99th percentile of the past five years, while net leverage for fundamental long/short funds is near a three-year low. Goldman flags squeeze risk if stocks rebound.\nStatus: Put on (positioning)\n\nHedge Funds Pile Into Shorts, Goldman Sachs Across global equities, Goldman Sachs Group Inc.'s prime brokerage desk says short sales have exceeded long purchases by a ratio of roughly five to one. Short leverage across its book sits in the 99th percentile over the past five years. Net leverage among fundamental long/short funds, a gauge of how much long exposure exceeds shorts, is near a three-year low, despite a rise in gross leverage. The retreat follows a sharp unwind in the AI trade. A hotter-than-expected US inflation print and renewed doubts over the payoff from heavy spending on AI capacity have triggered selling in semiconductor and infrastructure names, extending a rout that began with Asian memory stocks.\n\nHedge funds are piling into shorts. Goldman is flagging what usually comes next: a squeeze. Goldman's prime book shows short leverage spiking to the high end of its multi-year range, while net trading flows just hit their heaviest selling since the April lows. The crowd is leaning hard to one side. Crowded shorts are fuel. When everyone is positioned the same way, the smallest rally forces covering, and covering feeds on itself into a melt-up. The more one-sided the bet against stocks gets, the more violent the snapback when it breaks.", "eng": "", "url": "https://x.com/chigrl/status/2113225701767733535", "headline": "Tracy Shuchart (@chigrl) · Position: Piling into global equity shorts: short sales outpaced long…", "tags": ["@chigrl", "x-brief", "large-trades"], "posted": "2026-10-22T19:07:23+08:00", "chars": 1615, "src": "large"}, {"id": "2519606c", "name": "Jordi Visser", "handle": "jvisserlabs", "why": "", "text": "Position: Suffering from a deleveraging of their most-owned stocks: the GS Hedge Fund VIP basket fell 2.6% versus the S&P 500 on Oct 22, and its 75-day rate of change since the end-of-Q2 peak is the worst since the weeks after Lehman. Jordi Visser ties it to wider hedge fund deleveraging, including fixed-income pain from the CoreWeave fallout and French bonds.\nStatus: Suffering from it\n\nGS Hedge Fund VIP Basket relative to the SPX down 2.6% today and since the peak at the end of Q2 the 75 day rate of change is now the worst since the weeks after Lehman Bankruptcy. This is just equities. Add in the pain in fixed income from Coreweave fallout last week and French bonds every day and hedge fund deleveraging contagion continues. All with positive breadth today and 12 of the last 16 as the unwind of concentration isn't stopping yet.", "eng": "", "url": "https://x.com/jvisserlabs/status/2113347730927952161", "headline": "Jordi Visser (@jvisserlabs) · Position: Suffering from a deleveraging of their most-owned stocks: the GS…", "tags": ["@jvisserlabs", "x-brief", "large-trades"], "posted": "2026-10-23T03:12:17+08:00", "chars": 839, "src": "large"}, {"id": "810c6558", "name": "Neil Sethi", "handle": "neilsethinew", "why": "", "text": "Position: Big short in US Treasuries, which BofA puts near $280B in 10-year equivalents (about $170M of buying per basis point in an unwind). With yields falling sharply this week (10-year back below 5%), BofA says CTA short covering is underway in the long end, with room for an extended rally if front-end and belly triggers are hit.\nStatus: Suffering from it (being forced to cover)\n\nWith rates dropping notably again across the curve, we should be firmly into CTA short covering according to BofA's rates strategists (Meghan Swiber and Eleanor Xiao) who said entering the week \"CTA short covering is already underway in the long end, leaving scope for an extended rally if front-end and belly triggers are reached.\" As of Friday, the 10-year was sitting right at the top of its trigger range, with the 2-, 5- and 7-year all within about 3bp, and each range fully crossed within roughly 7-12bp. BofA puts industry CTA positioning near $280B in 10-year equivalents (about $170M of buying per basis point in an unwind). That doesn't though change their bigger picture. They see the setup \"as consistent with tactical rallies inside a still-bearish medium-term rates backdrop. Strong US data keeps the Fed's 'hike or bond spike' problem in focus: if the Fed remains patient despite resilient data, the bond market may increasingly force its hand.\" They continue to expect rates to rise and the curve to flatten \"until policy becomes demonstrably restrictive through softer macro data or tighter financial conditions,\" but note that \"concentrated shorts also leave room for sharp countertrend rallies, particularly during non-inflationary risk-off episodes when USTs retain their defensive diversification benefit.\"", "eng": "", "url": "https://x.com/neilsethinew/status/2113279207312679367", "headline": "Neil Sethi (@neilsethinew) · Position: Big short in US Treasuries, which BofA puts near $280B in 10-year…", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-10-22T22:40:00+08:00", "chars": 1714, "src": "large"}, {"id": "a55ba4c1", "name": "The Straits Times", "handle": "straits_times", "why": "", "text": "Position: Posted a Q3 loss of about US$30B (S$38B; NOK 278B, -0.5% return), driven by a 3.5% drop in its fixed-income holdings as rates rose; equities were up 0.5%.\nStatus: Suffering from it\n\nNorway's wealth fund posts S$38 billion loss in third quarter\n\nnorway's wealth fund, the biggest in the world, just lost $30 billion in a quarter it was the bonds that did it", "eng": "", "url": "https://x.com/straits_times/status/2113195506302108030", "headline": "The Straits Times (@straits_times) · Position: Posted a Q3 loss of about US$30B (S$38B; NOK 278B, -0.5% return),…", "tags": ["@straits_times", "x-brief", "large-trades"], "posted": "2026-10-22T17:07:24+08:00", "chars": 366, "src": "large"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-23", "as_of": "2026-10-23T12:58:00+08:00"     ['cricket','football','golf','f1','tennis'].forEach(function(k){if((d[k]||[])[0]) pick.push(d[k][0])});
    (f.macro||[]).slice(0,2).forEach(function(x){pick.push(x)});
    (DATA.trending||[]).slice(0,3).forEach(function(x){pick.push(x)});
    var day=new Date().toLocaleDateString('en-GB',{timeZone:TZ,day:'numeric',month:'long',year:'numeric'});
    return 'I\u0027m reading my personal news dashboard for '+day+'. Today\u2019s top stories: '+pick.map(function(x,i){return (i+1)+') '+x.headline}).join('; ')+
      '. Give me a short briefing of what matters most today, how the stories connect (markets, what is trending on X, sport), and let me ask follow-up questions.';
  }

  function copyText(txt){
    function fallback(){var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length); var ok=false; try{ok=document.execCommand('copy')}catch(e){} document.body.removeChild(ta); return ok}
    if(navigator.clipboard && window.isSecureContext){return navigator.clipboard.writeText(txt).then(function(){return true},function(){return fallback()})}
    return Promise.resolve(fallback());
  }

  /* ---------- feedback panel ---------- */
  var REPO='vikasgelara-ship-it/news-dashboard';
  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});
  }
  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }

    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){

        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){

      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});

    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';

    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);

    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports, finance and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each); X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
