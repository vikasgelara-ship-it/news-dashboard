<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

   "headline": "Binance hit by a record $6.3bn hack, blamed on North Korea's TraderTraitor; about $3bn frozen",
   "teaser": "The largest crypto theft on record drained Binance hot wallets across 10 chains. Binance has set aside $6.34bn to cover losses, and Bitcoin fell below $78,000.",
   "source": "Decrypt · CNBC · TRM Labs · Chainalysis",
   "url": "https://www.cnbc.com/2026/10/30/billions-in-crypto-frozen-in-binance-hack-heres-what-happens-next-.html",
   "published": "2026-10-30",
   "tags": [
    "Trending",
    "Crypto",
    "Binance",
    "Hack",
    "North Korea",
    "Bitcoin"
   ],
   "brief": [
    {
     "h": "What's happening",
     "b": [
      "Attackers drained about $6.3 billion from Binance, the world's biggest crypto exchange, in what blockchain analysts call the largest digital-asset theft in history. TRM Labs puts the total at $6.36 billion across 10 chains, most of it taken within about 20 minutes. The attack began at about 20:05 UTC on 29 October, which was 04:05 SGT on 30 October.",
      "TRM Labs and Chainalysis both attribute the hack to North Korea's TraderTraitor group. Chainalysis puts the theft at about $6.4 billion."
     ]
    },
    {
     "h": "Why it's trending",
     "b": [
      "The size dwarfs previous crypto hacks, and it hit the industry's largest platform. Posts claiming it started with one engineer's compromised laptop spread widely, although that detail is reported rather than confirmed by Binance.",
      "The hack also hit crypto-linked stocks on Wall Street: Coinbase, Strategy and Robinhood fell 7-11% on Friday, according to Reuters."
     ]
    },
    {
     "h": "Key facts",
     "b": [
      "CNBC reports that about $3 billion of the stolen assets has been frozen, though recovering it depends on legal seizure and token reissuance.",
      "Decrypt reports Binance has set aside more than $6.34 billion of company funds to cover losses, and CEO Richard Teng told users: 'Your assets are safe.' Withdrawals have been suspended pending security checks, with Binance targeting a restart by Sunday and a proof-of-reserves update by Monday.",
      "Chainalysis also ties the theft to North Korea and says it is tracing the funds as they move.",
      "Bitcoin fell below $78,000 after the news.",
      "TRM says the attacker used an EIP-7702 delegation, with 50 pre-signed authorisations prepared in advance, to turn a Binance hot wallet on Ethereum into a sweeper it controlled. On the other nine chains, Binance wallets sent funds through ordinary signed transfers, which TRM says points to a compromise of Binance's hot-wallet signing systems.",
      "Tether, Circle, Ripple and World Liberty Financial froze about $2.67 billion in stablecoins, and Arbitrum froze more ETH and ARB, for a total of about $2.7 billion, TRM says. The attacker still holds more than 420,000 ETH and 18,270 BTC, about $2.4 billion that no issuer can freeze.",
      "Teng says the hack 'was not carried out by one person'. Binance first traced it to a compromised laptop but has since found other points of breach. He says it hit Binance's own hot wallet, not customer funds, and that $5 billion of the $6.34 billion reserve is already held in the stolen tokens.",
      "TRM calls it about four times the size of the $1.5 billion Bybit hack in February 2025.",
      "Estimates of the total vary slightly between $6.3 billion and $6.4 billion depending on pricing and which assets are counted."
     ]
    },
    {
     "h": "What to watch",
     "b": [
      "Whether Binance reopens withdrawals on schedule, how much of the frozen $3 billion can be recovered, and whether regulators respond. Also watch for further laundering as analysts track the attacker's wallets."
     ]
    }
   ],

     "b": [

      "The legal basis for the suspension is contested between the two sides.",
      "The Tribunal itself says both men remain in office, that Korwin-Piotrowska cannot act as its head, and that anyone acting against it is committing the crime of a coup d'état, Pollar reports.",
      "The suspension notice appeared on the Tribunal's website at about 18:00 local time (01:00 SGT on Friday), and dozens of riot officers arrived that evening.",

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-10-31T06:01:13+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "3f677fdc", "name": "1) The Kobeissi Letter", "handle": "KobeissiLetter", "why": "— 29 Oct, 8:32 PM SGT Why: The key inflation print of the day and the most-engaged macro post in this window: about 4,233 likes, 550 reposts, 355K views. It frames September PCE as confirming a re-acceleration and calls for a December Fed hike. Open on X", "text": "BREAKING: US September PCE inflation, the Fed's preferred inflation metric, rises to 3.6%.\n\nCore PCE inflation also rose to 3.1%, up +0.3% month-over-month.\n\nThis officially confirms that CPI, PPI, and PCE inflation are all rising again.\n\nA December rate hike is coming.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2115783910143791414", "headline": "1) The Kobeissi Letter (@KobeissiLetter) · BREAKING: US September PCE inflation, the Fed's preferred inflation metric,…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-29T20:32:48+08:00", "chars": 270, "sec": "Finance / markets", "src": "morning"}, {"id": "69e45395", "name": "2) Nick Timiraos", "handle": "NickTimiraos", "why": "— 29 Oct, 8:53 PM SGT Why: The WSJ Fed reporter's read on the inflation detail that matters most for policy: core services ex-housing. About 253 likes, 60 reposts, 52K views. It quotes another post (not shown) and attaches a chart. Open on X", "text": "Prices of core PCE services ex-housing rose 0.37% in September, pushing the 12-month change to 3.6% and matching the highest such reading since 2024.\n\nCore goods was also firm at 0.20%. While core goods prices were back in 2024 were falling on a year-over-year basis (as was the pre-pandemic trend), those prices are now at 2%. If core goods prices rise like this going forward, there will need to be more services disinflation for the Fed to achieve its 2% target.", "eng": "", "url": "https://x.com/NickTimiraos/status/2115789173588144329", "headline": "2) Nick Timiraos (@NickTimiraos) · Prices of core PCE services ex-housing rose 0.37% in September, pushing the…", "tags": ["@NickTimiraos", "x-brief"], "posted": "2026-10-29T20:53:43+08:00", "chars": 465, "sec": "Finance / markets", "src": "morning"}, {"id": "4bd211ff", "name": "3) The Kobeissi Letter", "handle": "KobeissiLetter", "why": "— 29 Oct, 2:03 AM SGT Why: Clean summary of Wednesday's FOMC hold (10-2, with two dissents for a hike). About 3,348 likes, 452 reposts, 350K views. Open on X", "text": "SUMMARY OF FED DECISION (10/28/2026):\n\n1. Fed leaves interest rates unchanged after September hike\n\n2. Rate pause was a 10-2 decision with Cook and Hammack dissenting in favor of a rate hike\n\n3. Fed says economic activity is \"expanding at a strong pace\"\n\n4. Fed says inflation \"remains elevated\" and seeks more information\n\n5. Fed notes that \"geopolitical developments\" are contributing to uncertainty\n\n6. The Fed reasserts that \"The Committee will deliver price stability\"\n\n\"Higher for longer\" continues at the Fed.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2115504620219007201", "headline": "3) The Kobeissi Letter (@KobeissiLetter) · SUMMARY OF FED DECISION (10/28/2026):", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-29T02:03:00+08:00", "chars": 516, "sec": "Finance / markets", "src": "morning"}, {"id": "d0407a1f", "name": "4) Daniel Roemer", "handle": "SirMaximusIX", "why": "— 30 Oct, 4:17 AM SGT Why: Low engagement (about 4 likes, 112 views), but it's the most complete cross-asset close in the window: index levels, breadth under a mega-cap tech selloff, Treasury curve moves, the 7-year auction and IG supply. Figures are the author's. Open on X", "text": "🇺🇸 STOCK AND RATES MARKET CLOSING COMMENT\n\nA record plunge in $GOOGL dominated the session, with the stock falling ~13% after Q3 EPS of $2.12 came in well below the $3.02 consensus as AI-related capital expenditure surged, reviving investor concerns over the return on AI spending.\n\nS&P 500 at 7,705.08 (−0.50%) 🔴\nNasdaq at 26,184.72 (−1.38%) 🔴\nDow at 52,342.62 (−0.25%) 🔴\nRussell 2000 at 2,851.08 (+0.73%) 🟢\n\nThe miss weighed heavily on the Nasdaq Composite and dragged Information Technology (−1.75%) and Communication Services (−0.26%) into the red.\nBeneath the surface, however, the session told a very different story. Breadth was notably positive. Roughly 370 S&P 500 members gained on the day and the equal-weight index advanced ~0.8%. The Russell 2000 outperformed sharply, supported by strong GDP data that bolstered the domestic cyclical trade.\nConsumer Discretionary led all sectors at +3.15%, followed by Real Estate (+2.35%) and Utilities (+1.45%), with Financials and Industrials each adding ~1.40%.\n\nToday was a large-cap tech story, not a broad market selloff. The rotation into small caps, value, and rate-sensitive sectors suggests the market is repricing AI capex risk rather than pricing in macro deterioration.\n\nTreasuries bull steepened on the day, with the flight-to-quality bid from the tech selloff providing the primary catalyst. The front end and belly led the rally.\nThe 2Y rallied 4.8 bp to 4.652%.\nThe 5Y rallied 3.9 bp to 4.800%.\nThe 10Y rallied 3.5 bp to 4.984%, just shy of the 5% handle.\nThe 30Y lagged, rallying only 1.8 bp to 5.329%, extending Wednesday’s steepening move.\nSOFR was unchanged at 3.940%. Effective Fed Funds was unchanged at 3.880%.\n\nThe $44B 7-year note auction stopped on the screws at 4.894%, matching the when-issued yield, with a bid-to-cover of 2.46 (vs. 2.42 prior). Primary dealer award was the lowest since December, pointing to solid end-user demand. The market reacted minimally to the results, holding its gains.\nOn the corporate side, $MSFT.NE priced a $25B jumbo deal across 10 tranches, reportedly drawing over $115 billion in orders at peak. That is a blowout reception that underscores the depth of IG demand even at current yield levels.\n\nThe macro backdrop remains complex. The Fed held at 3.75%–4.00% on Wednesday (10-2 vote, with Cook and Hammack dissenting for a hike), and September PCE printed +0.5% MoM, lifting the annual rate to 3.6%, the largest monthly increase in six months. With more auction settlements and month-end positioning expected Friday, and a T-bill settlement next Tuesday, the near-term bias is seen sustaining upward pressure on rates.\nToday’s bull steepening was driven by risk-off flows out of tech rather than a fundamental shift in the rates outlook. The Fed’s next move remains live, and the front end is unlikely to sustain these gains if PCE stays elevated.", "eng": "", "url": "https://x.com/SirMaximusIX/status/2115900877890257397", "headline": "4) Daniel Roemer (@SirMaximusIX) · 🇺🇸 STOCK AND RATES MARKET CLOSING COMMENT", "tags": ["@SirMaximusIX", "x-brief"], "posted": "2026-10-30T04:17:35+08:00", "chars": 2860, "sec": "Finance / markets", "src": "morning"}, {"id": "8d2a9d60", "name": "5) The Kobeissi Letter", "handle": "KobeissiLetter", "why": "— 30 Oct, 5:58 AM SGT Why: Breaking risk event this morning: a suspected Binance hack, with Bitcoin already at a 5-week low. The most-viewed finance post in the window: about 5,201 likes, 794 reposts, 563K views. Outflow figures are unconfirmed and differ across posts (Kobeissi's earlier posts cited $2.8B; Tether froze $971M; CZ later said losses might be over $1B and would be covered). Open on X", "text": "BREAKING: Binance has been hacked with wallets across the Ethereum, Bitcoin, and TRON networks seeing outflows of -$5.7 billion.\n\nThe hack includes $1.45 billion worth of Bitcoin and $875 million worth of ETH.\n\nIf confirmed, this would mark the biggest hack in crypto history.\n\nWe expect more information shortly.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2115926246916038921", "headline": "5) The Kobeissi Letter (@KobeissiLetter) · BREAKING: Binance has been hacked with wallets across the Ethereum, Bitcoin,…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-30T05:58:23+08:00", "chars": 313, "sec": "Finance / markets", "src": "morning"}, {"id": "6d24f098", "name": "1) João Guilherme", "handle": "joaoguillll", "why": "— 30 Oct, 4:30 AM SGT Why: Sir Patrick Stewart has died at 86; his name, Star Trek, Professor X and X-Men are top worldwide trends. This was the most-engaged tribute I found in the search: about 441 likes, 59 reposts, 6.8K views. The post is in Portuguese; my English translation follows the original. Open on X", "text": "Uma das melhores coisas da trilogia clássica dos X-Men era a interação do Patrick Stewart com Ian Mckellen.\n\nPatrick Stewart interpretou o Professor Xavier em 9 filmes.\n\n\"A mutação é a chave para a nossa evolução.\"\n\nObrigado por tudo Patrick Stewart⨷\n\n[Translation] One of the best things about the classic X-Men trilogy was Patrick Stewart's interplay with Ian McKellen. Patrick Stewart played Professor Xavier in 9 films. \"Mutation is the key to our evolution.\" Thank you for everything, Patrick Stewart.", "eng": "", "url": "https://x.com/joaoguillll/status/2115904167898452022", "headline": "1) João Guilherme (@joaoguillll) · Uma das melhores coisas da trilogia clássica dos X-Men era a interação do…", "tags": ["@joaoguillll", "x-brief", "other-trends"], "posted": "2026-10-30T04:30:39+08:00", "chars": 506, "sec": "Other trends", "src": "morning"}, {"id": "f73e7da7", "name": "2) MAHEE", "handle": "nafi_auwal80838", "why": "— 30 Oct, 4:05 AM SGT Why: Ronaldo (41) scored a second-half hat-trick in Al Nassr's 5-3 win over Al Kholood, moving to 985 career goals; Ronaldo is trending worldwide. About 38 likes, 15 reposts, 1.3K views. Open on X", "text": "🐐🔥 TWO DISALLOWED GOALS, BUT CR7 STILL DELIVERS A HAT-TRICK!\n\nCristiano Ronaldo responds in style! Despite having two goals ruled out, the Al-Nassr captain still bags a hat-trick as his side beat Al-Kholood 5–3. 🤯⚽\n\nRonaldo moves to 985 career goals — just 15 away from 1,000! 👀\n\nMy take: This is pure persistence. You can deny him goals, but stopping Ronaldo from finding the net is another challenge entirely!\n\nAl-Nassr keep pace at the top, and CR7 keeps chasing history. 👑💛", "eng": "", "url": "https://x.com/nafi_auwal80838/status/2115897780191346787", "headline": "2) MAHEE (@nafi_auwal80838) · 🐐🔥 TWO DISALLOWED GOALS, BUT CR7 STILL DELIVERS A HAT-TRICK!", "tags": ["@nafi_auwal80838", "x-brief", "other-trends"], "posted": "2026-10-30T04:05:16+08:00", "chars": 477, "sec": "Other trends", "src": "morning"}, {"id": "719a722a", "name": "3) Mirror TV", "handle": "MirrorTV", "why": "— 30 Oct, 6:49 AM SGT Why: #CelebrityTraitors and James Acaster are trending worldwide around the BBC show's penultimate episode, with the finale tonight (UK time). This post is very fresh, so its views were still low when I read it (83 views), but it links the Mirror's review. Open on X", "text": "Celebrity Traitors review: 'James Acaster has just ended the game for his fellow Traitors', writes @jasmine_allday #CelebrityTraitors\nhttps://t.co/ryxNknLmJ0", "eng": "", "url": "https://x.com/MirrorTV/status/2115938982080999450", "headline": "3) Mirror TV (@MirrorTV) · Celebrity Traitors review: 'James Acaster has just ended the game for his…", "tags": ["@MirrorTV", "x-brief", "other-trends"], "posted": "2026-10-30T06:49:00+08:00", "chars": 157, "sec": "Other trends", "src": "morning"}, {"id": "cabecd4e", "name": "4) FOREVER KIM JISOO", "handle": "ForeverKimJisoo", "why": "— 30 Oct, 6:15 AM SGT Why: BLACKPINK's Jisoo released her pre-release single \"ADDICTED\"; #ADDICTEDtoJISOO and \"ADDICTED BY JISOO OUT NOW\" are trending worldwide. About 153 likes, 100 reposts, 2.1K views. Open on X", "text": "‼️ REMINDER TO EVERYONE ‼️\n\nStart buying “ADDICTED” by JISOO on iTunes at 1 PM KST!\n\nADDICTED BY JISOO OUT NOW\n#ADDICTEDtoJISOO\n#지수솔로_어딕티드에_중독\n\nSource: X only, read through public X search, trends and news at about 6:50 AM SGT. Engagement figures are as X reported them when read. None of the selected posts had an author thread continuation; each is shown in full. Other worldwide trends I saw but didn't include: Binance/SAFU and \"Tether and Circle\" (covered in the finance section), Avengers: Doomsday, Halloween and San Siro.", "eng": "", "url": "https://x.com/ForeverKimJisoo/status/2115930599156572607", "headline": "4) FOREVER KIM JISOO (@ForeverKimJisoo) · ‼️ REMINDER TO EVERYONE ‼️", "tags": ["@ForeverKimJisoo", "x-brief", "other-trends"], "posted": "2026-10-30T06:15:41+08:00", "chars": 529, "sec": "Other trends", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-30", "as_of": "2026-10-30T06:52:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-10-30T06:52:18+08:00"}, "large": {"kind": "large", "items": [{"id": "66e37887", "name": "", "handle": "KobeissiLetter", "why": "", "text": "Who: speculative accounts in CFTC data (hedge funds, CTAs, leveraged funds), per The Kobeissi Letter.\n\nWhat: Net long Nasdaq futures hit +$55B as of Oct 20, the highest on record; up ~$60B since August and ~$19B in October alone, versus a net short of about -$5B in May 2025 and August 2026.\n\nStatus: Put on into Big Tech earnings; now exposed as the earnings week hit tech.\n\nFull post: \"Investors grew extremely bullish on tech heading into Big Tech earnings: Long speculative positioning in Nasdaq futures surged to +$55 billion as of October 20th, its highest on record. This captures hedge funds, Commodity Trading Advisors (CTAs), and other institutional investors such as leveraged funds. Since August, net long positioning in Nasdaq futures soared +$60 billion. In October alone, this figure rose +$19 billion. By comparison, in May 2025 and August 2026, investors held net short positions of -$5 billion. Investor appetite for tech is through the roof.\"", "eng": "", "url": "https://x.com/KobeissiLetter/status/2115895602248864055", "headline": "@KobeissiLetter · Who: speculative accounts in CFTC data (hedge funds, CTAs, leveraged funds),…", "tags": ["@KobeissiLetter", "x-brief", "large-trades"], "posted": "2026-10-30T03:56:37+08:00", "chars": 961, "sec": "Hedge funds, CTAs and leveraged funds: record net long in Nasdaq futures (put on, now exposed)", "src": "large"}, {"id": "5970db2a", "name": "", "handle": "BigBreakingWire", "why": "", "text": "Who: Goldman Sachs prime brokerage hedge fund clients, as relayed on X.\n\nWhat: Clients sold short about $5 of stock for every $1 bought; tech saw the fastest selling since Sept 2024. Separately, Goldman Prime had funds at their highest Mag 7 net exposure since 2022 just before Alphabet's worst day since listing.\n\nStatus: Suffering on the crowded mega-cap long and de-risking. Note this cash-equity picture conflicts with the record-long futures data in item 1.\n\nPosts: \"Hedge Funds Short $5 for Every $1 Bought as Anthropic IPO Raises AI Stock Squeeze Risks. Goldman Sachs data show hedge fund clients sold short approximately $5 worth of stocks for every $1 purcha...\" (post is truncated on X)\n\n\"Goldman Prime: hedge funds sold U.S. tech at the fastest pace since September 2024. Obvious read: bearish. More interesting read: weak positioning is getting flushed fast. If tech stops making new lows while funds keep selling, someone bigger is absorbing it.\"\n\n\"Goldman Prime had hedge funds at their highest Mag 7 net exposure since 2022. Then $GOOGL suffered its worst day since going public. The lesson isn't that mega-cap tech is broken. Crowded trades don't need bad businesses to unwind—just one result that fails to clear impossible...\" (truncated)", "eng": "", "url": "https://x.com/BigBreakingWire/status/2115844141909410204", "headline": "@BigBreakingWire · Who: Goldman Sachs prime brokerage hedge fund clients, as relayed on X.", "tags": ["@BigBreakingWire", "x-brief", "large-trades"], "posted": "2026-10-30T00:32:08+08:00", "chars": 1255, "sec": "Hedge funds at Goldman prime: heavy tech de-grossing and shorting (suffering, cutting risk)", "src": "large"}, {"id": "c206dbdc", "name": "", "handle": "joemccann", "why": "", "text": "Who: Trend-following CTAs, per Joe McCann citing a govvie-futures signal matrix.\n\nWhat: CTA signals \"overwhelmingly Short across most tenors, nearly all Americas and EMEA instruments flash Short,\" with the only long in China 10y.\n\nStatus: Put on; the risk is a bond rally nobody is positioned for.\n\nFull post: \"CTAs are short the long end almost everywhere. The govvie-futures matrix shows CTA signals are \"overwhelmingly Short across most tenors, nearly all Americas and EMEA instruments flash Short,\" with the lone Long sitting on China 10y. When the systematic crowd is this one-sided short bonds, the pain trade is a rally nobody is positioned for.\"", "eng": "", "url": "https://x.com/joemccann/status/2115781525803499950", "headline": "@joemccann · Who: Trend-following CTAs, per Joe McCann citing a govvie-futures signal matrix.", "tags": ["@joemccann", "x-brief", "large-trades"], "posted": "2026-10-29T20:23:19+08:00", "chars": 653, "sec": "CTAs: short the long end of government bond futures almost everywhere (put on)", "src": "large"}, {"id": "8c26ce01", "name": "", "handle": "GryphonIAB", "why": "", "text": "Who: Respondents to BofA's October Fund Manager Survey, as cited by Gryphon Investment Advisors.\n\nWhat: Short Treasuries ranked second most crowded trade (27%); a disorderly rise in yields is the top tail risk (31%). 10y closed at 5.044% and 30y at 5.360% after the Fed; managers cite 6.0% on the 10y as the level to rotate from equities into bonds.\n\nStatus: Put on; crowded short could squeeze on a soft PCE print.\n\nFull post: \"TEN-YEAR TREASURY CLOSES ABOVE 5% AS SHORT-TREASURY TRADE CROWDS. Key Details: The 10-year Treasury yield rose 5.2bp to 5.044% and the 30-year 5.6bp to 5.360% after the Fed, before the 10-year eased to 5.00% in Asian trading. BofA's October Fund Manager Survey ranks short Treasuries as the second most crowded trade at 27%, and names a disorderly rise in yields as the top tail risk at 31%. Impact Assessment: Fund managers cited a 10-year yield of 6.0% as the level that would trigger a rotation from equities into bonds, so the market is 100bp from that threshold. Crowded short positioning means a soft PCE print could drive a sharp front-end rally. A hot print instead lifts mortgage rates from 7.37% and pressures housing equities and long-duration growth stocks.\"", "eng": "", "url": "https://x.com/GryphonIAB/status/2115734256710218104", "headline": "@GryphonIAB · Who: Respondents to BofA's October Fund Manager Survey, as cited by Gryphon…", "tags": ["@GryphonIAB", "x-brief", "large-trades"], "posted": "2026-10-29T17:15:29+08:00", "chars": 1199, "sec": "Global fund managers: short US Treasuries is the 2nd most crowded trade (put on)", "src": "large"}, {"id": "c1a0698a", "name": "", "handle": "0xkyliekim", "why": "", "text": "Who: Tech-focused hedge funds, per Kylie Kim (no underlying source named).\n\nWhat: Nasdaq fell 2.6% in its worst session since June; tech-focused funds down about 10% for the month; crypto liquidations were 82-93% leveraged longs; margin debt about $1.48T in September, near record.\n\nStatus: Suffering.\n\nExcerpt: \"The AI trade wasn't wrong. The sizing was. From October 22 to 29, Nasdaq had its worst session since June, falling 2.6%. Meta dropped 7% after announcing a stock sale, Nvidia fell about 4%, and tech focused hedge funds were down around 10% for the month. ... Margin debt was around $1.48T in September, close to its record. ... a good thesis can still be a terrible trade when everyone is positioned the same way.\"", "eng": "", "url": "https://x.com/0xkyliekim/status/2115752934776717330", "headline": "@0xkyliekim · Who: Tech-focused hedge funds, per Kylie Kim (no underlying source named).", "tags": ["@0xkyliekim", "x-brief", "large-trades"], "posted": "2026-10-29T18:29:43+08:00", "chars": 727, "sec": "Tech-focused hedge funds: down around 10% for October (suffering)", "src": "large"}, {"id": "707ace1f", "name": "", "handle": "jvisserlabs", "why": "", "text": "Who: Jordi Visser.\n\nFull post: \"This weekend I will focus on Oracle investor day and the importance of their discussion on FCF and capital needs. The AI debt financing needs have been the important story of 2026 helping to drive real long yields higher. ORCL started this fear back in Sept of 2025 and based on the reaction so far this week in their bonds and CDS, this narrative may shift going forward. Gavin Baker has talked recently including this week on TBPN about when FCF comes back to the hyperscalers from their external financing needs. Market reacted in a positive way this week to ORCL. Could this be a turn in narrative at a time when a hedge fund deleveraging may have finished?\"", "eng": "", "url": "https://x.com/jvisserlabs/status/2115799723546136930", "headline": "@jvisserlabs · Who: Jordi Visser.", "tags": ["@jvisserlabs", "x-brief", "large-trades"], "posted": "2026-10-29T21:35:38+08:00", "chars": 694, "sec": "Hedge funds: deleveraging may be finished, AI-debt / long-yield narrative may turn (view)", "src": "large"}, {"id": "467ae179", "name": "", "handle": "Mozzienblondes", "why": "", "text": "Who: Hedge funds in CFTC data, per a small account.\n\nWhat: Net short ~1,833 Bcf versus net long ~2,026 Bcf a year ago; gross shorts 599,731 contracts, a record since 2013; the bet is a mild El Nino winter.", "eng": "", "url": "https://x.com/Mozzienblondes/status/2115842202538791001", "headline": "@Mozzienblondes · Who: Hedge funds in CFTC data, per a small account.", "tags": ["@Mozzienblondes", "x-brief", "large-trades"], "posted": "2026-10-30T00:24:26+08:00", "chars": 205, "sec": "Hedge funds: most bearish on US natural gas in 6+ years (put on)", "src": "large"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-30", "as_of": "2026-10-30T12:56:00+08:00", "time_known": true, "file": "large-trades.html", "mtime": "2026-10-30T12:56:11+08:00"     var p={}; dtf.formatToParts(d).forEach(function(x){p[x.type]=x.value});
    return p.weekday+' '+p.day+' '+p.month+' '+p.year+', '+p.hour+':'+p.minute+' SGT';
  }
  var dayF = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  function dayNum(d){var s=dayF.format(d).split('-');return Date.UTC(+s[0],+s[1]-1,+s[2])/864e5}
  function isDateOnly(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)}
  function parse(s){ if(!s) return null; var d = isDateOnly(s) ? new Date(s+'T00:00:00+08:00') : new Date(s); return isNaN(d)?null:d }
  function rel(s, now){
    var d=parse(s); if(!d) return {text:'time n/a', title:'Publication time not stated by the source', old:false};
    if(isDateOnly(s)){
      var n=dayNum(now)-dayNum(d), t = n<=0?'today':(n===1?'yesterday':n+'d ago');
      return {text:t, title:d.toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})+' (date only; time not stated)', old:n>=3};
    }
    var diff=(now-d)/1000, abs=Math.abs(diff), t;
    if(abs<60) t='just now';
    else if(abs<3600) t=Math.round(abs/60)+'m';
    else if(abs<172800) t=Math.floor(abs/3600)+'h';
    else t=Math.floor(abs/86400)+'d';
    if(abs>=60) t = diff>=0 ? t+' ago' : 'in '+t;
    return {text:t, title:fmtSGT(d), old:diff>3*86400};
  }

  function votedList(){

  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
