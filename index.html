<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

     "text": "🇧🇷 Julian Casablancas republicou um novo post sobre a Meta continuar favorecendo Flávio Bolsonaro em suas plataformas, apesar de uma decisão do Tribunal Superior Eleitoral (TSE) que determina tratamento igualitário às campanhas de Lula e Flávio Bolsonaro, às vésperas do segundo turno das eleições, no dia 25 de outubro.\n\n\"O Sleeping Giants Brasil e o CTRL+Z apresentaram novas provas ao Tribunal Superior Eleitoral (TSE) em 19 de outubro, documentando mais evidências de que a Meta continua tratando de forma desigual o Partido dos Trabalhadores (PT), do presidente Luiz Inácio Lula da Silva, e o Partido Liberal (PL), do senador Flávio Bolsonaro, apesar de uma decisão judicial que exige condições iguais para ambas as campanhas, segundo a Folha de S.Paulo.\n\n▪ A petição cita buscas por GIFs no WhatsApp nas quais imagens da campanha de Flávio Bolsonaro apareciam repetidamente entre os principais resultados para o termo “brasil”, em três contas diferentes. Enquanto isso, o Instagram exibia três imagens de Bolsonaro, mas apresentava apenas o nome de Lula em texto.\n\n▪ As buscas por “ladrão” no WhatsApp retornaram uma caricatura de Lula usando roupas de presidiário e a mensagem: “Apoiar o Partido dos Trabalhadores é uma doença mental”.\n\n▪ Nas buscas por Lula no Instagram, a plataforma sugeria primeiro a hashtag “#lulaladrão”, enquanto a “#bolsonaronuncamais” aparecia entre as últimas sugestões nas buscas por Bolsonaro.\n\n▪ Os grupos também questionaram a Meta AI depois que solicitações separadas para escolher aleatoriamente um número entre 1 e 25 resultaram nos números 13 e 22, respectivamente os números de urna de Lula e Flávio Bolsonaro. Eles reconheceram que esses testes, por si só, não comprovam viés político, mas defenderam maior transparência sobre como os sistemas da Meta geram e classificam resultados.\n\n▪ A petição exige que as correções sejam feitas em até 24 horas, que a empresa explique os critérios de classificação dos algoritmos e as respostas da inteligência artificial, além de cobrar a aplicação da multa diária de R$ 500 mil já estabelecida. O ministro Marco Aurélio Bellizze alertou que a penalidade poderia dobrar para R$ 1 milhão em caso de descumprimento continuado. O tribunal manteve a decisão, e o ministro voltou a exigir comprovação do cumprimento da ordem em 18 de outubro.\n\n▪ Anteriormente, a Meta negou favorecer deliberadamente qualquer candidato, atribuindo problemas anteriores a falhas técnicas. Até a publicação do post, a empresa ainda não havia respondido às novas evidências.\n\n▪ Além da ação judicial, o Sleeping Giants Brasil e o CTRL+Z anunciaram um protesto em frente à sede da Meta em São Paulo, com o slogan “Meta, tire as mãos das nossas eleições”, exigindo responsabilização e transparência na disputa presidencial brasileira.\"",

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-10-23T05:54:38+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "89aa9db1", "name": "1) The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Equity-market structure: index concentration at a record. Highest engagement among macro/market posts found today (about 2,611 likes, 393 reposts, 275K views).", "text": "— 21 Oct, 10:14am SGT\n\nBREAKING: The 15 largest S&P 500 stocks now account for a record 46.7% of the index's market value.\n\nBy comparison, during the 2000 Dot-Com Bubble, the 15 largest stocks accounted for 27.2% of the S&P 500.\n\nThe remaining 485 stocks represent just 53.3% of the S&P 500's market cap.\n\nThis comes as Nvidia, $NVDA, Apple, $AAPL, Alphabet, $GOOGL, and Microsoft, $MSFT, account for 7.5%, 7.1%, 5.9%, and 5.6%, respectively, or 26.1% combined.\n\nThis means just 4 stocks account for more than the next 11 combined.\n\nFurthermore, the combined market cap of the 5 largest stocks now equals that of the bottom 434 stocks in the index, the largest gap on record.\n\nMarket concentration is at historic extremes.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2112729083876405561", "headline": "1) The Kobeissi Letter (@KobeissiLetter) · — 21 Oct, 10:14am SGT", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-21T10:14:00+08:00", "chars": 722, "src": "morning"}, {"id": "21c68f00", "name": "2) Holger Zschaepitz", "handle": "Schuldensuehner", "why": "Euro sovereign stress: France's 10-year yield crossed 5% for the first time since 2002 and was one of the biggest bond stories on X. About 512 likes, 137 reposts, 35K views. Barchart's companion post (\"France's 10-Year Bond Yield jumps to highest level in more than 22 years\") had about 600 likes: https://x.com/Barchart/status/2112988439394058505", "text": "— 21 Oct, 4:07pm SGT\n\nDeutsche CEO Sewing sounds the alarm on #France: Its fiscal & political instability is a \"wake up call\" for Europe. The bond mkt is flashing red: France's 10y spread over Germany has surged to 156bps, highest since 2011. Not a debt crisis yet, Sewing says. [link and chart in post]", "eng": "", "url": "https://x.com/Schuldensuehner/status/2112817916437553654", "headline": "2) Holger Zschaepitz (@Schuldensuehner) · — 21 Oct, 4:07pm SGT", "tags": ["@Schuldensuehner", "x-brief"], "posted": "2026-10-21T16:07:00+08:00", "chars": 303, "src": "morning"}, {"id": "cb854586", "name": "3) Jim Bianco", "handle": "biancoresearch", "why": "Rates and inflation regime call, a full 4-part thread arguing for a 3% inflation / 5% yield world. Lead post about 136 likes, 29K views.", "text": "— 21 Oct, 11:06pm SGT\n\n1/4\n\nThe WSJ surveyed 71 economists (repost) and this graphic is their outlook on inflation (cyan dots).\n—-\nThis has been the constant economic forecast for 5-plus years, in 18 to 24 months inflation will be back to 2%.\n\nAnd for 5-plus years it has been constantly wrong.\n\n🧵 [chart in post]\n\n2/4\n\nBloomberg runs a similar survey every month.\n\nThe thick black line below shows actual CPI inflation.\n\nThe various colored lines are monthly forecasts projecting the next six quarters.\n\nEach color represents a different calendar-year forecast. [chart in post]\n\n3/4\n\nThe chart above shows economists have continuously making the same call as the WSJ survey, in 18 to 24 months inflation will 2%.\n\nIt has been continuously wrong.\n\nWhy?\n\n4/4\n\nWe addressed it in the inflation section of this post.\n\nTL:dr - the era of goods deflation from China is over.\n\nIt's over by choice, as neither political party wants globalization back.\n\nWithout goods deflation we are a 3% inflation economy with 5% yields.\n\nGet used to it. [quotes his Oct 5 article \"Q4 Outlook: The Case For Bonds\"]", "eng": "", "url": "https://x.com/biancoresearch/status/2112923531063472554", "headline": "3) Jim Bianco (@biancoresearch) · — 21 Oct, 11:06pm SGT", "tags": ["@biancoresearch", "x-brief"], "posted": "2026-10-21T23:06:40+08:00", "chars": 1092, "src": "morning"}, {"id": "988464cf", "name": "4) Lisa Abramowicz", "handle": "lisaabramowicz1", "why": "Credit: high-yield spreads over investment grade are the widest since May 2025, a risk-off signal under the equity rally. Two connected posts, about 226 and 182 likes (24K and 14K views).", "text": "— 21 Oct, 6:34pm and 6:59pm SGT\n\nThe up-in-quality trade is alive and well. Investors are demanding the greatest amount of extra yield to own high-yield bonds over investment-grade bonds since right after liberation day in May 2025. [chart in post]\n\n(follow-up, https://x.com/lisaabramowicz1/status/2112861314481832300)\nYou can see this even more in the gap between spreads on the lowest-rated investment-grade bonds and Caa rated corporate bonds, which is the widest since 2020. [chart in post]", "eng": "", "url": "https://x.com/lisaabramowicz1/status/2112854952947409075", "headline": "4) Lisa Abramowicz (@lisaabramowicz1) · — 21 Oct, 6:34pm and 6:59pm SGT", "tags": ["@lisaabramowicz1", "x-brief"], "posted": "2026-10-21T18:34:10+08:00", "chars": 495, "src": "morning"}, {"id": "dfb9cb1b", "name": "5) zerohedge", "handle": "zerohedge", "why": "Broad macro wrap: French yields, UK inflation and BoE hike odds, RBA, Treasury ownership shifting to hedge funds, Hormuz oil flows, and Goldman's note on record hedge-fund selling of tech. About 240 likes, 90K views.", "text": "— 21 Oct, 8:13pm SGT\n\nTop Overnight News\n\nAnthropic could spend $750 billion on additional computing power in the coming years, the WSJ reported, citing a draft IPO prospectus, while billionaire Ken Griffin said investors are \"almost certainly\" in the midst of an AI bubble. BBG\n\nNvidia is in talks to invest hundreds of millions of dollars in Australian AI cloud provider Firmus. The Information\n\nNasdaq futures rose after SpaceX and Super Micro topped forecasts, reigniting the AI trade. Adding to the buzz, Elon Musk said SpaceX and Tesla are studying a potential merger that would be the biggest ever. BBG\n\nPersian Gulf oil exports have surpassed prewar levels, as an improvised shipping system under U.S. protection is helping tankers move oil through one of Iran's fiercest waves of attacks in the Strait of Hormuz. WSJ\n\nBenjamin Netanyahu is pushing to resume large-scale strikes against Iran and had instructed his military to plan for a major new offensive earlier this month, moves that risk plunging the region back into full-scale war. FT\n\nMore Oil Is Now Coming Out of the Persian Gulf Than Before the Iran War: WSJ\n\n\"Given that the White House has shown no willingness to reach an understanding on the way forward, while also threatening more violence, there is little reason to expect progress now,\" Iranian FM Araghchi said in an FT op-ed. BBG\n\nUKMTO received a late report of a tanker struck by an unknown projectile 30 nautical miles southeast of Al Faw, Iraq, on Tuesday; crew reported safe. BBG\n\nFrench yields rose above 5% for the first time since 2002 as persistent fiscal concerns continued to weigh on bonds BBG\n\nU.K. inflation rose further above the Bank of England's target in September as policymakers prepare for a meeting that investors expect will yield a first rate increase since the start of the war between the U.S. and Iran. WSJ\n\nBritain's national debt topped £3 trillion for the first time as the government borrowed more than forecast in the first half of the fiscal year. BBG\n\nAustralia's inflation outlook looks \"materially worse\" than previously expected, RBA Deputy Governor Andrew Hauser said, bolstering expectations for a fifth hike this year in November. BBG\n\nJapan's exports rose 16.7% in September, missing forecasts despite an increase in chip shipments. South Korea's exports jumped 65.9% in early October, powered by a more than 220% semiconductor surge. BBG\n\nLeaders of Ukraine, Finland and Norway hailed progress in talks in Oslo on Tuesday about how to end Russia's war in Ukraine, but they did not announce any breakthroughs. \"I think we made genuine progress today,\" said Finnish President Alexander Stubb, who co-hosted the talks with Norwegian Prime Minister Jonas Gahr Støre at the request of Ukraine. FT\n\nElon Musk ordered a slowdown of Ukraine's military-grade Starlink service, and Musk and Trump discussed the decision in a subsequent call. WSJ\n\nThe US is increasingly reliant on price-sensitive private investors to fund its debt as traditional buyers retreat. Hedge funds and other private investors now own about 70% of Treasuries, helping drive yields higher. BBG\n\nUS President Trump posted that he is watching data centres closely\n\nUS and Mexican negotiators hit an impasse over tariffs on steel and aluminum, dashing earlier optimism. BBG\n\nNational Democrats sued Trump and the US Justice Department over what they say is a coordinated effort to erode confidence in the midterms. BBG\n\nJPM's Mark Schilsky puts buyside consensus for Meta's 2027 opex plus capex at $435-475 billion, and says a majority of investors still expect an equity raise post-Q3. JPM\n\nGoldman estimates global crude freight rates are above $20/bbl, about 7x a year ago, with the Hormuz war-risk premium alone accounting for about $7/bbl. GS\n\nOver the past two weeks, HFs aggressively net sold global Info Tech stocks at the fastest pace in the past decade (-3.3 SDs), driven by long-and-short sales. Net allocation to Global AI stocks now sits in the 38th percentile while aggregate long/short ratio is in the 6th percentile vs. the past year. GS", "eng": "", "url": "https://x.com/zerohedge/status/2112880047765811239", "headline": "5) zerohedge (@zerohedge) · — 21 Oct, 8:13pm SGT", "tags": ["@zerohedge", "x-brief"], "posted": "2026-10-21T20:13:53+08:00", "chars": 4087, "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-22", "as_of": "2026-10-22T06:52:00+08:00", "time_known": true, "file": "morning.html", "mtime": "20   var REPO='vikasgelara-ship-it/news-dashboard';
  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});
  }
  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){

      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports, finance and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each); X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
