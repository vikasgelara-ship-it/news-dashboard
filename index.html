<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-11-07T05:47:12+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "08b4ef88", "name": "1. The Kobeissi Letter", "handle": "KobeissiLetter", "why": "The best single explainer of Thursday's US equity rout (Nasdaq 100's worst day since 2020) covering price action, the AI-regulation scare, chip-sector concentration, record leverage via levered ETFs, the VIX spike and suspected institutional liquidations. Lead post: 429,482 views, 3,263 likes, 491 reposts, 1,071 bookmarks.", "text": "(6 Nov, 5:30am SGT)\n\nFull 13-post thread in order (post 12 is the author's own subscription plug). Charts attached to each post are not reproduced here.\n[1/13] What just happened? The Nasdaq 100 just posted its largest daily drop since the 2020 Pandemic, with the S&P 500 erasing -$3 trillion today. Just 24 hours ago, the Dow surged +1,600 points after the Democrats \"swept\" the Midterms. So, what changed? Let us explain. (a thread)\n\n[2/13] To better understand what happened today, we must first break down the price action. At market open, stocks were down less than 1% and selling pressure began to build at 10 AM ET. This was followed by a series of lower highs, which were followed by persistent selling pressure.\n\n[3/13] During days like today, investors need to ask: what fundamentally changed? Why did the S&P 500 add +$1.2 trillion 24 hours ago then erase -$3 trillion today. We dug into the potential fundamental drivers of today's decline. One stuck out, but it still doesn't add up.\n\n[4/13] A post from a Democratic Congresswoman began as a mere opinion on X yesterday afternoon. Today, this post has over 12 million views with several other members of Congress agreeing. At the surface, markets could be pricing-in this supposed \"ban,\" or strict regulation.\n\n[5/13] In our view, a ban of AI will not happen in the US (with near-certainty). Such a ban, if even possible to enforce, would mean the US surrendering its position in the global AI race to China. That won't happen. We believe today's decline was more technical than fundamental.\n\n[6/13] The market had already been concerned about AI profitability, CapEx, and Free Cash Flow. After the election results, we saw a brief rally amid the $VIX crush. However, as selling pressure mounted early today, sentiment shifted and these concerns were quickly exacerbated.\n\n[7/13] This is especially evident in how concentrated selling pressure was in chip stocks. The S&P 500 excluding tech fell ~2.5% today while chip stocks fell nearly -11%. The AI trade became \"nervous\" and today's downturn was a largely a product of fear and sentiment shifting.\n\n[8/13] Then came the leverage. Not only is leverage at a record, but investors bought the dip into Election Day with even more of it. US levered ETFs attracted +$15 billion in inflows in October, their largest 1-month rolling inflow in at least 2 years. This amplified today's drop.\n\n[9/13] The Volatility Index, $VIX, was further evidence of the emotional nature behind today's selloff. Today's +63% rally in the $VIX marks the 5th largest spike in recent history. We also believe several large institutional players were liquidated during today's trading session.\n\n[10/13] This is why it is important to zoom out. There will certainly be change in markets, the economy, and policy with the Midterm results. However, this does not mean AI is \"over.\" It is simply an adjustment. We remain in the midst of the biggest technological revolution history.\n\n[11/13] Lastly, technical corrections are healthy. Even a decline of 5-10% from current levels would be within a \"healthy\" correction. History says Midterms are exceptional buying opportunities. The S&P 500 has returned +17.2% on average in the year following Midterms since 1950.\n\n[12/13] Markets currently facing some of their most uncertain times in recent history. Our research aims to anticipate the swings in the market. Want to access our premium research? Subscribe at the link below to access our latest analysis and alerts: https://t.co/kv5b3o84zI\n\n[13/13] The reality is that volatility is normal and healthy for markets. Over the last 4 years, many investors have forgotten this, and today's price action was evidence of that. We expect an eventful Q4 ahead. Follow us @KobeissiLetter for real time analysis as this develops.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2118455887413285205", "headline": "1. The Kobeissi Letter (@KobeissiLetter) · (6 Nov, 5:30am SGT)", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-11-06T05:30:17+08:00", "chars": 3804, "sec": "Finance / markets", "src": "morning"}, {"id": "8c4c7a23", "name": "", "handle": "KobeissiLetter", "why": "", "text": "To better understand what happened today, we must first break down the price action. At market open, stocks were down less than 1% and selling pressure began to build at 10 AM ET. This was followed by a series of lower highs, which were followed by persistent selling pressure.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2118455890286117191", "headline": "@KobeissiLetter · To better understand what happened today, we must first break down the price…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-11-06T05:30:17+08:00", "chars": 277, "sec": "Finance / markets", "src": "morning"}, {"id": "37153c2a", "name": "", "handle": "KobeissiLetter", "why": "", "text": "During days like today, investors need to ask: what fundamentally changed? Why did the S&P 500 add +$1.2 trillion 24 hours ago then erase -$3 trillion today. We dug into the potential fundamental drivers of today's decline. One stuck out, but it still doesn't add up.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2118455893041811691", "headline": "@KobeissiLetter · During days like today, investors need to ask: what fundamentally changed? Why…", "tags": ["@KobeissiLetter", "x-brief" "@KobeissiLetter · Markets currently facing some of their most uncertain times in recent history.…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-11-06T05:30:24+08:00", "chars": 267, "sec": "Finance / markets", "src": "morning"}, {"id": "e2e01b6b", "name": "", "handle": "KobeissiLetter", "why": "", "text": "The reality is that volatility is normal and healthy for markets. Over the last 4 years, many investors have forgotten this, and today's price action was evidence of that. We expect an eventful Q4 ahead. Follow us @KobeissiLetter for real time analysis as this develops.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2118455920468353264", "headline": "@KobeissiLetter · The reality is that volatility is normal and healthy for markets. Over the…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-11-06T05:30:25+08:00", "chars": 270, "sec": "Finance / markets", "src": "morning"}, {"id": "d7141faf", "name": "2. unusual_whales", "handle": "unusual_whales", "why": "(6 Nov, 5:34am SGT) https://x.com/unusual_whales/status/2118456823011242185 Why: The headline index number for the session. Highest-engagement finance post found: 252,776 views, 4,464 likes, 537 reposts. Note other posts quote the Nasdaq Composite at about -5.4% to -5.5%; this one refers to the Nasdaq 100. BREAKING: The Nasdaq 100 closed down 6.4%, its worst day since the COVID crash on March 16, 2020.", "text": "", "eng": "", "url": "https://x.com/unusual_whales/status/2118456823011242185", "headline": "2. unusual_whales (@unusual_whales) · (6 Nov, 5:34am SGT) https://x.com/unusual_whales/status/2118456823011242185…", "tags": ["@unusual_whales", "x-brief"], "posted": "2026-11-06T05:34:00+08:00", "chars": 0, "sec": "Finance / markets", "src": "morning"}, {"id": "80ec2e45", "name": "3. EndGame Macro", "handle": "onechancefreedm", "why": "The rates angle: bull steepening, 2s10s around 34bp, and what Treasuries plus gold plus weaker copper say about growth versus inflation. 6,312 views, 35 likes, 19 bookmarks. It quotes a post arguing bonds lacked a safe-haven bid; that quoted post's text wasn't fully available, so it isn't reproduced.", "text": "(6 Nov, 1:38am SGT)\n\nThe Bond Market Is Pricing a Growing Threat to the U.S. Economy Treasury yields are falling across nearly the entire curve, meaning bond prices are rising. The 2 year yield is down 8.3 basis points, the 5 year down 7.1, the 10 year down 5.1 and the 30 year down 2.5. That’s evidence of buying, not an absence of demand. More importantly, we’re witnessing a bull steepening of the yield curve. Shorter maturity yields are declining considerably faster than longer maturities, widening the 2 year to 10 year spread to approximately 34 basis points. This is consistent with investors reassessing future economic growth and monetary policy, not abandoning Treasuries as a safe haven. The distinction between real growth and inflation matters enormously. 3rd quarter nominal GDP grew 5.6% annualized, with real growth contributing approximately 3.4% and price increases accounting for roughly 2.1%. Nearly 40% of nominal growth reflects inflation. Strong nominal growth driven by expanding production carries very different implications than growth increasingly dependent on higher prices. Now consider what happens if real economic activity deteriorates while the energy shock keeps inflation elevated. Expected nominal growth can decline even without meaningful disinflation. Shorter Treasury yields may fall as markets anticipate weaker growth and eventually less restrictive Fed policy, while longer yields remain elevated because of inflation uncertainty and risk premiums. That’s what makes today’s price action concerning. AI infrastructure stocks are collapsing, copper is weakening, gold is strengthening and Treasuries are rallying. Together, these movements suggest growing concerns about future economic activity, although markets are not yet pricing an imminent recession or Fed reversal. Gold attracting safe haven demand doesn’t invalidate Treasury demand. Both can rally as investors seek protection against different risks. More importantly, the curve is steepening after an extended inversion, a pattern historically associated with rising recession risks when driven by deteriorating growth expectations and anticipated monetary easing. The real danger is that economic growth deteriorates faster than inflation subsides, leaving the Fed with limited options while long term borrowing costs remain restrictive. Investors are buying Treasuries as concerns grow over the sustainability of economic growth and the increasingly stretched valuations built upon it. The bond market is signaling growing economic uncertainty, not an absence of buyers.", "eng": "", "url": "https://x.com/onechancefreedm/status/2118397623749009689", "headline": "3. EndGame Macro (@onechancefreedm) · (6 Nov, 1:38am SGT)", "tags": ["@onechancefreedm", "x-brief"], "posted": "2026-11-06T01:38:46+08:00", "chars": 2579, "sec": "Finance / markets", "src": "morning"}, {"id": "4b0372ef", "name": "4. Charlie Bilello", "handle": "charliebilello", "why": "(6 Nov, 6:04am SGT) https://x.com/charliebilello/status/2118464533089890348 Why: Volatility regime check: historical rank of the VIX move. 21,439 views, 196 likes, 49 reposts. Kobeissi's thread puts the move at +63%; the two posts use different figures. The $VIX spiked 70% higher today, the 3rd largest 1-day % increase in history (note: $VIX data goes back to 1990).", "text": "", "eng": "", "url": "https://x.com/charliebilello/status/2118464533089890348", "headline": "4. Charlie Bilello (@charliebilello) · (6 Nov, 6:04am SGT) https://x.com/charliebilello/status/2118464533089890348…", "tags": ["@charliebilello", "x-brief"], "posted": "2026-11-06T06:04:38+08:00", "chars": 0, "sec": "Finance / markets", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-06", "as_of": "2026-11-06T06:49:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-11-06T06:49:59+08:00"}, "large": {"kind": "large", "items": [{"id": "9ab37307", "name": "First Squawk", "handle": "FirstSquawk", "why": "", "text": "HEDGE FUND WALLEYE TO RETURN PART OF ITS CAPITAL: CLIENT LETTER", "eng": "", "url": "https://x.com/FirstSquawk/status/2118377365646754167", "headline": "First Squawk (@FirstSquawk) · HEDGE FUND WALLEYE TO RETURN PART OF ITS CAPITAL: CLIENT LETTER", "tags": ["@FirstSquawk", "x-brief", "large-trades"], "posted": "2026-11-06T00:18:16+08:00", "chars": 63, "sec": "Walleye Capital (~$17B multi-strategy)", "src": "large"}, {"id": "9fa221f9", "name": "zerohedge", "handle": "zerohedge", "why": "", "text": "Hedge Fund Walleye Returns Capital, Fires Head Of Equities After Worst Month Since COVID: Read The Full Letter", "eng": "", "url": "https://x.com/zerohedge/status/2118434535897542985", "headline": "zerohedge (@zerohedge) · Hedge Fund Walleye Returns Capital, Fires Head Of Equities After Worst Month…", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-06T04:05:26+08:00", "chars": 110, "sec": "Walleye Capital (~$17B multi-strategy)", "src": "large"}, {"id": "51979dee", "name": "Nishant Kumar", "handle": "nishantkumar07", "why": "", "text": "EXCLUSIVE: Walleye to Return Some Capital Following Brutal October", "eng": "", "url": "https://x.com/nishantkumar07/status/2118410737530118342", "headline": "Nishant Kumar (@nishantkumar07) · EXCLUSIVE: Walleye to Return Some Capital Following Brutal October", "tags": ["@nishantkumar07", "x-brief", "large-trades"], "posted": "2026-11-06T02:30:52+08:00", "chars": 66, "sec": "Walleye Capital (~$17B multi-strategy)", "src": "large"}, {"id": "e77fb91f", "name": "TheBigBerbowski", "handle": "TheBigBerbowski", "why": "", "text": "Bloomberg reports that hedge fund Walleye Capital plans to return part of its capital to investors. Some context: Walleye reportedly lost nearly 6% in October and is now negative for 2026. Why does this matter given today's correction? When leveraged hedge funds reduce the capital they manage, they may also need to reduce their positions. That means selling longs, covering shorts and unwinding trades. If enough funds are doing this simultaneously, selling pressure can accelerate, even in companies where nothing fundamentally changed. Now, returning capital doesn't necessarily mean forced liquidation. We also have no evidence that Walleye is responsible for today's selloff. But I think it's worth watching. The market was already under pressure, particularly AI and semiconductor names. If leveraged funds start reducing exposure on top of that, things can get ugly pretty quickly. The question is whether we're simply seeing investors reassess valuations or whether deleveraging is starting to amplify the correction.", "eng": "", "url": "https://x.com/TheBigBerbowski/status/2118387793256755700", "headline": "TheBigBerbowski (@TheBigBerbowski) · Bloomberg reports that hedge fund Walleye Capital plans to return part of its…", "tags": ["@TheBigBerbowski", "x-brief", "large-trades"], "posted": "2026-11-06T00:59:42+08:00", "chars": 1026, "sec": "Walleye Capital (~$17B multi-strategy)", "src": "large"}, {"id": "40572886", "name": "Martin Shkreli", "handle": "MartinShkreli", "why": "", "text": "lots of pods closing including an entire division of a fund", "eng": "", "url": "https://x.com/MartinShkreli/status/2118366774316187832", "headline": "Martin Shkreli (@MartinShkreli) · lots of pods closing including an entire division of a fund", "tags": ["@MartinShkreli", "x-brief", "large-trades"], "posted": "2026-11-05T23:36:11+08:00", "chars": 59, "sec": "Multi-strat pods and Engineers Gate (Synthesis equity team)", "src": "large"}, {"id": "cfea60d5", "name": "BullRush", "handle": "BullRush__", "why": "", "text": "Pods closing, an entire division of a fund shut down, per Shkreli. Makes sense after a -5% day on $QQQ with no major headline. Quick reminder: a pod is a trading team (a PM and a few analysts) inside a multi-manager hedge fund like Millennium, Citadel or Point72. Each pod runs", "eng": "", "url": "https://x.com/BullRush__/status/2118369380677431338", "headline": "BullRush (@BullRush__) · Pods closing, an entire division of a fund shut down, per Shkreli. Makes sense…", "tags": ["@BullRush__", "x-brief", "large-trades"], "posted": "2026-11-05T23:46:32+08:00", "chars": 277, "sec": "Multi-strat pods and Engineers Gate (Synthesis equity team)", "src": "large"}, {"id": "8b0fd2c0", "name": "Special Situations", "handle": "SpecialSitsNews", "why": "", "text": "Comprehensive list of hedge funds blowing up this week, getting large redemptions, or shutting down PMs: - Axebrook - Walleye - Engineers Gate - Lone Pine - Millennium internal pods - Verition pods - Samlyn Letter from Walleye closing internal funds below", "eng": "", "url": "https://x.com/SpecialSitsNews/status/2118415084280242230", "headline": "Special Situations (@SpecialSitsNews) · Comprehensive list of hedge funds blowing up this week, getting large…", "tags": ["@SpecialSitsNews", "x-brief", "large-trades"], "posted": "2026-11-06T02:48:08+08:00", "chars": 255, "sec": "Multi-strat pods and Engineers Gate (Synthesis equity team)", "src": "large"}, {"id": "08c091d8", "name": "Melvin", "handle": "MelvinInvests", "why": "", "text": "Things are getting REALLY ugly across the hedge fund industry. We're now seeing reports of multiple hedge funds facing significant losses, investor redemptions, and entire trading teams being shut down. Walleye Capital is cutting a substantial portion of its internal long/short business and returning capital to investors after a brutal October. Millennium has reportedly pulled more than $1.5 billion in leveraged capital from two outside managers, while Lone Pine is now facing rumors of a complete collapse, although those claims remain unconfirmed. And these are just some of the names we're hearing about. Reports are also circulating about problems at several other funds and individual trading pods. What concerns me is how quickly this could spread. A hedge fund doesn't need to go bankrupt to create significant selling pressure. Sometimes all it takes is a few large investors requesting their money back, a prime broker tightening financing, or management deciding to cut risk across the board. And when billions of dollars are being pulled out of leveraged portfolios, those positions have to be reduced somewhere. The question now is how much of this selling has already happened and how many more funds are still sitting on losses that could force them to liquidate positions over the coming days. I think we're going to find out that the damage across Wall Street is considerably worse than what the market has priced in.", "eng": "", "url": "https://x.com/MelvinInvests/status/2118446091855098077", "headline": "Melvin (@MelvinInvests) · Things are getting REALLY ugly across the hedge fund industry. We're now…", "tags": ["@MelvinInvests", "x-brief", "large-trades"], "posted": "2026-11-06T04:51:21+08:00", "chars": 1437, "sec": "Multi-strat pods and Engineers Gate (Synthesis equity team)", "src": "large"}, {"id": "d1f7eb3f", "name": "zerohedge", "handle": "zerohedge", "why": "", "text": "*Hedge Fund Lone Pine Suffered Worst Three-Month Stretch in 3Q, Source Says -- WSJ", "eng": "", "url": "https://x.com/zerohedge/status/2118526550656053651", "headline": "zerohedge (@zerohedge) · *Hedge Fund Lone Pine Suffered Worst Three-Month Stretch in 3Q, Source Says --…", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-06T10:11:04+08:00", "chars": 82, "sec": "Lone Pine Capital (~$19–20B long/short equity)", "src": "large"}, {"id": "a9c90104", "name": "Liquid", "handle": "liquidtrading", "why": "", "text": "JUST IN: Rumor has it Lone Pine Capital, a 20 BILLION dollar Hedge Fund, has collapsed amidst current market conditions. Their largest holdings consist of: $NBIS $ASML $STX $AMAT $HUT", "eng": "", "url": "https://x.com/liquidtrading/status/211843468082327165   function votedList(){

  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());

        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');

    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());

    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
