<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-11-27T05:40:28+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "db16aabc", "name": "", "handle": "i", "why": "Rates / flows: BofA's Hartnett says stay risk-off until the 10-year Treasury yield falls below 4.5%. About 131K views when read.", "text": "1.1 X post\n\nBOFA'S HARTNETT: STAY RISK-OFF UNTIL TREASURY YIELDS FALL BELOW 4.5% Bank of America's Michael Hartnett warns investors to remain risk-off until financial conditions ease. His key conditions for turning bullish: 🔸 10-year Treasury yield below 4.5% — potentially December or", "eng": "", "url": "https://x.com/i/status/2121233841327112651", "headline": "@i · 1.1 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-13T21:28:53+08:00", "chars": 285, "sec": "Finance / markets", "src": "morning"}, {"id": "45c954d2", "name": "", "handle": "i", "why": "FX / central banks: Bloomberg says the dollar is heading for its strongest weekly gain in over a month on expectations of a Fed hike next month. About 20K views when read.", "text": "1.2 X post\n\nThe dollar is heading for its strongest weekly advance in more than a month, extending a rally fueled by growing expectations that the Fed will increase interest rates next month https://t.co/WMtgQtc9oc", "eng": "", "url": "https://x.com/i/status/2121319714253119896", "headline": "@i · 1.2 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T03:10:06+08:00", "chars": 214, "sec": "Finance / markets", "src": "morning"}, {"id": "50c2de9f", "name": "", "handle": "i", "why": "FX: FinancialJuice flags suspected yen intervention (headline only, no details in the post). About 55K views when read.", "text": "1.3 X post\n\n🔴 Suspected Yen Intervention", "eng": "", "url": "https://x.com/i/status/2121305403199717512", "headline": "@i · 1.3 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T02:13:14+08:00", "chars": 40, "sec": "Finance / markets", "src": "morning"}, {"id": "57acf289", "name": "", "handle": "i", "why": "Rates / central banks: Fed report says respondents flagged deficits and heavy Treasury issuance could trigger a disorderly rise in yields. About 27K views when read.", "text": "1.4 X post\n\nSeveral respondents flagged concerns that ongoing deficits and extensive Treasury issuance could prompt disorderly yield increases: Fed report", "eng": "", "url": "https://x.com/i/status/2121347803586994367", "headline": "@i · 1.4 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T05:01:43+08:00", "chars": 154, "sec": "Finance / markets", "src": "morning"}, {"id": "66a99047", "name": "", "handle": "i", "why": "Equity themes: Goldman Sachs sees the S&P 500 at 8,700 in 2027, about 14% upside from 7,619. About 134K views when read.", "text": "1.5 X post\n\nGOLDMAN SACHS SEES S&P 500 HITTING 8,700 IN 2027 Goldman Sachs forecasts the S&P 500 reaching 8,700 over the next 12 months, implying 14% upside from 7,619 and a 16% total return including dividends. Chief global equity strategist Peter Oppenheimer expects 11% earnings growth", "eng": "", "url": "https://x.com/i/status/2121227192054985163", "headline": "@i · 1.5 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-13T21:02:27+08:00", "chars": 288, "sec": "Finance / markets", "src": "morning"}, {"id": "481d4333", "name": "", "handle": "i", "why": "Volatility / equities: Nasdaq 100 fell 2.4% to its intraday low on Friday, S&P 500 down 1.1% at that point. About 75K views when read.", "text": "1.6 X post\n\n*NASDAQ 100 FALLS 2.4% TO INTRADAY LOW; S&P 500 DOWN 1.1%", "eng": "", "url": "https://x.com/i/status/2121273475755065553", "headline": "@i · 1.6 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T00:06:22+08:00", "chars": 69, "sec": "Finance / markets", "src": "morning"}, {"id": "2f784041", "name": "", "handle": "i", "why": "Equities: US close wrap says the S&P 500 slipped as chipmaker weakness overshadowed inflation data. Article not opened. About 25K views when read.", "text": "1.7 X post\n\nS&P 500 Slips as Chipmaker Weakness Overshadows Inflation Data – US Market Wrap https://t.co/Jy26McNAsz", "eng": "", "url": "https://x.com/i/status/2121352760159563816", "headline": "@i · 1.7 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T05:21:25+08:00", "chars": 115, "sec": "Finance / markets", "src": "morning"}, {"id": "b235f7f5", "name": "", "handle": "i", "why": "Flows / hedge funds: post says non-dealer positioning in US equity futures is up $330bn, its 2nd highest on record, with asset managers, hedge funds and CTAs all long. Small account, very few views, unverified; treat with caution.", "text": "1.8 X post\n\nNon-dealer positioning in US equity futures is up +$330 billion, its 2nd-highest on record. Asset managers, hedge funds and CTAs are all long. Stretched positioning has historically capped upside as inflows stall, not a top. https://t.co/HLdjwlVT6x", "eng": "", "url": "https://x.com/i/status/2121302464683208766", "headline": "@i · 1.8 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T02:01:34+08:00", "chars": 260, "sec": "Finance / markets", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-14", "as_of": "2026-11-14T19:00:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-11-18T12:23:36+08:00"}, "large": {"kind": "large", "items": [{"id": "02c789c4", "name": "", "handle": "DeItaone", "why": "", "text": "Who: Leveraged funds (Nasdaq futures) and hedge funds, per Goldman Sachs (Christian Mueller-Glissmann)\nWhat: Leveraged funds cut roughly $70B of Nasdaq futures exposure last week; hedge funds cut net leverage. Goldman's sentiment/positioning indicator fell to the 36th percentile, lowest since Liberation Day, while retail kept buying the tech dip.\nPut on or suffering: SUFFERING / forced cut (de-risking of index futures length)\n\nSource: (*Walter Bloomberg), 2026-11-24 21:49 SGT\n\n$SPY $QQQ - GOLDMAN SAYS MARKET POSITIONING SIGNALS ABOVE-AVERAGE S&P 500 RETURNS Goldman Sachs says its sentiment and positioning indicator has fallen to the 36th percentile, its lowest since Liberation Day, historically a favorable level for future equity returns. Strategist Christian Mueller-Glissmann notes that S&P 500 returns have historically been above average across multiple time horizons when positioning falls into the 30th–40th percentile range. Leveraged funds cut approximately $70 billion in Nasdaq futures exposure last week, while hedge funds reduced net leverage. Meanwhile, retail investors continue buying the tech dip, with roughly $15 billion in leveraged tech ETF flow shifts since late September. Goldman sees the sharp positioning reset as a potentially supportive setup for a market recovery.", "eng": "", "url": "https://x.com/DeItaone/status/2125225331447492801", "headline": "@DeItaone · Who: Leveraged funds (Nasdaq futures) and hedge funds, per Goldman Sachs…", "tags": ["@DeItaone", "x-brief", "large-trades"], "posted": "2026-11-24T21:49:38+08:00", "chars": 1302, "sec": "Leveraged funds dump ~$70B of Nasdaq futures; Goldman positioning gauge at lowest since Liberation Day", "src": "large"}, {"id": "35ddccc0", "name": "", "handle": "KeithTradeSmith", "why": "", "text": "Who: Leveraged ETFs, volatility-targeting funds, CTAs/trend followers; Taiwan margin accounts\nWhat: Est. $39B leveraged-ETF rebalancing sale at Friday's close (Libella); ~$11B vol-target selling; trend followers sold $57B over the past month and are now net short (Goldman via Bloomberg). Dealers short gamma into a put-heavy monthly expiry. Taiwan: record ~$1.5B one-day drop in margin loans, 632 accounts force-liquidated, TAIEX down almost 18% on the week; regulators cut margin requirements.\nPut on or suffering: SUFFERING (forced selling / liquidation); CTAs now PUT ON net short\n\nSource: (Keith Kaplan), 2026-11-23 21:46 SGT\n\nFriday was not just investors changing their minds about AI. It was leverage and machines being forced to sell at the same time. Leveraged ETFs had to sell an estimated $39 billion of stock at Friday's close to reset, one of their largest days since 2015, per Libella Group's model. Volatility-targeting funds sold an estimated $11 billion more. Trend followers have sold $57 billion over the past month and are now net short, according to Goldman estimates reported by Bloomberg. TradeSmith's data shows how forced it was. $SPY traded 2.9 times its 20-day average volume Friday, 176 S&P 500 names hit one-month lows, while our momentum, breadth, junk bond demand, safe haven demand and VIX data all pinned at maximum fear. Options poured fuel on it. Friday was monthly expiration, and SpotGamma says puts made up more than 80% of expiring positions, the first time since April 2025. Dealers were short gamma, which means they had to sell into the decline to stay hedged. Hedge funds were already heading for the exits. JPMorgan says they just had their worst week since April 2025. Goldman's prime desk, as reported, shows long-short net leverage at a one-year low and the heaviest single-stock shorting since June 2022. Margin calls? Clearly in Taiwan. Margin loans fell a record $1.5 billion Friday, 632 accounts were force-liquidated, and today the exchange cut its margin-call threshold to stop the spiral. About $1.25 billion of crypto positions were liquidated Friday. In the US, margin debt was already easing in October, and I have not seen evidence of a broad margin-call cascade. So who is buying this morning? Largely the same mechanics in reverse. Once Friday's options expired, $NVDA rose strongly after the close, before any weekend headline. Record short selling eventually has to be bought back. Leveraged ETFs buy into the close on an up day. Then came the headline: President Trump urging Nvidia's board to rehire Jensen Huang, and Treasury Secretary Bessent softening his stance. Goldman's desk offers the right caution. Its Panic Index hit 9.8 out of 10, a level that has historically marked relief. But mutual fund and retail positioning still sits at the 75th percentile, and the Fed is likely to be still hiking. Hedge funds capitulated. The broad investor washout has not happened. So is this a bottom or a relief rally? Right now, the evidence says relief rally, but I'm hoping for a bottom. Hedge funds have capitulated. Panic readings are at extremes. But everyday investors are still heavily positioned, the SEC probe into Nvidia is still open, and markets still price a December rate hike. Here is what would change my mind: the market holding Friday's lows through Wednesday's PCE report, the VIX back under 25, and credit spreads tightening. Until then, expect volatility and a real chance of retesting the lows. What are your thoughts?", "eng": "", "url": "https://x.com/KeithTradeSmith/status/2124862222539051505", "headline": "@KeithTradeSmith · Who: Leveraged ETFs, volatility-targeting funds, CTAs/trend followers; Taiwan…", "tags": ["@KeithTradeSmith", "x-brief", "large-trades"], "posted": "2026-11-23T21:46:46+08:00", "chars": 3500, "sec": "Mechanical forced selling: leveraged ETFs, vol-control, CTAs and Taiwan margin liquidations", "src": "large"}, {"id": "e024ceb5", "name": "", "handle": "donaldgorbachev", "why": "", "text": "Source: (Donald J. Gorbachev), 2026-11-23 20:40 SGT\n\nFive-second epistemology: Everyone loses their mind over the yen carry trade whenever Tokyo twitches. What you are watching right now is worse than any yen carry trade ever. Look at Taipei on Friday. Taiwan margin calls hit NT$6.46B ($196M), more than 200x the level a month earlier. The TAIEX fell almost 18% on the week, its worst since 1991. Margin loans dropped a record $1.5B in a single day — the biggest liquidation in data back to 1996 — with ~$13B still hanging out there. By Monday morning, regulators had pulled Taiwan's 10 largest brokers into weekend meetings and cut margin requirements. Why do stocks go up and why do stocks go down. Liquidity in, liquidity out. Nvidia and the Jensen fallout were mostly weathered. The real drain is not some central-bank conspiracy. It is the exact same mechanism that broke 1929: a money-printing syndicate conjuring trillion-dollar paper out of thin air and draining real cash out of every other equity book on earth. Look at the math on Anthropic ($ANT): - priced Nov. 18 at $83/share: $81.34B IPO + $26B private placement = $107.3B vacuumed straight out of the market - ~$1.5T IPO valuation, $2T intraday open ($111.50), $1.75T day-1 close ($97.17), already sliding to $88.30 Friday - marked up from $380B in Feb. 2026 to $965B in May to $1.5T in November — nearly 4x in nine months while reporting an $80.7B H1 2026 net loss (~$8.7B operational cash burn) and $450B in non-cancellable cloud commitments (signaling up to $750B) - 5,300 employees sitting on ~$232B in equity they never put a dime of cash into, with non-founder staff cleared to unload up to 10% on day one Now run the Mandelbrot fractal tape against Nvidia and Palantir. Nvidia climbed from ~$300B in Oct. 2022 to $1T by May 2023 — roughly the same 3.5x–4x power-law slope over ~155 trading days. Palantir ran even steeper, surging +361% in 2024 ($37B to $172B) and past $420B in 2025. Both traced the same parabolic geometry, except both cleared every dollar on a live public order book and both actually had something behind the paper. Nvidia had physical silicon, $27B scaling into $115B+ quarterly sales, and investment-grade credit (S&P A+ in 2023, now AA / Moody's Aa1). Palantir turned GAAP profitable in Q1 2023 with zero debt. Anthropic ran the exact same fractal slope with zero trading days of public tape and not a single penny of cumulative GAAP profit. Gold bugs won't shut up about a gold standard, as if a debt-based system cannot be backed. It can — by oil (Saudi Aramco), global manufacturing (Apple), 60 years of cash flows (Berkshire), or investment-grade credit. Anthropic has none of it. It has no investment-grade rating from Moody's, S&P, or Fitch, carries a BB+ junk rating from KBRA, and even anchor financier Blackstone warned investors to expect double-B junk after the IPO. This is worse than Bitcoin. Bitcoin took years of organic buying to reach $1T. Imagine Bitcoin never existed, debuted at $1.5T as junk credit, and every insider immediately started dumping into public buyers while Taiwan's margin book blew out 200x. Whether you care about \"intrinsic value\" or not — and the kitchen doesn't — stop asking if this is a bubble. A bubble still clears on a tape. This is a liturgy, not a bubble.", "eng": "", "url": "https://x.com/donaldgorbachev/status/2124845663636660406", "headline": "@donaldgorbachev · Source: (Donald J. Gorbachev), 2026-11-23 20:40 SGT", "tags": ["@donaldgorbachev", "x-brief", "large-trades"], "posted": "2026-11-23T20:40:58+08:00", "chars": 3300, "sec": "Mechanical forced selling: leveraged ETFs, vol-control, CTAs and Taiwan margin liquidations", "src": "large"}, {"id": "5ca4a8e1", "name": "", "handle": "traderstewie", "why": "", "text": "Source: (Traderstewie), 2026-11-23 22:50 SGT\n\nThis explains the phenomenon that we saw last Thursday and Friday. A massive unwind in margin that creates 'forced selling' on a large scale that it causes ripple effects in hedge fund holdings. Taiwan is a major hedge fund hub in Asia. As mentioned in yesterday's State of The Market post: https://t.co/gM7REcOr2W This sort of phenomenon is extremely rare, happens every 3 to 4 years where we see extreme oversold readings on NYMO and NAMO. (Bloomberg news source)", "eng": "", "url": "https://x.com/traderstewie/status/2124878279131984315", "headline": "@traderstewie · Source: (Traderstewie), 2026-11-23 22:50 SGT", "tags": ["@traderstewie", "x-brief", "large-trades"], "posted": "2026-11-23T22:50:34+08:00", "chars": 511, "sec": "Mechanical forced selling: leveraged ETFs, vol-control, CTAs and Taiwan margin liquidations", "src": "large"}, {"id": "d47ed621", "name": "", "handle": "teajayzz64", "why": "", "text": "Who: Global hedge funds (Goldman/JPMorgan data via Reuters); Morgan Stanley prime; named funds Lone Pine, Samlyn, Walleye, Engineers Gate, Balyasny, Millennium\nWhat: Global hedge funds lost more than 3% last week, their worst week since April 2025. Morgan Stanley: October saw the largest monthly unwind of stock-picker positions in more than a decade, starting 6 Oct, with heavy tech selling. Reported fallout: Lone Pine losses on AI positions; Walleye cut stock-picking; Engineers Gate shut most of a hybrid strategy; Balyasny and Millennium reported October losses.\nPut on or suffering: SUFFERING\n\nSource: (Jay Wilson), 2026-11-23 20:34 SGT\n\nU.S. stock futures are bouncing before the open, and dip buyers are getting ready to jump back in. But Reuters just dropped a much colder signal from Wall Street. Global hedge funds lost more than 3% last week, their worst weekly performance since April 2025. Data from Goldman Sachs and JPMorgan show institutions aggressively cutting exposure to riskier positions and rotating into healthcare and traditional retail. Hedge fund exposure to U.S. consumer staples distributors and retail stocks has hit an all-time high. But JPMorgan analyst John Schlegel warns that institutional positioning remains above historical capitulation levels, suggesting the market may not have fully washed out yet. Wall Street is still playing defense. So is this futures rebound a real recovery, or is the market's final capitulation still ahead? #StockMarket #trading", "eng": "", "url": "https://x.com/teajayzz64/status/2124844051312603379", "headline": "@teajayzz64 · Who: Global hedge funds (Goldman/JPMorgan data via Reuters); Morgan Stanley…", "tags": ["@teajayzz64", "x-brief", "large-trades"], "posted": "2026-11-23T20:34:34+08:00", "chars": 1495, "sec": "Hedge fund losses: worst week since April 2025; October unwind biggest in over a decade", "src": "large"}, {"id": "d3014765", "name": "", "handle": "LizMacDonaldFOX", "why": "", "text": "Source: (Elizabeth MacDonald), 2026-11-23 21:03 SGT\n\nBREAKING Watch what Morgan Stanley and Goldman Sachs sources are saying about hedge funds driving the market rout recently as they sold into the rally and deleveraged. Hedge funds were reducing leverage and selling both long and short positions. It started October 6. Morgan Stanley reported that October saw the largest monthly unwinding of stock-picking hedge-fund positions in more than a decade. Goldman Sachs data showed particularly aggressive technology-stock selling. Hedge funds were reducing leverage and selling both long and short positions. The. Tech outages exacerbated the downfall. The firms identified in subsequent reporting include: Lone Pine Capital – suffered significant losses as AI-related positions reversed. Samlyn Capital – narrowed its investment focus after losses. Walleye Capital – cut investment personnel and reduced its stock-picking operations. Engineers Gate – shut down most of a hybrid investment strategy. Balyasny Asset Management and Millennium Management – also reported October losses. #BREAKING #news #BreakingNews @EveningEdit @FoxBusiness @FoxNews @x @ap @WSJ @nytimes", "eng": "", "url": "https://x.com/LizMacDonaldFOX/status/2124851396583276756", "headline": "@LizMacDonaldFOX · Source: (Elizabeth MacDonald), 2026-11-23 21:03 SGT", "tags": ["@LizMacDonaldFOX", "x-brief", "large-trades"], "posted": "2026-11-23T21:03:45+08:00", "chars": 1167, "sec": "Hedge fund losses: worst week since April 2025; October unwind biggest in over a decade", "src": "large"}, {"id": "28d577d0", "name": "", "handle": "BullRush__", "why": "", "text": "Who: Fundamental long/short hedge funds (Goldman prime book); buyers were market makers, CTAs and leveraged ETFs (Nomura's McElligott)\nWhat: Goldman prime data: hedge funds added to shorts again last week, pushing the long/short ratio to a record low; US single stocks shorted every day, 3rd-largest shorting in a decade. Monday's Nasdaq 100 +6.93% (best day since Apr 2025) was mostly short covering plus mechanical buying, not new bullish bets.\nPut on or suffering: PUT ON (record shorts), now SUFFERING (squeeze)\n\nSource: (BullRush), 2026-11-24 18:48 SGT\n\n\"Is this real?\" That was the only question Goldman clients asked on Monday, according to Peter Callahan, the bank's TMT strategist. The Nasdaq 100 rose 6.93%, its best day since April 2025. In more than fifteen years, every gain above 5% has coincided with or shortly preceded a temporary low: - December 2018, after the Christmas Eve selloff - March 2020, at the height of the Covid shock - November 2022, on the cooler CPI print - April 2025, on the tariff pause The 2018 precedent is still a reason for caution. Brian Garrett, a derivatives trader at Goldman, points out that the market kept falling after that rebound. How the session traded raises questions. Almost the entire gain came between 8:55 and 9:15, and the index then moved sideways for more than six hours. Volume in Nasdaq stocks ran 60% above its year-to-date average, but the flow Goldman's desk actually received fell well short of expectations. ETFs made up more than 30% of volume at one point. Nomura's Charlie McElligott says the buying came from market makers, trend followers and leveraged ETFs, not from genuine bullish bets. Order book depth was only about $2.5M. Positioning points the same way. Goldman prime data show hedge funds added to shorts again last week, pushing the long/short ratio to a record low, so the rebound was mostly short covering. Bulls can't count on a market with no one left to sell either. Goldman's Lee Coppersmith notes that retail and long-term funds are still heavily long, and JPMorgan sees no real reduction from long-term capital yet. The sector is still damaged. Since the start of November, only three SOX stocks are positive and the index is down 10.8%. Even after a 31% jump, Nvidia is still down about 19.5% for the month, and Marvell is down 27%. Goldman's James Schneider expects Nvidia's multiple to stay under pressure until the DOJ and SEC probes close. At $166, the stock already trades below 17x normalized EPS. Levels to watch: - The Nasdaq 100 is still 5% below its 200-day moving average and about 15% below its Oct. 6 record - Whether it breaks the downtrend line - Rich Privorotsky's test at Goldman: if Nvidia rises while neocloud credit spreads stay wide, it's short covering, not a reversal $SPY $QQQ", "eng": "", "url": "https://x.com/BullRush__/status/2125179791175188956", "headline": "@BullRush__ · Who: Fundamental long/short hedge funds (Goldman prime book); buyers were…", "tags": ["@BullRush__", "x-brief", "large-trades"], "posted": "2026-11-24T18:48:40+08:00", "chars": 2792, "sec": "Record short book squeezed by Monday's +6.9% Nasdaq 100 rally", "src": "large"}, {"id": "3b6a1985", "name": "", "handle": "NKniazhevich", "why": "", "text": "Source: (Natalia Kniazhevich), 2026-11-24 02:20 SGT\n\nAs markets rally, hedge funds may be feeling the pain of an aggressive increase in short positions. US single stocks were shorted every day last week, the third-largest short-selling activity in the past decade, according to Goldman Sachs’ prime brokerage desk.", "eng": "", "url": "https://x.com/NKniazhevich/status/2124931011817640190", "headline": "@NKniazhevich · Source: (Natalia Kniazhevich), 2026-11-24 02:20 SGT", "tags": ["@NKniazhevich", "x-brief", "large-trades"], "posted": "2026-11-24T02:20:07+08:00", "chars": 314, "sec": "Record short book squeezed by Monday's +6.9% Nasdaq 100 rally", "src": "large"}, {"id": "f18df00f", "name": "", "handle": "neilsethinew", "why": "", "text": "Who: Hedge funds vs. mutual funds/ETFs/asset managers (Goldman's Lee Coppersmith; Deutsche Bank; Goldman prime)\nWhat: HF beta-adjusted leverage at five-year lows; prime net leverage ~41–42%, around the 1st percentile and matching Dec 2018. Hedge funds still carry large ETF shorts, which could be covered quickly. But ~$170B has flowed into US equity mutual funds/ETFs since the start of Q4, asset-manager equity-futures length is at the 82nd percentile, and the GS US Equity Sentiment Indicator is still at the 75th percentile. Deutsche Bank's aggregate positioning is at the 11th percentile (discretionary 4th, systematic ~15th).\nPut on or suffering: Hedge funds have already de-grossed; long-only investors are still exposed\n\nSource: (Neil Sethi NEW account), 2026-11-25 03:30 SGT\n\nI said Callahan yesterday, but this was actually Goldman's Lee Coppersmith, and the second factor he said he was \"getting pushback on\" was positioning. \"Hedge funds have clearly been through an enormous unwind.... but other positioning cohorts are mixed. \"Our GS US Equity Sentiment Indicator, which incorporates nine different positioning measures across hedge funds, mutual funds,retail and others, still sits at the 75th percentile historically. \"US equity mutual funds and ETFs have attracted nearly $170B of inflows since the start of Q4, while asset manager equity futures length sits in the 82nd percentile over the last decade. \"So as our GS Research team notes, even though HF beta-adjusted leverage has fallen to five-year lows, other investor groups remain relatively well invested.\"", "eng": "", "url": "https://x.com/neilsethinew/status/2125310986714218660", "headline": "@neilsethinew · Who: Hedge funds vs. mutual funds/ETFs/asset managers (Goldman's Lee…", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-11-25T03:30:00+08:00", "chars": 1579, "sec": "Positioning split: hedge fund leverage at multi-year lows, long-only money still heavily long", "src": "large"}, {"id": "50fa4575", "name": "", "handle": "UnfairValue1", "why": "", "text": "Source: (Unfair value), 2026-11-24 05:37 SGT\n\nBBG: The de-risking reset had been substantial, leaving investors poorly positioned for a sustained rise. Deutsche Bank’s aggregate equity-positioning measure has fallen to the 11th percentile, with discretionary investors at the 4th and systematic strategies   function renderItem(it, secLabel){
    SECNAME[it.id]=secLabel||''; BYID[it.id]=it;
    var a = el('article','item'+(it.kind==='tweet'?' tweet':'')); a.setAttribute('data-id',it.id);
    if(it.published) a.setAttribute('data-published', it.published);
    if(it.rank||it.tag) a.appendChild(el('span','chip',(it.rank?'#'+it.rank+(it.tag?' \u00B7 ':''):'')+(it.tag||'')));
    a.appendChild(el('h3','hl',it.headline));
    if(it.kind==='tweet' && it.quote) a.appendChild(el('blockquote','quote',it.quote));
    a.appendChild(el('p','sum',it.teaser));
    var f = el('div','foot');
    if(it.sources){
      f.appendChild(el('span','src plain','Briefing \u00B7 '+it.sources.length+' sources'));
    } else if(it.url){
      var l = el('a','src',it.source+' \u2197'); l.href=it.url; l.target='_blank'; l.rel='noopener noreferrer'; f.appendChild(l);
    } else f.appendChild(el('span','src',it.source));
    f.appendChild(el('span','dot','\u00B7'));
    var tm = el('time','rec'); if(it.published) tm.setAttribute('datetime', it.published); tm.setAttribute('data-published', it.published||'');
    f.appendChild(tm);
    f.appendChild(el('span','dot','\u00B7')); f.appendChild(el('span','rt','\u2248'+readMin(it)+' min read'));
    a.appendChild(f);

    /* actions (light cards such as tweets have no briefing, hence no Read button) */
    var hasBrief=!!(it.brief&&it.brief.length);
    var acts=el('div','acts'+(it.sources?' sp':''));
    var bp=el('div','brief'); bp.hidden=!it.expand; bp.id='b-'+it.id;
    if(hasBrief){
      var rb=el('button','btn read'); rb.type='button'; rb.setAttribute('aria-expanded',String(!!it.expand));
      rb.appendChild(document.createTextNode((it.sources?'Read the briefing (\u2248':'Read (\u2248')+readMin(it)+' min) ')); rb.appendChild(el('span','car','\u25BC')); rb.setAttribute('aria-controls',bp.id);
      rb.addEventListener('click',function(){var o=bp.hidden; bp.hidden=!o; rb.setAttribute('aria-expanded',o)});
      acts.appendChild(rb);
    }
    a._btns=askVote(it,acts);
    a.appendChild(acts);

    /* deep summary */
    (it.brief||[]).forEach(function(sec){
      bp.appendChild(el('h4',null,sec.h)); var ul=el('ul'); sec.b.forEach(function(b){ul.appendChild(el('li',null,b))}); bp.appendChild(ul);
    });
    if(it.note) bp.appendChild(el('p','bnote','Note: '+it.note));
    if(it.posts&&it.posts.length) bp.appendChild(postsNote(it));
    if(hasBrief && XREL[it.id]) bp.appendChild(xSay(XREL[it.id]));
    if(it.sources){ bp.appendChild(sourcesNote(it)); }
    else if(hasBrief) {
    var sp=el('p','bsrc','Source: '); 
    if(it.url){var sl=el('a',null,it.source+' \u2197'); sl.href=it.url; sl.target='_blank'; sl.rel='noopener noreferrer'; sp.appendChild(sl)} else sp.appendChild(document.createTextNode(it.source));
    (it.also||[]).forEach(function(x){sp.appendChild(document.createTextNode(' \u00B7 ')); var al=el('a',null,x.label+' \u2197'); al.href=x.url; al.target='_blank'; al.rel='noopener noreferrer'; sp.appendChild(al)});
    sp.appendChild(document.createTextNode(' \u00B7 Briefing compiled from the source above'+(it.kind==='tweet'?' and related reporting':'')+'; check the original for full detail.'));
    bp.appendChild(sp);
    }
    if(hasBrief) a.appendChild(bp);
    else if(it.note) a.appendChild(el('p','bnote slim','Note: '+it.note));
    return a;
  }

  function xSay(list){
    var d=el('details','srcs xsay'); d.appendChild(el('summary',null,'What X is saying ('+list.length+')'));
    var ul=el('ul');
    list.forEach(function(q){
      var li=el('li'); var who=el('a',null,(q.name||'@'+q.handle)+(q.name&&q.handle?' @'+q.handle:'')); who.href=q.url||'#'; who.target='_blank'; who.rel='noopener noreferrer'; li.appendChild(who);
      var t=(q.text||'').replace(/\s+/g,' ').trim(); if(t.length>230) t=t.slice(0,229).replace(/\s+\S*$/,'')+'\u2026';
      li.appendChild(el('div','pt','\u201C'+t+'\u201D')); ul.appendChild(li);
    });
    d.appendChild(ul);
    d.appendChild(el('p','sn','Posts picked by the Markets X News assistant and matched to this briefing by keywords; commentary, not verified facts. All of them are in the Markets X News group on the Finance tab.'));
    return d;
  }
  function renderXPost(it, secLabel){
    SECNAME[it.id]=secLabel; BYID[it.id]=it; it.xb=true;
    var a=el('article','item tweet xpost'); a.setAttribute('data-id',it.id);
    if(it.src==='large') a.appendChild(el('span','chip','Large trade'));
    var h=el('h3','hl'); h.appendChild(document.createTextNode(it.name||('@'+it.handle)));
    if(it.name&&it.handle) h.appendChild(el('span','xhandle',' @'+it.handle));
    a.appendChild(h);
    if(it.why){var w=el('p','sum xwhy'); w.appendChild(el('strong',null,'Why: ')); w.appendChild(document.createTextNode(it.why)); a.appendChild(w)}
    var tx=it.text||'';
    if(tx){
      var long = tx.length>480 || (tx.match(/\n/g)||[]).length>8;
      var q=el('blockquote','quote xtext'); q.id='xt-'+it.id; a.appendChild(q);
      if(!long) q.textContent=tx;
      else{
        var pv=tx.slice(0,320), cut=pv.search(/\s\S*$/); if(cut>200) pv=pv.slice(0,cut); pv=pv.replace(/\s+$/,'')+'\u2026';
        q.textContent=pv;
        var mb=el('button','btn read xmore'); mb.type='button'; mb.setAttribute('aria-expanded','false'); mb.setAttribute('aria-controls',q.id);
        var lab=document.createTextNode('Read full post ('+Math.max(1,Math.round(tx.length/1000*10)/10)+'k chars) '); mb.appendChild(lab); var car=el('span','car','\u25BC'); mb.appendChild(car);
        mb.addEventListener('click',function(){var o=mb.getAttribute('aria-expanded')!=='true'; mb.setAttribute('aria-expanded',o); q.textContent=o?tx:pv; lab.nodeValue=o?'Show less ':'Read full post ('+Math.max(1,Math.round(tx.length/1000*10)/10)+'k chars) '});
        a.appendChild(mb);
      }
    }
    if(it.eng) a.appendChild(el('p','xeng',it.eng));
    var f=el('div','foot');
    if(it.url){var l=el('a','src','View post on X \u2197'); l.href=it.url; l.target='_blank'; l.rel='noopener noreferrer'; f.appendChild(l)}
    if(it.posted){ if(it.url) f.appendChild(el('span','dot','\u00B7')); f.appendChild(document.createTextNode('posted ')); var tm=el('time','rec'); tm.setAttribute('datetime',it.posted); tm.setAttribute('data-published',it.posted); f.appendChild(tm); a.setAttribute('data-published',it.posted) }
    a.appendChild(f);
    var acts=el('div','acts'); a._btns=askVote(it,acts); a.appendChild(acts);
    return a;
  }
  function xLabel(k,x){
    var ed=fmtEdition(x.date).replace(',','');
    if(k==='morning') return 'Morning brief \u00B7 '+ed+' (SGT)';
    var d=parse(x.as_of); return 'Large trade watch \u00B7 '+(d? (x.time_known? fmtSGT(d).replace(',','') : ed+' (SGT)') : ed);
  }
  function xGroup(){
    var m=XB.morning, l=XB.large, mf=xbFresh('morning'), lf=xbFresh('large');
    if(!mf && !lf && !m) return null;                 // nothing to show: no files (or only a stale large-trades file)
    var n=(mf?m.items.length:0)+(lf?l.items.length:0), secLabel='Finance \u203A Markets X News';
    var d=el('details','group xg'); d.id='g-fin-xbrief';
    var saved=LS.get('newsdash.open.fin-xbrief'); d.open = saved===null ? n>0 : saved==='1';
    d.addEventListener('toggle',function(){LS.set('newsdash.open.fin-xbrief', d.open?'1':'0')});
    var s=el('summary'); s.appendChild(el('span','gi','\uD83D\uDCE1')); s.appendChild(el('h2','gt','Markets X News'));
    s.appendChild(el('span','gc',n+(n===1?' post':' posts'))); s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    function sub(k,x){var t=el('div','xsub'); t.appendChild(document.createTextNode(xLabel(k,x).split(' \u00B7 ')[0]+' \u00B7 ')); t.appendChild(el('span',null,xLabel(k,x).split(' \u00B7 ').slice(1).join(' \u00B7 '))); return t}
    function gridItems(items, label){var w=el('div','items'); items.forEach(function(it){w.appendChild(renderXPost(it,label||secLabel))}); return w}
    function morningBody(){
      /* Preserve email order: Finance / markets, then Other trends (from item.sec); fall back to a flat grid. */
      var items=m.items, order=[], by={};
      items.forEach(function(it){var k=it.sec||''; if(!by[k]){by[k]=[]; order.push(k)} by[k].push(it)});
      var hasNamed=order.some(function(k){return !!k});
      if(!hasNamed || order.length<=1){ d.appendChild(gridItems(items)); return }
      order.forEach(function(k){
        var lab=k||'Posts';
        var t=el('div','xsub'); t.appendChild(el('span',null,lab)); d.appendChild(t);
        d.appendChild(gridItems(by[k], secLabel+' \u203A '+lab));
      });
    }
    if(m){
      if(mf){ d.appendChild(sub('morning',m)); morningBody() }
      else{
        var ageH=Math.round((Date.now()-Date.parse(m.as_of))/36e5);
        d.appendChild(el('div','xnote', m.items.length
          ? 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief is about '+ageH+' h old, older than '+XB.fresh_h.morning+' h, so its posts are hidden until the next run (daily 6:45 AM SGT).'
          : 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief had no readable posts. It will refresh with the next run (daily 6:45 AM SGT).'));
      }
    }
    if(lf){ d.appendChild(sub('large',l)); d.appendChild(gridItems(l.items, secLabel+' \u203A Large trade watch')) }
    return d;
  }

  function renderGroup(key, title, icon, items, openDefault, secLabel, tours){
    tours=tours||[];
    var d = el('details','group'); d.id='g-'+key;
    var saved = LS.get('newsdash.open.'+key);
    d.open = saved===null ? openDefault : saved==='1';
    d.addEventListener('toggle', function(){LS.set('newsdash.open.'+key, d.open?'1':'0')});
    var s = el('summary'); s.appendChild(el('span','gi',icon)); s.appendChild(el('h2','gt',title));
    s.appendChild(el('span','gc',items.length+(items.length===1?' item':' items')+(tours.length?' \u00B7 '+tours.length+(tours.length===1?' overview':' overviews'):'')));
    s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    var w = el('div','items');
    if(!items.length) w.appendChild(el('div','empty','Nothing verified for this section yet.'));
    items.forEach(function(it){w.appendChild(renderItem(it, secLabel))});
    d.appendChild(w);
    tours.forEach(function(t){d.appendChild(renderTour(t, secLabel, title))});
    return d;
  }

  function askBar(){
    var w=el('div','askbar');
    var a=el('a','btn ask','\u2726 Ask Grok about today\u2019s news'); a.href=grokUrl(overallPrompt()); a.target='_blank'; a.rel='noopener noreferrer'; w.appendChild(a);
    var c=el('button','btn ghost','Copy question'); c.type='button';
    c.addEventListener('click',function(){copyText(overallPrompt()).then(function(ok){toast(ok?'Question copied \u2014 paste it into Grok':'Copy failed \u2014 long-press to copy')})});
    w.appendChild(c);
    w.appendChild(el('span','hint','Opens grok.com with a prefilled question. Each story also has its own Ask Grok button.'));
    return w;
  }

  /* ---------- feedback panel ---------- */
  var REPO='vikasgelara-ship-it/news-dashboard';
  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});
  }
  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
