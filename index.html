<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

 — the highest since June 2022. Corn is a leader among long liquidators, along with natural gas (getting shorter), grains, WTI crude oil and copper. He notes there are about two months left until year-end, when open interest typically declines, and that long speculators have coincided with decent up moves this year.\n\nPut on or suffering: Suffering from it / unwinding: liquidating previously put-on broad commodity longs; natural gas positioning is described as getting shorter.\n\nX sources:\n\nHedge Funds Signal Possible Start of Great 2026 Commodity Unwind Hedge funds are liquidating broad commodity longs at the fastest pace since Russia's invasion of Ukraine, with price-headwind implications. At about 5% of total Bloomberg Commodity Index constituent open interest as of Nov. 7, speculator net-longs are down from the September peak of just under 14% -- the highest since June 2022. There are about two months left until year-end, when open interest typically declines. Long speculators have coincided with decent up moves this year, and Republicans' road to electoral losses may gain fuel absent a solution to the war with Iran. Corn is a leader among long liquidators, along with natural gas (getting shorter), grains, WTI crude oil and copper. The economically sensitive metal tops my list of US stock puppets due to its high correlation, with macroeconomic implications. Full report on the Bloomberg here: https://t.co/x8Ev4RYhAW {BI COMD} #copper #CrudeOil #commodities #futures @BBGIntelligence", "eng": "", "url": "https://x.com/mikemcglone11/status/2119069853357138317", "headline": "Mike McGlone (@mikemcglone11) · What: Mike McGlone, Senior Commodity Strategist at Bloomberg Intelligence,…", "tags": ["@mikemcglone11", "x-brief", "large-trades"], "posted": "2026-11-07T22:09:58+08:00", "chars": 1852, "sec": "Hedge funds liquidating broad commodity longs at fastest pace since Ukraine invasion", "src": "large"}, {"id": "13c54f48", "name": "TheValueist", "handle": "TheValueist", "why": "", "text": "BROKER FLOW, VOL AND MARKET STRUCTURE SYNTHESIS: THE NOVEMBER 2026 SELLOFF (1/2) FINDINGS THE HEADLINE SYNTHESIS Every prime broker and flow desk that has published numbers describes the same machine: a four month de-grossing cycle that began in June, an October acceleration that erased two years of AI buying, and a Thursday 11/05 climax driven primarily by mechanical and forced flow (levered ETF rebalancing, vol control selling, dealer negative gamma, pod risk limits) rather than by discretionary fundamental selling. The disagreement is not about what happened. It is about what is left: the flow desks that measure positioning (GS, MS prime) say the leverage is now at or near multi-year lows and the forced seller is largely spent, while the strategy desks that watch prices and funding (BofA, Citi, JPMorgan positioning intelligence) say the conditions for calling a bottom, lower yields, calm funding, an oversold setup, are not yet in place. Both can be true at once, and the synthesis section at the end works through where that leaves the next trigger. MORGAN STANLEY (PRIME BROKERAGE AND DERIVATIVES) • Thu 11/05: US long/short net leverage fell 5% in one day, the 5th largest single-day decline since 2010, to the bottom decile of readings since 2010. Hedge funds are underweight AI stocks versus market-cap weights, while AI remains 32% of absolute exposure. Levered ETF rebalancing supply was put at $57B of US equities for the session, the largest on their data back to 2007, and retail selling in Thursday's first 90 minutes was the 2nd largest since 2016. (MS prime brokerage data, Thu 11/05; the core figures are independently restated in the Substack market letter \"Selective Resilience,\" 11/07.) • The intraday path of the same number matters: MS derivatives calculated at about noon Thursday that forced levered ETF selling into the close would be roughly $52B if prices held at 1 PM levels; the post-session figure was $57B. (Substack letter, 11/07; Nomura's McElligott note as reported by ChainCatcher and Bloomberg-derived coverage.) • The longer arc: cumulative gross hedge fund flows fell about 8% from the June peak (MS prime, as of late October), described by MS as the longest sustained de-risking in more than 15 years, and gross exposure was down about 7.8% from peak as of 10/27, the largest de-grossing in their series back to 2016. Hedge funds turned underweight the broader AI trade for the first time since early 2023. Reported by Reuters-derived coverage (TradingView/Seeking Alpha wire, 11/02) and AlphaMaven. • MS equity strategy (Mike Wilson, late October): the correction has been running since June, the selloff is nearing its end, and the dip should be bought rather than treated as the start of a deep bear market, with S&P downside still possible into November. (Neo Reports daily brief summary of MS notes, 10/20.) GOLDMAN SACHS (PRIME BROKERAGE AND TRADING DESK) • Through Thu 11/05 (fundamental L/S book): gross leverage fell 8.7 points on the week, the largest weekly decline since March 2020, to the 26th percentile (1Y). Net leverage fell 3.7 points, the largest weekly decline since the April 2025 Liberation Day week, to the 0th percentile (5Y). Beta-adjusted net fell to 57.4% (minus 6.4 points, 0th percentile 1Y), beta-adjusted gross fell 15.7 points to 213.2% (0th percentile 1Y, 5th over 3Y), and the average beta of longs slipped from about 1.11 to 1.08, meaning the selling was concentrated in the highest-beta longs, AI and semis. (GS prime brokerage data, through Thu 11/05.) • The October run-up to it: GS prime showed hedge funds net selling global AI stocks for five consecutive sessions 10/08 to 10/14, fully reversing cumulative net buying since early 2025, with about $20B of tech selling over two weeks in October (Reuters, 10/26). Even after a 3.6 point rebound to 47.0%, fundamental L/S net leverage sat in the 5th percentile over five years with the long/short ratio at the 1st percentile (1.555) as of late October. • A caution flag from the same house a week earlier: in mid-October GS prime total-book gross leverage was still 310.3%, near five-year highs, with net at 73.3%. That is a different book (total prime, not fundamental L/S only) and an earlier date than the percentile collapse above, but it is the standing reminder that fundamental L/S is the lightest corner of the prime complex, not the whole of it. (Blockonomi, reporting GS prime data, late October.) • Desk color Thursday: GS trading floor phones \"exploding,\" consistent with GS desk color from 11/05 (phones exploding, almost no flow, long-onlys frozen). (ChainCatcher, reporting Bloomberg's 11/06 account.) BARCLAYS (EQUITY TACTICAL STRATEGY, ALEX ALTMANN) • Barclays was the one major desk skeptical before the election, and its models produced the largest systematic number in print: vol control funds cut equity exposure by about 30 percentage points on Thursday, the biggest one-day adjustment since February 2020 (WSJ, 11/06 to 11/07), with roughly $135B of US equity futures selling projected over the following 24 to 48 hours. Barclays also called Thursday the largest levered ETF sell-side rebalancing day on record. Altmann's stated conclusion: as liquidation pressure spreads through real-money channels (retail and long-only), the selling persists into the next session. (WSJ; BigGo and Bitget reporting of Barclays notes.) • October color from the same desk: long-only generalist PMs had cut semis underweights to just over minus 200bp and software to roughly benchmark, hedge funds had taken equity exposure back to long-run neutral, vol control exposure had risen to about 95% (leaving almost no room to add, and therefore maximum room to cut), and CTAs had rebuilt US equity longs while de-risking Europe. (Neo Reports brief, 10/20, summarizing Barclays.) NOMURA (CROSS-ASSET AND DERIVATIVES STRATEGY, CHARLIE MCELLIGOTT) • McElligott's Thursday note is the market structure core of the whole episode. His mechanical stack: levered ETF rebalancing about $47B (the second-largest single-day figure in Nomura's database, behind only the $51.3B of June 5 this year), vol control selling about $61B keyed to the 3 PM drop (rising toward $70B if the drop reached 10%), and dealer negative gamma worth roughly $7B of additional selling per further 1% market decline. Total mechanical supply above $100B, with vol control flow carrying a one to two day lag into Friday. (ChainCatcher, reporting the note; laicrypto summary of Bloomberg's 11/06 account uses the same three figures and flags that they are model estimates across different strategies, not one measured total.) • His second point is about behavior around known flow: because the entire street knew the levered ETF number in advance, active traders front-ran it, selling early to buy back lower, which turned the anticipatory flow itself into a driver of the decline; he warned that if the usual 2 to 3 PM low-and-rebound pattern failed, the front-runners would add to the fall rather than cushion it. (ChainCatcher.) • Nomura QIS CTA data (late October): trend strategies had covered about $68B of Treasury futures shorts and $38B of short-term rate shorts over two weeks while remaining net short rates, a mirror image of the equity side: in rates, the systematic risk was a squeeze up, not more selling. In equities, Substack synthesis of prime data put CTA equity positioning at minus 3.3 standard deviations by late October. (bgportable summary of Nomura notes; Substack letter 11/07.) BANK OF AMERICA (FLOW SHOW, HARTNETT; CLIENT FLOW DATA, CAREY HALL) • The 11/06 Flow Show is deliberately paradoxical, and the paradox is the point. Global equity funds took in a record $265.6B over four weeks (US +$92.3B, China +$85.9B), BofA private client cash sits at 9.3% of $4.6T in assets, a record low below February 2009, March 2020 and June 2007 readings, and yet the house stance stays defensive: \"tech is cracking\" (Nasdaq 100 down 15% in a month, chips 17% below trend, an equal-weight double top flagged), the AI capex bill outgrowing cash flow (capex from $412B in 2025 to an estimated $1.3T in 2027, hyperscaler FCF turning negative), and AI concentration at 41% of the market, matching the dot-com peak share. (OptionsGeek slide-by-slide summary of the 11/06 Flow Show, posted 11/07.) • Hartnett's three conditions to turn less defensive, none met as of the 11/05 note: central bank hikes stop (December hike odds still elevated across Fed, ECB, BoJ, BoE), the 10-year Treasury yield falls below 4.5% (it was 4.88%), and oil falls below $80 (WTI $91, Brent $99). His \"buy when the world panics\" signal read 16% against an 88% buy threshold, one of two triggers met. The intended path to a year-end rally ran through soft 11/06 payrolls and 11/10 CPI; payrolls instead printed strong (+165K vs +65K expected), which the note's summarizer flags as undermining that branch. (Threads infographic summary of the 11/05 Flow Show, posted 11/07.) • BofA client flow data (Jill Carey Hall): clients net sold $3.5B of US equities in the latest reported week, a second consecutive week of selling after $15B the prior week, retail-led, with communication services posting its largest weekly outflow since records began in 2018 and industrials extending to 13 straight weeks of outflows. (Syndicated reporting, updated 11/06.) • The funding side of Hartnett's AI warning, in numbers: hyperscaler debt issuance has surged to $182B in 2026 from $17B in 2024, with hyperscaler free cash flow projected to swing from plus $240B in 2024 to about minus $180B by 2027 as capex rises toward $1.2T, and US IG tech bond total returns versus the broader IG index at a 30-year low. Separately, BofA strategy flags hyperscaler credit spreads above 200bp as the level that could force deleveraging. (HTX summary of BofA Hartnett notes; StockwireX analysis of BofA strategy.) JPMORGAN (MARKET INTELLIGENCE, POSITIONING INTELLIGENCE, TRADING DESK) • Split verdict inside one bank. US Market Intelligence (Andrew Tyler) stayed tactically bullish through the week: the Wednesday note after the midterm result kept a bullish stance, favored a tech-plus-cyclicals barbell with more weight on cyclicals, and argued gains could broaden beyond mega-cap tech, while explicitly withholding an unconditional AI endorsement pending four confirmations: crowded positioning substantially reduced, hyperscaler capex plans confirmed, semiconductor and memory earnings delivered, capital markets activity improved. (SKN summary of the JPM note, published 11/04.) • The funding desk view is darker. JPMorgan sales trader Marissa Gitler named repo market liquidity stress as the primary driver of November's reversal: private repo rates above IORB, reserve scarcity, and leveraged funds losing cash access, which mechanically forces unwinding, with the US government's reopening named as the pivotal turning point for easing the stress; JPMorgan's tactical positioning monitor sat at the 65th percentile with a four-week change of minus 0.8 standard deviations against the minus 1.5 needed for an attractive buy setup, and the desk flagged index levels where further declines trigger systematic sell programs. (iTiger summary of the JPMorgan note; the piece carries some garbled forward-dated details in syndication, so the monitor percentile is used and the rest is treated as directional.) • Positioning flows (Panigirtzoglou, late October): equity positioning had reset significantly since mid-September, which could start to limit AI downside; hedge funds and CTAs had likely unwound much of their long exposure; neoclouds are about $30B of roughly $2.2T of cash flows and $80B of $1.8T of capex, too small to break the AI capex cycle even if their funding model fails, with the tech sector running a financing surplus near $400B. (AgentFlare digest of JPMorgan notes, 10/22 to 10/23.) UBS • UBS appears in the post-election coverage in two places, neither of them a prime leverage series (UBS does not publish one publicly the way MS and GS do). First, pre-event: UBS Securities' Davide Montoni was in the bullish camp with JPMorgan and Citadel Securities, arguing the vote could be an upward catalyst for tech and a possible year-end short squeeze after hyperscaler earnings failed to deliver a clean bullish signal. Second, post-event: a desk comparison table carried in Chinese financial press puts UBS's estimate of Friday systematic selling at more than $100B, in line with Barclays' $135B futures figure. (Bitget and BigGo reporting.) The stance is corroborated across reports; the $100B figure rests on a single table. CITADEL SECURITIES (RUBNER) AND THE PRE-ELECTION BULLISH DESK CONSENSUS • Scott Rubner, head of equity and equity derivatives strategy at Citadel Securities, wrote Wednesday that as the election dust settled, volatility could gradually normalize and investors had significant room to re-establish risk, framing the vote as clearing the way for a seasonal year-end rally. JPMorgan's desk and UBS's Montoni said materially the same thing. All three were wrong-footed within 24 hours by Thursday's 4.4% S&P decline, which matters for structure: the desks that intermediate flow went into the event expecting vol to fall and positioning to rebuild, so there was no pre-positioned bid under the market when the mechanical selling arrived. (BigGo and Bitget, reporting Bloomberg's account.) • Options volumes on Thursday hit the highest level on record in data back to the 1970s, and traders shifted from upside YOLO structures into crash protection across VIX, SPX and credit. (WSJ, 11/06 to 11/07.) BTIG (DESK COLOR) AND THE LONG-ONLY QUESTION • BTIG's desk note Thursday: \"Massive systematic/ETF selling, QQQs minus 6.5%, VIX plus 70%. Volumes exploded and our LO sell skew outpaced HFs 3/1. Supply increased all day.\" Their charts put SMH implied vol at roughly 65 to 68% on 11/05, the highest in a series back to 2020 whose COVID peak was about 42%. (BTIG desk note, Thu 11/05.) • This is the sharpest factual conflict in the whole sweep. GS desk color said long-onlys were frozen and almost no flow was happening; Jefferies color (11/05) had long-onlys as a higher share of tech notional than GS implied; the post-event press coverage again reports long-only institutions \"frozen\" (BigGo), while BTIG, a desk that actually crossed the flow, says its long-only sell skew outpaced hedge funds three to one on the day itself. Resolution that fits all four: long-onlys were frozen as buyers all week (no dip-buying, phones ringing, no bids), and on Thursday a subset of them joined as sellers late in the day as the move deepened, which is exactly the sequence Barclays' Altmann predicted would extend the selling. Frozen bid, late supply. CITI • No flow or leverage data from Citi was findable; Citi's published voice here is allocation strategy. The Global Asset Allocation team (Dirk Willer) took global equities to neutral in the 10/30 house view, having cut US equities to neutral on 10/13 the day after its POLLS indicator fired at 18 or higher (a signal whose backtest shows US stocks falling 3 to 4% over the following month, then recovering; Citi itself concedes the COVID crash flatters the backtest). The book's largest position is a 9.8% underweight in investment grade credit, not an equity short, and the team states plainly that it wants to buy the dip once one of its triggers clears: an Iran deal, a war restart that spares oil infrastructure, or AI funding fears fading. (Exencial Research Partners summaries of Citi notes, 11/05.) • Citi US equity strategy (Drew Pettit): the long-term AI narrative is intact, a 10 to 15% retracement not driven by a macro cliff would be welcome and buyable, and fair value on discounted earnings sits near 6,600 on the S&P 500 against a 6,720 close on the Thursday referenced, with dip-buying aimed at AI beta plus cyclical beta. (Webull/Zhitong summary of Pettit comments.) • Citi's credit desk is where its AI worry actually lives: neocloud high-yield spreads went from about 750bp at the start of 2026 to above 1,000bp in late October, the AI basket grew from 1% to 4.5% of the high-yield market and explains about a third of this year's HY widening, while data center and power issuers stayed far tighter. The stress is real but narrow and in credit, not in equity flow. (Exencial summary of Citi house view.) MIZUHO • No Mizuho flow, prime or positioning note on the 11/05 selloff was findable; this is stated explicitly rather than filled. Mizuho's on-record voice in this episode is its TMT specialist sales desk (Jordan Klein) from the October leg: the AI and chip trade was \"extremely crowded\" with a foundation grown \"extremely wobbly\" (mid-October, MarketWatch), and in early October that positioning in semis sat well below summer highs with memory names \"dirt cheap\" and free cash flow set to accelerate (https://t.co/lfvCJxdZ98 via Stocktwits, 10/01). Klein's desk framing of day-to-day semi rotations as quant, passive and systematic flow rather than fundamental decisions is consistent with the prime data above, but it predates the climax and cannot be dated to this week. VOLATILITY, THE CROSS-DESK PICTURE • Spot vol: VIX up about 70% on Thursday (BTIG) to its highest since March (WSJ). Semi vol: SMH implied vol 65 to 68%, an all-series high against a 42% COVID peak (BTIG charts). • Structure: Nomura's structured-products desk separately warns that roughly $300B of 2026 structured note issuance leaves dealers short vega with autocall knock-out barriers below spot, so further declines flip issuing desks into short gamma regimes that sell into falls (Nomura's Micalizzi via Bloomberg Odd Lots, 11/02). That is a standing amplifier under the market, independent of the fund flow story. RETAIL • Three different retail numbers, three different populations, no contradiction once separated. MS prime: retail selling in Thursday's first 90 minutes was the 2nd largest since 2016 (a tape measure of early-session single-stock selling). Vanda Research: retail net sold $338M of single stocks as of 3 PM Thursday, notable because retail had been the market's standing dip-buyer. BofA client data: retail led the latest weekly client outflows. The direction is unanimous even where the magnitudes differ: on Thursday, retail sold. (MS prime; Vanda Research; BofA client data.)", "eng": "", "url": "https://x.com/TheValueist/status/2119067930717544630", "headline": "TheValueist (@TheValueist) · BROKER FLOW, VOL AND MARKET STRUCTURE SYNTHESIS: THE NOVEMBER 2026 SELLOFF…", "tags": ["@TheValueist", "x-brief", "large-trades"], "posted": "2026-11-07T22:02:19+08:00", "chars": 18355, "sec": "Additional desk flow on the 5 Nov unwind: GS weekly leverage wipe, Barclays vol-control, Nomura mechanical stack", "src": "large"}, {"id": "18a0e30a", "name": "TheValueist", "handle": "TheValueist", "why": "", "text": "SYNTHESIS (2/2) WHERE THE DESKS AGREE • The selloff was the climax of a de-grossing cycle, not its start. MS dates the de-risking from June (longest sustained stretch in 15+ years, gross flows minus 8% from peak, AI net buying since early 2025 fully reversed by GS's October count). Thursday was the forced end of a four-month process. • The marginal Thursday seller was mechanical. Levered ETF rebalancing ($47B Nomura to $57B MS, either way a record or near-record), vol control ($61B Nomura keyed to Thursday, $135B of futures over 24 to 48 hours on Barclays), dealer negative gamma (about $7B per 1%, Nomura), and pod risk-limit cuts stack to well above $100B of price-insensitive supply. No desk attributes Thursday's magnitude to discretionary fundamental selling. • Positioning is now light where it can be measured. Fundamental L/S net leverage is at the 0th percentile over five years on GS's book and the bottom decile since 2010 on MS's; funds are underweight AI versus market cap for the first time since early 2023 on both prime books. • Vol confirmed the stress. Record options volume, an all-time high in semi implied vol, and the VIX at its highest since March. WHERE THEY CONFLICT • Long-onlys: frozen (GS color, Jefferies in part, post-event press) versus the dominant Thursday seller on BTIG's book (LO skew 3 to 1 over HFs). Best fit is sequence, not contradiction: no LO bid all week, LO supply arriving late Thursday. • How much mechanical selling is left: Barclays projected $135B of vol control futures selling across Friday and warned real-money channels would extend it; the Friday tape (a partial bounce, vol only partly retraced) is consistent with heavy but not climactic follow-through. GS and MS prime read the same positioning data as evidence the forced seller is largely spent. The open dispute is vol control's lag versus prime's levels. • Whether this is buyable yet: JPMorgan's Tyler desk says tactically bullish with conditions; JPMorgan's own positioning intelligence says the monitor is at the 65th percentile and not yet at a buy setup, and names repo stress as the driver; BofA says stay defensive until hikes end, the 10-year is under 4.5% and oil is under $80; Citi is neutral and waiting for a trigger it has named in advance. Nobody major is calling it a confirmed bottom. • Levered ETF size for Thursday: $47B (Nomura), $52B (MS intraday), $57B (MS post-session). Same event, three timestamps; the range is honest, the direction is not in doubt. POSITIONING EVENT OR FUNDAMENTALS EVENT On the flow evidence, this was a positioning event with a fundamental pretext, and the desks' own numbers force that conclusion. The pretext is real and named consistently: AI capex outrunning cash flow (BofA's $412B to $1.3T path, hyperscaler debt issuance up to $182B in 2026 from $17B in 2024), neocloud credit spreads above 1,000bp, and a rates backdrop where the market went into Friday pricing December hike risk. But nothing in the week's fundamental news is sized to a 6.5% QQQ day, a record options volume day, or the largest weekly fundamental L/S leverage decline since COVID. What is sized to those prints is the positioning stack: four months of de-grossing, vol control at about 95% exposure with no room to add, record levered ETF assets, dealer short gamma, and a known, published, front-runnable forced-flow number at noon on the day. The strongest single piece of evidence is the beta data in GS's note: books sold their highest-beta longs (longs' average beta 1.11 to 1.08) while going underweight AI versus market cap, the signature of risk-limit selling, not of a revised view on AI earnings, which no major desk actually cut this week. Citi, the most cautious allocation voice, is underweight credit rather than equities and pre-committed to buying the dip. JPMorgan's fundamental math says the fundamental channel is too small to carry the move: neoclouds are about $80B of roughly $1.8T of capex, about 4.4%, per the Panigirtzoglou figures above. Across this entire sweep, no major desk was found to have cut its AI earnings view during the selloff week; that is a negative observation about the sweep's sources, stated as such. The honest caveat, and the adversarial point: positioning events end when the flow ends, but they can become fundamental events if the funding channel stays shut, because the AI build-out is now debt-financed at the margin (hyperscaler issuance of $182B in 2026 against $17B in 2024, per the BofA figures above); that is why BofA watches hyperscaler spreads above 200bp and Citi watches neocloud spreads, and why the repo stress in JPMorgan's note matters more than its percentile. WHAT EACH DESK FLAGS AS THE NEXT TRIGGER • MS: whether net leverage rebuilds quickly from the bottom decile (re-levering is the tell the purge is over) and whether buying shifts from short covering to genuine long accumulation; hyperscaler capex and AI revenue growth are its fundamental watch items. • GS: the pace of any re-grossing off a 0th percentile net, and whether high-beta longs get bought back or the beta of longs keeps falling. • Barclays: vol control's lagged futures selling completing, and whether real-money (retail, long-only) channels keep supplying stock after the systematic flow is done. • Nomura: the 2 to 3 PM pattern (does the intraday low-and-rebound behavior return), vol control's one to two day lag exhausting, and dealer gamma flipping as spot moves away from the short gamma zone; in rates, a CTA short-covering squeeze if bonds keep rallying. • BofA: 11/10 CPI is the named near-term gate; the strategic gates are hikes ending, 10-year under 4.5%, oil under $80, and the panic signal reaching its buy threshold (16% now, 88% needed). • JPMorgan: repo and funding normalization (the government reopening is named in the Gitler note as the pivotal easing event; SOFR versus IORB), its positioning monitor reaching minus 1.5 sigma, and for the AI trade specifically, capex confirmation and semiconductor and memory earnings, with NVDA on 11/17 the largest single name in that window. • Citi: an Iran development, AI funding fear fading, or its POLLS one-month window simply expiring. OPEN QUESTIONS • UBS's Friday systematic selling figure (more than $100B) rests on one secondary table; the underlying UBS note was not obtained. • GS total prime book gross leverage (310.3% in mid-October) versus the fundamental L/S percentile collapse: whether the multi-strat and total-book aggregates also flushed this week is not in any public source found. • No Citi, Virtu or standalone Citadel Securities flow data (Rubner's stance is known; his flow numbers are not public). • No Mizuho note dated to the week of 11/02 was findable. • JPMorgan's Gitler liquidity note reached us through one syndicated summary with some garbled details; the repo-stress claim is directional, not verified against the note. • Whether Friday's session saw vol control selling at Barclays' projected scale cannot be confirmed until next week's prime notes print.", "eng": "", "url": "https://x.com/TheV       var l = el('a','src',it.source+' \u2197'); l.href=it.url; l.target='_blank'; l.rel='noopener noreferrer'; f.appendChild(l);
    } else f.appendChild(el('span','src',it.source));
    f.appendChild(el('span','dot','\u00B7'));
    var tm = el('time','rec'); if(it.published) tm.setAttribute('datetime', it.published); tm.setAttribute('data-published', it.published||'');
    f.appendChild(tm);
    f.appendChild(el('span','dot','\u00B7')); f.appendChild(el('span','rt','\u2248'+readMin(it)+' min read'));
    a.appendChild(f);

    /* actions (light cards such as tweets have no briefing, hence no Read button) */
    var hasBrief=!!(it.brief&&it.brief.length);
    var acts=el('div','acts'+(it.sources?' sp':''));
    var bp=el('div','brief'); bp.hidden=!it.expand; bp.id='b-'+it.id;
    if(hasBrief){
      var rb=el('button','btn read'); rb.type='button'; rb.setAttribute('aria-expanded',String(!!it.expand));
      rb.appendChild(document.createTextNode((it.sources?'Read the briefing (\u2248':'Read (\u2248')+readMin(it)+' min) ')); rb.appendChild(el('span','car','\u25BC')); rb.setAttribute('aria-controls',bp.id);
      rb.addEventListener('click',function(){var o=bp.hidden; bp.hidden=!o; rb.setAttribute('aria-expanded',o)});
      acts.appendChild(rb);
    }
    a._btns=askVote(it,acts);
    a.appendChild(acts);

    /* deep summary */
    (it.brief||[]).forEach(function(sec){
      bp.appendChild(el('h4',null,sec.h)); var ul=el('ul'); sec.b.forEach(function(b){ul.appendChild(el('li',null,b))}); bp.appendChild(ul);
    });
    if(it.note) bp.appendChild(el('p','bnote','Note: '+it.note));
    if(it.posts&&it.posts.length) bp.appendChild(postsNote(it));
    if(hasBrief && XREL[it.id]) bp.appendChild(xSay(XREL[it.id]));
    if(it.sources){ bp.appendChild(sourcesNote(it)); }
    else if(hasBrief) {
    var sp=el('p','bsrc','Source: '); 
    if(it.url){var sl=el('a',null,it.source+' \u2197'); sl.href=it.url; sl.target='_blank'; sl.rel='noopener noreferrer'; sp.appendChild(sl)} else sp.appendChild(document.createTextNode(it.source));
    (it.also||[]).forEach(function(x){sp.appendChild(document.createTextNode(' \u00B7 ')); var al=el('a',null,x.label+' \u2197'); al.href=x.url; al.target='_blank'; al.rel='noopener noreferrer'; sp.appendChild(al)});
    sp.appendChild(document.createTextNode(' \u00B7 Briefing compiled from the source above'+(it.kind==='tweet'?' and related reporting':'')+'; check the original for full detail.'));
    bp.appendChild(sp);
    }
    if(hasBrief) a.appendChild(bp);
    else if(it.note) a.appendChild(el('p','bnote slim','Note: '+it.note));
    return a;
  }

  function xSay(list){
    var d=el('details','srcs xsay'); d.appendChild(el('summary',null,'What X is saying ('+list.length+')'));
    var ul=el('ul');
    list.forEach(function(q){
      var li=el('li'); var who=el('a',null,(q.name||'@'+q.handle)+(q.name&&q.handle?' @'+q.handle:'')); who.href=q.url||'#'; who.target='_blank'; who.rel='noopener noreferrer'; li.appendChild(who);
      var t=(q.text||'').replace(/\s+/g,' ').trim(); if(t.length>230) t=t.slice(0,229).replace(/\s+\S*$/,'')+'\u2026';
      li.appendChild(el('div','pt','\u201C'+t+'\u201D')); ul.appendChild(li);
    });
    d.appendChild(ul);
    d.appendChild(el('p','sn','Posts picked by the Markets X News assistant and matched to this briefing by keywords; commentary, not verified facts. All of them are in the Markets X News group on the Finance tab.'));
    return d;
  }
  function renderXPost(it, secLabel){
    SECNAME[it.id]=secLabel; BYID[it.id]=it; it.xb=true;
    var a=el('article','item tweet xpost'); a.setAttribute('data-id',it.id);
    if(it.src==='large') a.appendChild(el('span','chip','Large trade'));
    var h=el('h3','hl'); h.appendChild(document.createTextNode(it.name||('@'+it.handle)));
    if(it.name&&it.handle) h.appendChild(el('span','xhandle',' @'+it.handle));
    a.appendChild(h);
    if(it.why){var w=el('p','sum xwhy'); w.appendChild(el('strong',null,'Why: ')); w.appendChild(document.createTextNode(it.why)); a.appendChild(w)}
    var tx=it.text||'';
    if(tx){
      var long = tx.length>480 || (tx.match(/\n/g)||[]).length>8;
      var q=el('blockquote','quote xtext'); q.id='xt-'+it.id; a.appendChild(q);
      if(!long) q.textContent=tx;
      else{
        var pv=tx.slice(0,320), cut=pv.search(/\s\S*$/); if(cut>200) pv=pv.slice(0,cut); pv=pv.replace(/\s+$/,'')+'\u2026';
        q.textContent=pv;
        var mb=el('button','btn read xmore'); mb.type='button'; mb.setAttribute('aria-expanded','false'); mb.setAttribute('aria-controls',q.id);
        var lab=document.createTextNode('Read full post ('+Math.max(1,Math.round(tx.length/1000*10)/10)+'k chars) '); mb.appendChild(lab); var car=el('span','car','\u25BC'); mb.appendChild(car);
        mb.addEventListener('click',function(){var o=mb.getAttribute('aria-expanded')!=='true'; mb.setAttribute('aria-expanded',o); q.textContent=o?tx:pv; lab.nodeValue=o?'Show less ':'Read full post ('+Math.max(1,Math.round(tx.length/1000*10)/10)+'k chars) '});
        a.appendChild(mb);
      }
    }
    if(it.eng) a.appendChild(el('p','xeng',it.eng));
    var f=el('div','foot');
    if(it.url){var l=el('a','src','View post on X \u2197'); l.href=it.url; l.target='_blank'; l.rel='noopener noreferrer'; f.appendChild(l)}
    if(it.posted){ if(it.url) f.appendChild(el('span','dot','\u00B7')); f.appendChild(document.createTextNode('posted ')); var tm=el('time','rec'); tm.setAttribute('datetime',it.posted); tm.setAttribute('data-published',it.posted); f.appendChild(tm); a.setAttribute('data-published',it.posted) }
    a.appendChild(f);
    var acts=el('div','acts'); a._btns=askVote(it,acts); a.appendChild(acts);
    return a;
  }
  function xLabel(k,x){
    var ed=fmtEdition(x.date).replace(',','');
    if(k==='morning') return 'Morning brief \u00B7 '+ed+' (SGT)';
    var d=parse(x.as_of); return 'Large trade watch \u00B7 '+(d? (x.time_known? fmtSGT(d).replace(',','') : ed+' (SGT)') : ed);
  }
  function xGroup(){
    var m=XB.morning, l=XB.large, mf=xbFresh('morning'), lf=xbFresh('large');
    if(!mf && !lf && !m) return null;                 // nothing to show: no files (or only a stale large-trades file)
    var n=(mf?m.items.length:0)+(lf?l.items.length:0), secLabel='Finance \u203A Markets X News';
    var d=el('details','group xg'); d.id='g-fin-xbrief';
    var saved=LS.get('newsdash.open.fin-xbrief'); d.open = saved===null ? n>0 : saved==='1';
    d.addEventListener('toggle',function(){LS.set('newsdash.open.fin-xbrief', d.open?'1':'0')});
    var s=el('summary'); s.appendChild(el('span','gi','\uD83D\uDCE1')); s.appendChild(el('h2','gt','Markets X News'));
    s.appendChild(el('span','gc',n+(n===1?' post':' posts'))); s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    function sub(k,x){var t=el('div','xsub'); t.appendChild(document.createTextNode(xLabel(k,x).split(' \u00B7 ')[0]+' \u00B7 ')); t.appendChild(el('span',null,xLabel(k,x).split(' \u00B7 ').slice(1).join(' \u00B7 '))); return t}
    function gridItems(items, label){var w=el('div','items'); items.forEach(function(it){w.appendChild(renderXPost(it,label||secLabel))}); return w}
    function morningBody(){
      /* Preserve email order: Finance / markets, then Other trends (from item.sec); fall back to a flat grid. */
      var items=m.items, order=[], by={};
      items.forEach(function(it){var k=it.sec||''; if(!by[k]){by[k]=[]; order.push(k)} by[k].push(it)});
      var hasNamed=order.some(function(k){return !!k});
      if(!hasNamed || order.length<=1){ d.appendChild(gridItems(items)); return }
      order.forEach(function(k){
        var lab=k||'Posts';
        var t=el('div','xsub'); t.appendChild(el('span',null,lab)); d.appendChild(t);
        d.appendChild(gridItems(by[k], secLabel+' \u203A '+lab));
      });
    }
    if(m){
      if(mf){ d.appendChild(sub('morning',m)); morningBody() }
      else{
        var ageH=Math.round((Date.now()-Date.parse(m.as_of))/36e5);
        d.appendChild(el('div','xnote', m.items.length
          ? 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief is about '+ageH+' h old, older than '+XB.fresh_h.morning+' h, so its posts are hidden until the next run (daily 6:45 AM SGT).'
          : 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief had no readable posts. It will refresh with the next run (daily 6:45 AM SGT).'));
      }
    }
    if(lf){ d.appendChild(sub('large',l)); d.appendChild(gridItems(l.items, secLabel+' \u203A Large trade watch')) }
    return d;
  }

  function renderGroup(key, title, icon, items, openDefault, secLabel, tours){
    tours=tours||[];
    var d = el('details','group'); d.id='g-'+key;
    var saved = LS.get('newsdash.open.'+key);
    d.open = saved===null ? openDefault : saved==='1';
    d.addEventListener('toggle', function(){LS.set('newsdash.open.'+key, d.open?'1':'0')});
    var s = el('summary'); s.appendChild(el('span','gi',icon)); s.appendChild(el('h2','gt',title));
    s.appendChild(el('span','gc',items.length+(items.length===1?' item':' items')+(tours.length?' \u00B7 '+tours.length+(tours.length===1?' overview':' overviews'):'')));
    s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    var w = el('div','items');
    if(!items.length) w.appendChild(el('div','empty','Nothing verified for this section yet.'));
    items.forEach(function(it){w.appendChild(renderItem(it, secLabel))});
    d.appendChild(w);
    tours.forEach(function(t){d.appendChild(renderTour(t, secLabel, title))});
    return d;
  }

  function askBar(){
    var w=el('div','askbar');
    var a=el('a','btn ask','\u2726 Ask Grok about today\u2019s news'); a.href=grokUrl(overallPrompt()); a.target='_blank'; a.rel='noopener noreferrer'; w.appendChild(a);
    var c=el('button','btn ghost','Copy question'); c.type='button';
    c.addEventListener('click',function(){copyText(overallPrompt()).then(function(ok){toast(ok?'Question copied \u2014 paste it into Grok':'Copy failed \u2014 long-press to copy')})});
    w.appendChild(c);
    w.appendChild(el('span','hint','Opens grok.com with a prefilled question. Each story also has its own Ask Grok button.'));
    return w;
  }

  /* ---------- feedback panel ---------- */
  var REPO='vikasgelara-ship-it/news-dashboard';
  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});
  }
  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
