<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

pez 44' ⚽ Fermin Lopez 66' Fermín López was the hero with a brilliant brace, while Lamine Yamal provided the assist for the winner. Barcelona showed character, quality and fighting spirit to secure three massive points away from home. Man of the Match: Fermin Lopez. 🏆 BARCA REMAIN TOP OF LA LIGA.VISCA BARCA. 🔵🔴", "eng": "", "url": "https://x.com/SylvesterG20462/status/2119552603361087492", "headline": "2.3 Sylvester_FCB (@SylvesterG20462) · FULLTIME: ATLETICO MADRID 1 VS 2 BARCELONA! 🔥 WHAT A COMEBACK ⚽ Giuliano…", "tags": ["@SylvesterG20462", "x-brief", "other-trends"], "posted": "2026-11-09T06:08:14+08:00", "chars": 407, "sec": "Other trends", "src": "morning"}, {"id": "26d25bda", "name": "2.4 *Walter Bloomberg", "handle": "DeItaone", "why": "Geopolitics: Rubio says Iran talks are not productive. Not in finance because it's a political headline, though it bears on oil. About 125.5K views, 911 likes when read.", "text": "*RUBIO:TALKS NOT PRODUCTIVE, IRANIAN DEMANDS SIMPLY UNACCEPTABLE", "eng": "", "url": "https://x.com/DeItaone/status/2119552169221472317", "headline": "2.4 *Walter Bloomberg (@DeItaone) · *RUBIO:TALKS NOT PRODUCTIVE, IRANIAN DEMANDS SIMPLY UNACCEPTABLE", "tags": ["@DeItaone", "x-brief", "other-trends"], "posted": "2026-11-09T06:06:31+08:00", "chars": 64, "sec": "Other trends", "src": "morning"}, {"id": "61bf692b", "name": "2.5 zerohedge", "handle": "zerohedge", "why": "US politics: Trump's CBS interview remark on deportation policy. About 215.6K views, 859 likes, 406 replies when read.", "text": "TRUMP TELLS CBS DEPORTATION POLICY WAS, MIGHT BE 'TOO TOUGH'", "eng": "", "url": "https://x.com/zerohedge/status/2119530419347656888", "headline": "2.5 zerohedge (@zerohedge) · TRUMP TELLS CBS DEPORTATION POLICY WAS, MIGHT BE 'TOO TOUGH'", "tags": ["@zerohedge", "x-brief", "other-trends"], "posted": "2026-11-09T04:40:05+08:00", "chars": 60, "sec": "Other trends", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-09", "as_of": "2026-11-09T06:50:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-11-09T06:52:56+08:00"}, "large": {"kind": "large", "items": [{"id": "cea34e1d", "name": "Anton Golub", "handle": "Anton_Golub", "why": "", "text": "What: A roll call of fund losses tied to the AI-equity unwind: tech-focused hedge funds lost 4%+ on 5 Nov alone and are now roughly flat for the year after being up 24% in June. October hits named: Situational Awareness -67% (July), VARA -44% (July) and -33% (October), Lone Pine -8.8%, Walleye ($17B) -5.9% (worst month since March 2020), Marshall Wace Eureka -5.4%, ExodusPoint -2.4%, Millennium -2.3%. Funds sold about $20B of tech in two weeks and cut equity exposure by the most since 2016. A second post says Goldman data shows hedge funds dumped their entire net AI position built since early 2025 in five trading days, and that Walleye fired its equities head.\n\nPut on or suffering: Suffering from it: crowded long AI/semis exposure (partly via call options) forced into liquidation by multi-manager risk limits and margin calls.\n\nX sources:\n\nHedge funds lost 4% in one day. AI stocks had worst crash since COVID - Nasdaq-100 fell 6.36%, worst day since March 2020 - Chip index fell 12%, worst since 2020 - Hedge funds betting on tech lost 4%+ in a single day - Those funds were up 24% in June. Now they're flat for the year Losses started before Thursday: - Situational Awareness lost 67% in July - VARA lost 44% in July and 33% in October - Lone Pine made 40%+ in the first half, then lost 8.8% in October - Walleye ($17B) lost 5.9% in October, worst month since March 2020 - Marshall Wace Eureka -5.4%, ExodusPoint -2.4%, Millennium -2.3% in October At big multi-manager funds, a team that loses -5% gets its money cut in half. At -7.5% it's usually shut down. When everyone hits the limit at the same time, everyone sells at the same time. Funds sold ~$20 billion of tech stocks in two weeks and cut stock exposure by the most since 2016. Crowded AI trade ended with forced selling.", "eng": "", "url": "https://x.com/Anton_Golub/status/2119342694053089304", "headline": "Anton Golub (@Anton_Golub) · What: A roll call of fund losses tied to the AI-equity unwind: tech-focused…", "tags": ["@Anton_Golub", "x-brief", "large-trades"], "posted": "2026-11-08T16:14:08+08:00", "chars": 1794, "sec": "Big-name hedge funds nursing losses from the crowded AI/tech long", "src": "large"}, {"id": "a74b58d0", "name": "Adam Khoo", "handle": "adamkhootrader", "why": "", "text": "Democrats won Texas and Georgia promising to pause the data centre buildout. That was the spark. Leveraged hedge funds blowup turned it into a big sell-off. Hedge funds crowded into the same AI names, many through call options, were hit with margin calls and forced liquidations. Goldman data shows they dumped their entire net AI position built since early 2025 in just five trading days. Walleye fired its equities head. VARA lost 33% in a month. [Remainder of the post is his stock-picking view on NVDA/ASML and a promotion for a paid event; omitted as off-topic.]", "eng": "", "url": "https://x.com/adamkhootrader/status/2119281325853331548", "headline": "Adam Khoo (@adamkhootrader) · Democrats won Texas and Georgia promising to pause the data centre buildout.…", "tags": ["@adamkhootrader", "x-brief", "large-trades"], "posted": "2026-11-08T12:10:17+08:00", "chars": 567, "sec": "Big-name hedge funds nursing losses from the crowded AI/tech long", "src": "large"}, {"id": "3e7beeed", "name": "Jordi Visser", "handle": "jvisserlabs", "why": "", "text": "What: Per a JPMorgan estimate cited on X, trend-following funds and leveraged ETFs sold about $70B of US stock right after the 5 Nov open; Nasdaq-100 futures fell 4.3% between 8:30 and 10:30 a.m. New York time, and Goldman's panic gauge hit 9.57/10. Jordi Visser (281k followers, ex-Weiss Multi-Strategy) says more than 100% of the Nasdaq 100's 5% weekly fall happened in those two hours, calls it a market-structure deleveraging rather than an AI or economic break, and says he has been buying (Micron most, then Marvell and Nvidia), while warning a 'shockingly bad' Monday was possible.\n\nPut on or suffering: Suffering: CTAs, vol-control funds and leveraged ETFs forced out of equity longs. Put on: Visser adding long exposure into the forced selling.\n\nX sources:\n\n“No Más.” — Roberto Durán This was the week it felt like investors finally threw in the white towel on the AI trade. The S&P 500 was down just 2.7% for the week, but it felt far worse. The real damage wasn't in the index. It was in the hedge fund world, where what looked like a capitulation moment triggered a cascade of forced selling across hedge funds, leveraged ETFs, and CTAs. The Nasdaq 100 (NDX/QQQ) finished down 5% for the week, with more than 100% of that decline occurring in just two hours on Thursday, between 8:30 and 10:30 a.m. New York time. The magnitude of the deleveraging was extraordinary. Volatility spiked, put-call ratios reached extremes, trading volumes exploded, and hedge funds cut exposure at a historic pace. Hedge fund closure rumors went viral. And I was buying into the panic. In this week's video, I explain why I would try and catch a falling knife and why I believe we're witnessing a market structure deleveraging event rather than a breakdown in AI fundamentals or the economy. I go through the data behind the forced selling, the factor signals I'm watching for exhaustion, and why the midterm results may have actually reduced the risk of an AI bubble. I also explore the changing market structure, the emerging importance of factor rotations, and why declining liquidity headwinds could be a significant positive for AI, Bitcoin, and gold. The AI revolution is a long-duration investment opportunity being traded in an increasingly short-duration market. Investing is becoming a counterpuncher's game. The market structure has changed forever and hedge fund leverage has forever peaked. Watch the full weekly update: https://youtu.be/LJo0GGo3Sc0", "eng": "", "url": "https://x.com/jvisserlabs/status/2119422187148873996", "headline": "Jordi Visser (@jvisserlabs) · What: Per a JPMorgan estimate cited on X, trend-following funds and leveraged…", "tags": ["@jvisserlabs", "x-brief", "large-trades"], "posted": "2026-11-08T21:30:01+08:00", "chars": 2454, "sec": "Systematic funds and leveraged ETFs dumped ~$70B of equities in 90 minutes; Jordi Visser is buying the flush", "src": "large"}, {"id": "0116bd99", "name": "Vig", "handle": "vig_says", "why": "", "text": "Hedge funds dumped $70 billion of stock in 90 minutes on Thursday. Jordi Visser spent the week buying it. That number is JPMorgan's estimate for trend-following funds and leveraged ETFs, right after the open on November 5. Nasdaq-100 futures fell 4.3% between 8:30 and 10:30 a.m. New York time. Goldman's panic gauge hit 9.57 out of 10, the biggest two-day swing on record. Visser ran money through 1994, LTCM, the dot-com bust and 2008. In the video below he gives his read in one line: \"the AI bubble didn't pop, hedge fund leverage did.\" Funds weren't selling because they stopped believing in AI. They were selling because their risk limits made them. So he bought. Micron is now 13% below its 200-day average after being 200% above it, and it was the name he bought the most this week. Then Marvell and Nvidia. He even says Micron could still fall toward $500. Now the twist. In the same video he says: \"This is absolutely the type of time where you get a Monday that is just shockingly bad.\" Futures reopen tonight at 6 p.m. New York time. My take: forced selling ends when the forced sellers run out, not when the news gets better. Nobody knows if that happened Thursday. Visser doesn't either, and he says so. Is he catching the bottom of a leverage flush, or a falling knife on a Monday?", "eng": "", "url": "https://x.com/vig_says/status/2119496291113660848", "headline": "Vig (@vig_says) · Hedge funds dumped $70 billion of stock in 90 minutes on Thursday. Jordi…", "tags": ["@vig_says", "x-brief", "large-trades"], "posted": "2026-11-09T02:24:28+08:00", "chars": 1296, "sec": "Systematic funds and leveraged ETFs dumped ~$70B of equities in 90 minutes; Jordi Visser is buying the flush", "src": "large"}, {"id": "75b63134", "name": "Ole S Hansen", "handle": "Ole_S_Hansen", "why": "", "text": "What: New CFTC data (week to 3 Nov) adds numbers to yesterday's commodity-liquidation item. Saxo's Ole Hansen: hedge funds were net sellers across all 25 major commodity futures he tracks, cutting their combined net long 33% to 783k contracts, with crude, metals and grains hardest hit; corn flipped net short and natural gas shorts hit a six-year high. A separate post says money managers' short-only positions across seven Henry Hub contracts rose to 636,576, a third straight weekly record and the largest since the data began in May 2013, just as forecasts turn colder. Peak Trading Research puts ag futures selling at another $9.8B, a ninth straight week.\n\nPut on or suffering: Put on: fresh shorts (record in US natural gas, corn flipped net short). Suffering/unwinding: broad commodity long liquidation. Squeeze risk flagged in nat gas if the cold arrives.\n\nX sources:\n\nCOT on #commodities: A sea of red Ahead of the US midterms, hedge funds were net sellers across all 25 major commodity futures tracked, cutting their combined net long by 33% to 783k contracts. Widespread long liquidation and fresh short selling drove the retreat, with crude, metals and grains particularly hard hit. Corn flipped to a net short, while natural gas shorts hit a six-year high. More in my Monday update.", "eng": "", "url": "https://x.com/Ole_S_Hansen/status/2119384641769439728", "headline": "Ole S Hansen (@Ole_S_Hansen) · What: New CFTC data (week to 3 Nov) adds numbers to yesterday's…", "tags": ["@Ole_S_Hansen", "x-brief", "large-trades"], "posted": "2026-11-08T19:00:49+08:00", "chars": 1295, "sec": "Hedge funds net sellers in all 25 major commodity futures; record natural gas shorts", "src": "large"}, {"id": "bee2172c", "name": "Ciel", "handle": "0xlunasterling", "why": "", "text": "Record hedge fund shorts in US natural gas meet a possible cold snap 1. CFTC data released Friday show money managers' short-only positions across seven benchmark Henry Hub contracts rose to 636,576, the third straight weekly record and the largest since the data began in May 2013. 2. US natural gas has traded in a tight $2.60 to $3.30 range since early February. 3. Forecasts have turned colder for the Lower 48, especially the Mid-Atlantic and Northeast. A cold front is expected around Wednesday, and average temperatures in Washington, D.C. could drop to about 35°F by the end of next week. 4. With bearish bets this concentrated, a sharp reversal or short squeeze becomes a risk if the cold arrives and heating demand picks up. #NaturalGas #Commodities #Macro https://www.zerohedge.com/weather/could-one-big-cold-snap-torch-hedge-funds-record-us-natgas-shorts\n\n#AgsThisWeek: Hedge funds dumped another -$9.8B in Ag futures, extending their selling streak to nine COT weeks, with a tenth underway. 📉 Corn is now net SHORT for the first time since June. 🌽 Positioning is cleaner, but bulls need a catalyst. CPI + WASDE Tuesday. 🚜📊", "eng": "", "url": "https://x.com/0xlunasterling/status/2119425292661821910", "headline": "Ciel (@0xlunasterling) · Record hedge fund shorts in US natural gas meet a possible cold snap 1. CFTC…", "tags": ["@0xlunasterling", "x-brief", "large-trades"], "posted": "2026-11-08T21:42:21+08:00", "chars": 1135, "sec": "Hedge funds net sellers in all 25 major commodity futures; record natural gas shorts", "src": "large"}, {"id": "5f644f8f", "name": "Tickers Watch", "handle": "TickersDotWatch", "why": "", "text": "What: Taiwan's FSC curbs took effect at Monday's open: the daily cap on intraday borrowed-share short selling cut to 3% of 30-day average volume from 30%, minimum short-sale margin raised to 130% from 90% (hedging and market-making exempt), and the NT$500B (~US$15.3B) National Stabilization Fund cleared to intervene. Foreign investors sold a record net NT$994B of Taiwan shares in October. The Taiex rose as much as 6.4% Monday, ending a 7-session slide, with TSMC and MediaTek up 6%+; posters caution the bounce coincides with selling being restricted.\n\nPut on or suffering: Suffering: foreign sellers and short sellers caught by a policy-driven squeeze. The curbs remove part of the forced/short supply from Asia's biggest AI-chip index.\n\nX sources:\n\nTaiwan's market-support rules kick in at today's open, after Friday's record intraday point drop in the TAIEX. The FSC cut the daily cap on intraday borrowed-share short selling to 3% of a stock's 30-day average volume, down from 30%. Minimum short-sale margin rises to 130% from 90%. Hedging and market-making are exempt. The NT$500B (about US$15.3B) National Stabilization Fund is cleared for its 10th intervention. The last one ran from April 2025 to January 2026. Foreign investors sold a net NT$994B of Taiwan shares in October, a monthly record. $TSM\n\nTaiwan's biggest jump since July came with a catch. The Taiex rose as much as 6.4% Monday, snapping a 7-session losing streak that had pushed it into bear territory. TSMC and MediaTek were up 6%+. But that bounce started the same morning new short-selling curbs kicked in, with a NT$500B stabilization fund on standby. Korea is the cleaner read. The Kospi slipped under 5,000 again early, then turned higher, up more than 1%. Foreign investors were still net sellers for a 7th straight session. Local institutions did the buying. When a rally shows up right as selling gets restricted, day one tells you very little. The day the curbs come off tells you a lot more.", "eng": "", "url": "https://x.com/TickersDotWatch/status/2119579340287758824", "headline": "Tickers Watch (@TickersDotWatch) · What: Taiwan's FSC curbs took effect at Monday's open: the daily cap on…", "tags": ["@TickersDotWatch", "x-brief", "large-trades"], "posted": "2026-11-09T07:54:29+08:00", "chars": 1978, "sec": "Taiwan clamps down on short sellers after record foreign selling; Taiex squeezes up ~6%", "src": "large"}, {"id": "a0e0de26", "name": "J2Wick", "handle": "JJoonWick", "why": "", "text": "What: Intraday Monday brokerage data: foreign investors net sold about ₩530–588B of KOSPI cash equities while institutions bought about ₩568–692B; at the same time foreigners were net buyers of about ₩420B of KOSPI futures (institutions sold ₩362B). Foreign selling is a 7th straight session per the post above.\n\nPut on or suffering: Put on: foreign investors reducing Korean cash equity exposure while adding index-futures longs (possibly covering hedges); domestic institutions absorbing the selling.\n\nX sources:\n\n🚨 KOSPI JUMPS 1.76% DESPITE ₩530 BILLION IN FOREIGN SELLING As of 11:03–11:06 AM KST, Nov. 9. 🇰🇷 KOSPI: 5,148.78 (+1.76%) Cash market: 🔴 Foreigners: −₩529.7B 🟢 Institutions: +₩567.9B 🔴 Retail: −₩180.2B Futures: 🟢 Foreigners: +₩420B 🔴 Institutions: −₩361.6B 📈 Samsung Electronics: ₩194,800 (+3.23%) 📈 SK hynix: ₩1,179,000 (+4.15%) Institutions are driving the rebound while foreign investors continue selling Korean stocks. Foreigners are buying futures even as they sell equities.", "eng": "", "url": "https://x.com/JJoonWick/status/2119612853846266341", "headline": "J2Wick (@JJoonWick) · What: Intraday Monday brokerage data: foreign investors net sold about…", "tags": ["@JJoonWick", "x-brief", "large-trades"], "posted": "2026-11-09T10:07:39+08:00", "chars": 996, "sec": "Korea: foreigners sell KOSPI cash for a 7th session but buy index futures", "src": "large"}, {"id": "b7f1778b", "name": "J2Wick", "handle": "JJoonWick", "why": "", "text": "🚨 FOREIGN INVESTORS ARE SELLING KOREA — BUT BUYING SK HYNIX 🇰🇷 KOSPI investor flows: Foreigners: −₩587.6B Institutions: +₩691.9B Retail: −₩455.9B Yet foreign investors are selectively buying semiconductors. Samsung Electronics: ₩192,300 (+1.91%) Foreign net selling: ₩28.6B SK hynix: ₩1,162,000 (+2.65%) Foreign net buying: ₩150.1B Both stocks have retreated from their intraday highs. Institutions are supporting Samsung, while foreign investors favor SK hynix. The rebound is real. Broad foreign buying is still missing. Source: Korean brokerage data, Nov. 9, approximately 1:40 PM KST. Stock-level flows provisional as of 1:11 PM.", "eng": "", "url": "https://x.com/JJoonWick/status/2119651916867362948", "headline": "J2Wick (@JJoonWick) · 🚨 FOREIGN INVESTORS ARE SELLING KOREA — BUT BUYING SK HYNIX 🇰🇷 KOSPI investor…", "tags": ["@JJoonWick", "x-brief", "large-trades"], "posted": "2026-11-09T12:42:52+08:00", "chars": 633, "sec": "Korea: foreigners sell KOSPI cash for a 7th session but buy index futures", "src": "large"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-09", "as_of": "2026-11-09T12:58:00+08:00", "time_known": true, "file": "large-trades.html", "mtime": "2026-11-09T12:58:39+08:00"}, "links": {}};

  function fmtSGT(d){
    var p={}; dtf.formatToParts(d).forEach(function(x){p[x.type]=x.value});
    return p.weekday+' '+p.day+' '+p.month+' '+p.year+', '+p.hour+':'+p.minute+' SGT';
  }
  var dayF = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  function dayNum(d){var s=dayF.format(d).split('-');return Date.UTC(+s[0],+s[1]-1,+s[2])/864e5}
  function isDateOnly(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)}
  function parse(s){ if(!s) return null; var d = isDateOnly(s) ? new Date(s+'T00:00:00+08:00') : new Date(s); return isNaN(d)?null:d }
  function rel(s, now){
    var d=parse(s); if(!d) return {text:'time n/a', title:'Publication time not stated by the source', old:false};
    if(isDateOnly(s)){
      var n=dayNum(now)-dayNum(d), t = n<=0?'today':(n===1?'yesterday':n+'d ago');
      return {text:t, title:d.toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})+' (date only; time not stated)', old:n>=3};
    }
    var diff=(now-d)/1000, abs=Math.abs(diff), t;
    if(abs<60) t='just now';
    else if(abs<3600) t=Math.round(abs/60)+'m';
    else if(abs<172800) t=Math.floor(abs/3600)+'h';
    else t=Math.floor(abs/86400)+'d';
    if(abs>=60) t = diff>=0 ? t+' ago' : 'in '+t;
    return {text:t, title:fmtSGT(d), old:diff>3*86400};
  }

  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});

  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
