<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

ttracted +$9 billion over the last 2 weeks, its largest 2-week inflow on record.\n\nThe 3x leveraged long Nasdaq 100 ETF, $TQQQ, posted +$1.3 billion in inflows, its 2nd-largest 2-week intake of 2026.\n\nOver the last 5 months, the 10 largest US leveraged equity ETFs have attracted +$19 billion in inflows.\n\nInvestors are piling into leveraged ETFs at a record pace.\n\n[Also: @KobeissiLetter, https://x.com/KobeissiLetter/status/2114809543918071925]\n\nBREAKING: Global equity funds attracted +$28.2 billion in inflows in the week ending October 21st, marking their 5th consecutive weekly intake.\n\nOver this period, these funds posted +$138.6 billion in inflows.\n\nAsian equity funds led last week’s demand, attracting +$11.5 billion, their largest weekly intake since at least December 2022\n\nAt the same time, European and US equity funds recorded +$9.1 billion and +$5.1 billion in inflows, respectively.\n\nMeanwhile, global technology equity funds attracted +$5.1 billion, reversing -$4.8 billion in outflows in the prior week.\n\nInvestors are buying the dip in technology stocks.\n\n[Also: @unusual_whales, https://x.com/unusual_whales/status/2114843765563126239]\n\nAnthropic says in its IPO filing that its recent growth “may not be sustainable over time,” and could fall off significantly and faster than the company expects.\n\nIt comes as growth has already slowed: revenue rose about 50% in the September quarter, after more than doubling in the prior quarter.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2114827351850639388", "headline": "The Kobeissi Letter (@KobeissiLetter) · Risk appetite gauge: record-pace inflows into leveraged equity ETFs (led by 3x…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-27T05:11:46+08:00", "chars": 2208, "sec": "Finance / markets", "src": "morning"}, {"id": "1a5f83f4", "name": "Charlie Bilello", "handle": "charliebilello", "why": "US growth and inflation read-through ahead of Thursday's data: prices rising faster than wages for the first time since 2023, record-low pending home sales and homebuilder confidence at a 2012 low. About 17K to 28K views each, 97 to 208 likes. Three separate posts, not a thread.", "text": "The most important indicator for the health of the real economy is how wage growth compares to inflation.\n\nFor the first time since 2023 we're seeing prices in the US rise faster than wages, a decline in prosperity for the American worker.\n\nVideo: https://t.co/jzfV3ac8dL https://t.co/lE9K80pCNk\n\n[Also: @charliebilello, https://x.com/charliebilello/status/2114800650710053142]\n\nPending home sales in the US have moved down to their lowest level on record, falling below the prior low from April 2020 (a month where much of US economy was shut down). The housing market is essentially frozen.\n\nVideo: https://t.co/YjelL1ve4e https://t.co/Y9Z6F1D21H\n\n[Also: @charliebilello, https://x.com/charliebilello/status/2114806739971326192]\n\nUS homebuilder confidence has plunged to its lowest level since 2012.\n\nA record 43% of builders are cutting prices and 65% are offering incentives (19th straight month above 60%).\n\nThe problem? Buyers simply can't afford the homes being built.\n\nVideo: https://t.co/vxwoELZf9u https://t.co/FFRyDpguhW", "eng": "", "url": "https://x.com/charliebilello/status/2114826693546287514", "headline": "Charlie Bilello (@charliebilello) · The most important indicator for the health of the real economy is how wage…", "tags": ["@charliebilello", "x-brief"], "posted": "2026-10-27T05:09:09+08:00", "chars": 1031, "sec": "Finance / markets", "src": "morning"}, {"id": "edea5d14", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Global growth and trade: China's property investment slump is now worse than in 2020 (about 50K views, 331 likes, posted shortly before this brief). Separately, @spectatorindex relayed a Reuters report that the US and Canada are working on easing steel and auto tariffs (about 197K views, 707 likes). Separate posts, not a thread.", "text": "China's 2008 is happening now.\n\nProperty investment in China dropped -21% YoY in the first 9 months of 2026, its largest decline for this period of the year on record.\n\nThis marks a deterioration from a -20% YoY decline in the first 8 months of 2026.\n\nThe latest drop is also significantly worse than the -16% decline recorded during the 2020 pandemic.\n\nProperty investment in China has now contracted every month since 2022, its longest declining streak on record.\n\nFor perspective, during the 2008 Financial Crisis, this figure never fell below +1% YoY growth.\n\nChina's property sector is experiencing a historic downturn.\n\n[Also: @spectatorindex, https://x.com/spectatorindex/status/2114803009016537124]\n\nBREAKING: US and Canada working on a deal to ease American tariffs on steel and auto imports, according to Reuters report.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2114847475743818202", "headline": "The Kobeissi Letter (@KobeissiLetter) · China's 2008 is happening now.", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-27T06:31:44+08:00", "chars": 830, "sec": "Finance / markets", "src": "morning"}, {"id": "160bfa94", "name": "Fabrizio Romano", "handle": "FabrizioRomano", "why": "#BallonDor, Harry Kane and Alexia were top worldwide and US trends. Kane was announced as the men's winner minutes before I checked, so his posts were still climbing (Romano's had about 507K views, 29K likes; the official @ballondor post about 160K views, 25K likes). Alexia Putellas won her third women's Ballon d'Or (about 1.0M views, 24K likes). Separate posts, not a thread.", "text": "🏆✨ BREAKING: HARRY KANE WINS THE 2026 BALLON D’OR! 🌕🏴󠁧󠁢󠁥󠁮󠁧󠁿\n\n[Also: @ballondor, https://x.com/ballondor/status/2114852492601131301]\n\nHARRY KANE IS THE NEW BALLON D'OR!\n\n#ballondor https://t.co/jEn8E1bLEF\n\n[Also: @ballondor, https://x.com/ballondor/status/2114848376135004363]\n\nALEXIA PUTELLAS! SHE DID IT! She is our 2026 Ballon d'Or winner!\n\n#ballondor https://t.co/hctM4DvwuB", "eng": "", "url": "https://x.com/FabrizioRomano/status/2114852369012031588", "headline": "Fabrizio Romano (@FabrizioRomano) · 🏆✨ BREAKING: HARRY KANE WINS THE 2026 BALLON D’OR! 🌕🏴󠁧󠁢󠁥󠁮󠁧󠁿", "tags": ["@FabrizioRomano", "x-brief", "other-trends"], "posted": "2026-10-27T06:51:11+08:00", "chars": 377, "sec": "Other trends", "src": "morning"}, {"id": "8dc1b4ed", "name": "The Spectator Index", "handle": "spectatorindex", "why": "'Comey' was the top US trend, with 'Espionage Act' also trending. About 228K views, 3.4K likes. I didn't open any court documents.", "text": "BREAKING: Former FBI Director James Comey has been charged with leaking national defense information", "eng": "", "url": "https://x.com/spectatorindex/status/2114829666712473904", "headline": "The Spectator Index (@spectatorindex) · BREAKING: Former FBI Director James Comey has been charged with leaking…", "tags": ["@spectatorindex", "x-brief", "other-trends"], "posted": "2026-10-27T05:20:58+08:00", "chars": 100, "sec": "Other trends", "src": "morning"}, {"id": "7fded25c", "name": "", "handle": "Variety", "why": "'Walter Koenig', 'Star Trek' and 'Chekov' were trending in the US. Variety's post had about 537K views and 12K likes; George Takei's tribute (quoted by Variety) is below. Separate posts, not a thread.", "text": "Walter Koenig, who played Chekov in the original “Star Trek” series and seven “Star Trek” feature films, has died at 90.\n\nhttps://t.co/qwySBj1Xy9 https://t.co/3tX8YCXThG\n\n[Also: @Variety, https://x.com/Variety/status/2114820509409915377]\n\nGeorge Takei is remembering his longtime “loyal friend” and “Star Trek” co-star Walter Koenig, who died Sunday in Los Angeles:\n\n“My heart is heavy. Walter Koenig, our Ensign Pavel Chekov, passed away early today. Walter and I met on the bridge of the Enterprise in the 1960s, and we stayed friends for nearly six decades,” the post continued. “When Brad and I married in 2008, Walter stood beside us as our best man. Just last month, on Sept. 14, he turned 90, on the same day Brad and I celebrated our 18th wedding anniversary. I will always treasure that he and I shared that date. Walter was more than Chekov. He was a writer, a teacher, a thoughtful man, and a loyal friend. To the fans who loved him for so many years, thank you. He loved you too. Rest well, my dear friend. Keep navigating a steady course.”\n\nhttps://t.co/ZGmcE0xJTa", "eng": "", "url": "https://x.com/Variety/status/2114760030818058481", "headline": "@Variety · Walter Koenig, who played Chekov in the original “Star Trek” series and seven…", "tags": ["@Variety", "x-brief", "other-trends"], "posted": "2026-10-27T00:44:16+08:00", "chars": 1077, "sec": "Other trends", "src": "morning"}, {"id": "aaa1627a", "name": "thread", "handle": "OpenAI", "why": "'GPT-6.1 Terra' was a US trend. OpenAI's launch thread: the first post had about 1.9M views and 18K likes. Full thread in order below.", "text": "GPT-6.1 Terra: delivering fast and capable computer use at a lower price.\n\nGPT-6.1 Terra understands what’s on screen, takes action across apps, writes naturally, and is a more capable model for your whole workday with the efficiency to take on more of it. https://t.co/8JTN1yonmV\n\nGPT-6.1 Terra continues to advance the cost-intelligence frontier across our model families.\n\nIt’s a significant step up over GPT‑5.6 Terra, with 50% lower standard API prices.\n\nIn ChatGPT Work and Codex, your usage allowance goes further with GPT‑6.1 Terra than with GPT‑5.6 Terra—and far more than with GPT‑6.1 Sol or GPT‑6 Astra.\n\nFor in-depth research or complex coding, choose GPT-6.1 Sol or GPT-6 Astra.\n\nGPT-6.1 Terra substantially outperforms GPT-5.6 Terra on Agents’ Last Exam, a test of how well agents use software at work.\n\nIt even matches GPT-6 Astra at one-tenth the price per token and finishes tasks over 3× faster on average than both Astra and GPT-6.1 Sol. https://t.co/pzAmnvjBUi\n\nGPT-6.1 Terra is rolling out now and is available to all Plus, Pro, Enterprise, and Edu users in ChatGPT Work and Codex.\n\nDevelopers can also access it through the OpenAI API as gpt-6.1-terra.\n\nhttps://t.co/TVsi7lEeX9", "eng": "", "url": "https://x.com/OpenAI/status/2114780711664398349", "headline": "thread (@OpenAI) · GPT-6.1 Terra: delivering fast and capable computer use at a lower price.", "tags": ["@OpenAI", "x-brief", "other-trends"], "posted": "2026-10-27T02:06:27+08:00", "chars": 1199, "sec": "Other trends", "src": "morning"}, {"id": "c0d4003c", "name": "The Spectator Index", "handle": "spectatorindex", "why": "US politics ahead of the election: Trump's voter-fraud reward announcement drew about 349K views and 2.5K likes.", "text": "BREAKING: Trump announces reward for reporting voter fraud at upcoming election https://t.co/xJlLHvy7w3", "eng": "", "url": "https://x.com/spectatorindex/status/2114803931771728302", "headline": "The Spectator Index (@spectatorindex) · BREAKING: Trump announces reward for reporting voter fraud at upcoming…", "tags": ["@spectatorindex", "x-brief", "other-trends"], "posted": "2026-10-27T03:38:43+08:00", "chars": 103, "sec": "Other trends", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-27", "as_of": "2026-10-27T07:00:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-10-27T06:54:35+08:00"}, "large": {"kind": "large", "items": [{"id": "ea748d40", "name": "unusual_whales", "handle": "unusual_whales", "why": "", "text": "Position: Last week saw one of the broadest hedge-fund declines since Covid. On Oct 22, fundamental long/short fell about 1.4%, systematic about 1.3% and multistrategy about 1.9% — all three equity strategies down more than 1% the same day, the first such print since Covid. Bloomberg, citing Goldman's Tony Pasquariello, says funds sold tech last Thursday at the fastest pace in two years amid Wall Street's worst rout since July. Separately, Goldman prime data cited on X puts hedge-fund shorting of US stocks at a five-year extreme (roughly five short-sale trades per one buy), with global tech seeing its largest two-week stretch of net selling in more than 10 years of records.\n\nStatus: Suffering (broad drawdown) and putting on / extending shorts in equities and tech\n\nBREAKING: Last week, global hedge funds have suffered one of their broadest declines since the Covid pandemic, per Goldman Sachs.\n\nREPORT: Global equity hedge funds suffered their worst day since Covid on Thursday, per Goldman Sachs Fundamental L/S, systematic L/S and multi-strats all fell more than 1% on the same day", "eng": "", "url": "https://x.com/unusual_whales/status/2114658545400463811", "headline": "unusual_whales (@unusual_whales) · Position: Last week saw one of the broadest hedge-fund declines since Covid.…", "tags": ["@unusual_whales", "x-brief", "large-trades"], "posted": "2026-10-26T18:01:00+08:00", "chars": 1094, "sec": "Global hedge funds (fundamental L/S, systematic L/S, multi-strat), per Goldman Sachs", "src": "large"}, {"id": "d7448fbb", "name": "ABAB News", "handle": "ababnews_com", "why": "", "text": "Global hedge funds logged their widest one-day drawdown since Covid on Oct 22, Goldman Sachs' prime brokerage told clients, with all three broad equity strategies down over 1% the same day. Fundamental long/short fell 1.4%, systematic 1.3% and multistrategy 1.9%.", "eng": "", "url": "https://x.com/ababnews_com/status/2114478230958670322", "headline": "ABAB News (@ababnews_com) · Global hedge funds logged their widest one-day drawdown since Covid on Oct 22,…", "tags": ["@ababnews_com", "x-brief", "large-trades"], "posted": "2026-10-26T06:04:30+08:00", "chars": 263, "sec": "Global hedge funds (fundamental L/S, systematic L/S, multi-strat), per Goldman Sachs", "src": "large"}, {"id": "43c469b5", "name": "Bloomberg", "handle": "business", "why": "", "text": "Hedge funds sold tech stocks at the fastest pace in two years last Thursday amid Wall Street’s worst rout since July, Goldman Sachs’ Tony Pasquariello said\n\nHedge funds are betting against US stocks at levels not seen in 5 YEARS. And Goldman Sachs’ data suggests the selling is getting extreme. Across global stocks, there were roughly 5 short-selling trades for every 1 buying trade. Goldman knows this because its prime brokerage desk lends money and shares to hedge funds, giving it a view into how they’re positioning. Here’s what its data revealed: > Global tech stocks saw their largest two-week stretch of net selling in more than 10 years of record. > Japan’s Nikkei fell 10% in two weeks, entering a technical correction.", "eng": "", "url": "https://x.com/business/status/2114820659826008193", "headline": "Bloomberg (@business) · Hedge funds sold tech stocks at the fastest pace in two years last Thursday…", "tags": ["@business", "x-brief", "large-trades"], "posted": "2026-10-27T04:45:11+08:00", "chars": 730, "sec": "Global hedge funds (fundamental L/S, systematic L/S, multi-strat), per Goldman Sachs", "src": "large"}, {"id": "2c002764", "name": "Neil Sethi", "handle": "neilsethinew", "why": "", "text": "Position: BofA saw significant selling from the systematic community last week and says CTAs are now in a sell cycle. CTA equity positioning keeps narrowing after another hard week for tech. S&P 500 futures are the only equity market in BofA's note still consensus-long across model speeds, but the first sell trigger sits only about 0.5% below spot (Nasdaq-100 about 0.2%). In a down-market scenario BofA projects about $79B of selling ($50B CTAs, $20B vol control, $9B risk parity); even a flat week implies about $48B of selling.\n\nStatus: Putting on / extending systematic selling; CTA sell cycle\n\nBofA saw significant selling from the systematic community last week and sees CTAs now into a sell cycle. \"CTA equity positioning continues to narrow following another difficult week for technology shares. Price trends are projected to weaken across most equity markets next week. Higher realized volatility could also reduce position sizes where CTAs remain long. S&P 500 futures are now the only equity market in this report with consensus long positioning across model speeds and risk tolerances, but that exposure is increasingly at risk, with the first sell trigger only 0.5% below current levels.\" As they noted, the sell trigger for the S&P 500 now sits just around −0.5% away (from ~−1.1% last week), and it’s now the only equity market in BofA’s report where CTAs are still long across all model speeds. The Nasdaq-100’s sell trigger is even closer at ~−0.2% (from ~−0.9%). For the Russell 2000 they see the next sell trigger at ~−3.0% (from essentially at its trigger last week) along with a buy trigger at +2.4%. Globally they see selling in all scenarios for the upcoming week: −$79B of selling in a “down” market (defined as the 2.5th percentile price path or ~−2.9%, different than Goldman who uses −4.5%; from −$81B last week), with CTAs selling ~$50B, vol control ~$20B and risk parity ~$9B −$48B of selling in a flat market (from −$10B last week) as selling from CTAs (~$38B) and vol control (~$17B) more than offsets ~$7B of buying from risk parity −$1B of selling in an “up” market (defined as the 97.5th percentile price path or ~+3.5%, similar to Goldman; from −$3B last week) as ~$21B of vol-control selling offsets buying from CTAs (~$14B) and risk parity (~$6B).", "eng": "", "url": "https://x.com/neilsethinew/status/2114688512268108257", "headline": "Neil Sethi (@neilsethinew) · Position: BofA saw significant selling from the systematic community last week…", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-10-26T20:00:04+08:00", "chars": 2287, "sec": "CTAs / systematic / vol-control / risk-parity community, per Bank of America", "src": "large"}, {"id": "082f0246", "name": "Neil Sethi", "handle": "neilsethinew", "why": "", "text": "Position: Overall equity positioning has fallen to neutral (0.02 standard deviations, 41st percentile). Discretionary investor positioning is at −0.50sd (18th percentile), the lowest in over a month. Systematic strategies also cut this week from elevated levels but remain overweight at 0.65sd (79th percentile).\n\nStatus: Cutting (discretionary lightest in over a month; systematic still overweight but reduced)\n\nDB: Overall, equity positioning has now fallen to neutral (0.02sd, 41st percentile), with discretionary investor positioning (-0.50sd, 18th percentile) at the lowest in over a month. Systematic strategies’ positioning (0.65sd, 79th percentile) also fell this week from elevated levels but is still overweight.", "eng": "", "url": "https://x.com/neilsethinew/status/2114663326466916845", "headline": "Neil Sethi (@neilsethinew) · Position: Overall equity positioning has fallen to neutral (0.02 standard…", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-10-26T18:20:00+08:00", "chars": 722, "sec": "Discretionary and systematic equity investors, per Deutsche Bank positioning", "src": "large"}, {"id": "1c946f3c", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "", "text": "Position: Day-session follow-through on yesterday's crowded \"Bolsonaro trade\" unwind: Brazil's 10-year government yield jumped about +300bp toward 16% in a single day (Kobeissi). Accounts on X describe hedge funds as heavily long Brazil names (MELI, NU, XP and the complex) and facing degrossing / liquidation as EWZ and ADRs gapped lower and B3 hit circuit breakers. One São Paulo trader had called Brazil a \"one-way bet\" on a Flávio win two weeks earlier.\n\nStatus: Suffering (crowded long Brazil / election trade still unwinding)\n\nBrazil's 10Y Government Bond Yield is now pushing 16%! That's a +300 basis point gain in a single day. That would be like US mortgage rates going from 7% to 10% in a single day.\n\nProbably going to take the market down this week … Not to mention every SINGLE hedge fund on planet earth is balls long Brazil ($meli $nu $xp etc) and will cause degrossing. Ironically decent time to think about bidding some BRL equities in this sell off.\n\nSource: @PeterBerezinBCA (Peter Berezin)\n\nWe might see some hedge fund liquidation tomorrow, but at $34.20, EWZ is trading at 7.6x forward earnings, which seems like a good entry point.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2114785608312967621", "headline": "The Kobeissi Letter (@KobeissiLetter) · Position: Day-session follow-through on yesterday's crowded \"Bolsonaro trade\"…", "tags": ["@KobeissiLetter", "x-brief", "large-trades"], "posted": "2026-10-27T02:25:54+08:00", "chars": 1154, "sec": "Hedge funds / EM macro books long Brazil (follow-through after Lula runoff)", "src": "large"}, {"id": "b9052b62", "name": "Stephen Gibbs", "handle": "STHGibbs", "why": "", "text": "One hedge fund trader I spoke to in São Paulo two weeks ago said Brazil was a \"one way bet\" now (he thought) that Flávio was going to win. A reminder there are few one way bets in life.\n\nPositions and figures are as reported in the linked X posts; not independently verified. Items already sent yesterday (initial Brazil overnight gap / Goldman circuit-breaker note, Jordi Visser's 30-year deleveraging framing, AUD real-money shorts) are not repeated in full; Brazil here is day-session follow-through only.", "eng": "", "url": "https://x.com/STHGibbs/status/2114796386072035482", "headline": "Stephen Gibbs (@STHGibbs) · One hedge fund trader I spoke to in São Paulo two weeks ago said Brazil was a…", "tags": ["@STHGibbs", "x-brief", "large-trades"], "posted": "2026-10-27T03:08:44+08:00", "chars": 508, "sec": "Hedge funds / EM macro books long Brazil (follow-through after Lula runoff)", "src": "large"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-27", "as_of": "2026-10-27T12:56:00+08:00", "time_known": true, "file": "large-trades.html", "mtime": "2026-10-27T12:56:16+08:00"}, "links": {}};

  var dtf = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  function fmtSGT(d){
    var p={}; dtf.formatToParts(d).forEach(function(x){p[x.type]=x.value});
    return p.weekday+' '+p.day+' '+p.month+' '+p.year+', '+p.hour+':'+p.minute+' SGT';
  }
  var dayF = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  function dayNum(d){var s=dayF.format(d).split('-');return Date.UTC(+s[0],+s[1]-1,+s[2])/864e5}
  function isDateOnly(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)}
  function parse(s){ if(!s) return null; var d = isDateOnly(s) ? new Date(s+'T00:00:00+08:00') : new Date(s); return isNaN(d)?null:d }
  function rel(s, now){
    var d=parse(s); if(!d) return {text:'time n/a', title:'Publication time not stated by the source', old:false};
    if(isDateOnly(s)){
      var n=dayNum(now)-dayNum(d), t = n<=0?'today':(n===1?'yesterday':n+'d ago');
      return {text:t, title:d.toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})+' (date only; time not stated)', old:n>=3};
    }
    var diff=(now-d)/1000, abs=Math.abs(diff), t;
    if(abs<60) t='just now';
    else if(abs<3600) t=Math.round(abs/60)+'m';
    else if(abs<172800) t=Math.floor(abs/3600)+'h';
    else t=Math.floor(abs/86400)+'d';
    if(abs>=60) t = diff>=0 ? t+' ago' : 'in '+t;
    return {text:t, title:fmtSGT(d), old:diff>3*86400};
  }

    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
