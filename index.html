<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-11-20T05:30:58+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "db16aabc", "name": "", "handle": "i", "why": "Rates / flows: BofA's Hartnett says stay risk-off until the 10-year Treasury yield falls below 4.5%. About 131K views when read.", "text": "1.1 X post\n\nBOFA'S HARTNETT: STAY RISK-OFF UNTIL TREASURY YIELDS FALL BELOW 4.5% Bank of America's Michael Hartnett warns investors to remain risk-off until financial conditions ease. His key conditions for turning bullish: 🔸 10-year Treasury yield below 4.5% — potentially December or", "eng": "", "url": "https://x.com/i/status/2121233841327112651", "headline": "@i · 1.1 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-13T21:28:53+08:00", "chars": 285, "sec": "Finance / markets", "src": "morning"}, {"id": "45c954d2", "name": "", "handle": "i", "why": "FX / central banks: Bloomberg says the dollar is heading for its strongest weekly gain in over a month on expectations of a Fed hike next month. About 20K views when read.", "text": "1.2 X post\n\nThe dollar is heading for its strongest weekly advance in more than a month, extending a rally fueled by growing expectations that the Fed will increase interest rates next month https://t.co/WMtgQtc9oc", "eng": "", "url": "https://x.com/i/status/2121319714253119896", "headline": "@i · 1.2 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T03:10:06+08:00", "chars": 214, "sec": "Finance / markets", "src": "morning"}, {"id": "50c2de9f", "name": "", "handle": "i", "why": "FX: FinancialJuice flags suspected yen intervention (headline only, no details in the post). About 55K views when read.", "text": "1.3 X post\n\n🔴 Suspected Yen Intervention", "eng": "", "url": "https://x.com/i/status/2121305403199717512", "headline": "@i · 1.3 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T02:13:14+08:00", "chars": 40, "sec": "Finance / markets", "src": "morning"}, {"id": "57acf289", "name": "", "handle": "i", "why": "Rates / central banks: Fed report says respondents flagged deficits and heavy Treasury issuance could trigger a disorderly rise in yields. About 27K views when read.", "text": "1.4 X post\n\nSeveral respondents flagged concerns that ongoing deficits and extensive Treasury issuance could prompt disorderly yield increases: Fed report", "eng": "", "url": "https://x.com/i/status/2121347803586994367", "headline": "@i · 1.4 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T05:01:43+08:00", "chars": 154, "sec": "Finance / markets", "src": "morning"}, {"id": "66a99047", "name": "", "handle": "i", "why": "Equity themes: Goldman Sachs sees the S&P 500 at 8,700 in 2027, about 14% upside from 7,619. About 134K views when read.", "text": "1.5 X post\n\nGOLDMAN SACHS SEES S&P 500 HITTING 8,700 IN 2027 Goldman Sachs forecasts the S&P 500 reaching 8,700 over the next 12 months, implying 14% upside from 7,619 and a 16% total return including dividends. Chief global equity strategist Peter Oppenheimer expects 11% earnings growth", "eng": "", "url": "https://x.com/i/status/2121227192054985163", "headline": "@i · 1.5 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-13T21:02:27+08:00", "chars": 288, "sec": "Finance / markets", "src": "morning"}, {"id": "481d4333", "name": "", "handle": "i", "why": "Volatility / equities: Nasdaq 100 fell 2.4% to its intraday low on Friday, S&P 500 down 1.1% at that point. About 75K views when read.", "text": "1.6 X post\n\n*NASDAQ 100 FALLS 2.4% TO INTRADAY LOW; S&P 500 DOWN 1.1%", "eng": "", "url": "https://x.com/i/status/2121273475755065553", "headline": "@i · 1.6 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T00:06:22+08:00", "chars": 69, "sec": "Finance / markets", "src": "morning"}, {"id": "2f784041", "name": "", "handle": "i", "why": "Equities: US close wrap says the S&P 500 slipped as chipmaker weakness overshadowed inflation data. Article not opened. About 25K views when read.", "text": "1.7 X post\n\nS&P 500 Slips as Chipmaker Weakness Overshadows Inflation Data – US Market Wrap https://t.co/Jy26McNAsz", "eng": "", "url": "https://x.com/i/status/2121352760159563816", "headline": "@i · 1.7 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T05:21:25+08:00", "chars": 115, "sec": "Finance / markets", "src": "morning"}, {"id": "b235f7f5", "name": "", "handle": "i", "why": "Flows / hedge funds: post says non-dealer positioning in US equity futures is up $330bn, its 2nd highest on record, with asset managers, hedge funds and CTAs all long. Small account, very few views, unverified; treat with caution.", "text": "1.8 X post\n\nNon-dealer positioning in US equity futures is up +$330 billion, its 2nd-highest on record. Asset managers, hedge funds and CTAs are all long. Stretched positioning has historically capped upside as inflows stall, not a top. https://t.co/HLdjwlVT6x", "eng": "", "url": "https://x.com/i/status/2121302464683208766", "headline": "@i · 1.8 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T02:01:34+08:00", "chars": 260, "sec": "Finance / markets", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-14", "as_of": "2026-11-14T19:00:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-11-18T12:23:36+08:00"}, "large": {"kind": "large", "items": [{"id": "174d0169", "name": "", "handle": "GlobalMktObserv", "why": "", "text": "What: Net sold US equities for the 2nd straight week and the 5th time in 6 weeks, led by short sales; global single stocks net sold 9 straight weeks.\nStatus: Put on: active de-risking and adding shorts into weakness.\nX source:\n\nHedge funds are rapidly SELLING US equities: Last week, hedge funds DUMPED US equities for the 2nd consecutive week and the 5th time in 6 weeks. Short positions drove most US single-stock selling over the last 5 trading sessions. At the same time, global single stocks have now been net sold for 9 straight weeks. As a result, US technology positioning has collapsed, with the long/short ratio falling to 1.5, its lowest in Goldman Sachs' records dating back to 2016, down -30% from its June peak of 2.14. Hedge funds are selling the RIP.", "eng": "", "url": "https://x.com/GlobalMktObserv/status/2122299273077276985", "headline": "@GlobalMktObserv · What: Net sold US equities for the 2nd straight week and the 5th time in 6…", "tags": ["@GlobalMktObserv", "x-brief", "large-trades"], "posted": "2026-11-16T20:02:31+08:00", "chars": 766, "sec": "Hedge funds (Goldman Sachs prime brokerage data)", "src": "large"}, {"id": "ce1ef5d6", "name": "thread", "handle": "VolSignals", "why": "", "text": "What: Sold more than $22bn of S&P 500 in the past week, only the sixth time in four years selling has been this heavy. Goldman now models CTAs buying ~$10bn of US equities next week if the index is flat.\nStatus: Forced/systematic selling (suffering from the drawdown); possible flip to buying.\nX source:\n\nCTAs sold more than $22bn of S&P in the last week, per Goldman. That's only the sixth time in four years the weekly number has been this negative. Does systematic selling that large mean the low is in? Let's look back at the other five.. (thread) https://t.co/EgzaFulHEc A number like this usually gets read one of two ways \"the systematic sellers are done, so the low is in\" or \"the systematic sellers are active, so stay out of the way\" Goldman's own projection now has CTAs BUYING almost $10bn of US equities over the next week if the index goes When were the other five? late Feb 2023 late Sep 2023 early Aug 2024 early Mar 2025 late Mar 2026 (the dates are read off Goldman's chart, so give or take a session or two) What did SPX do from the first day the reading got that low? It was higher 5 sessions later in 2 of the 5 higher 10 sessions later in 2 of the 5 and higher 20 sessions later in 2 of the 5 The average change across all five was about -0.5% at 5 sessions, and flat at 10 and at The two Marches show how mixed it is In March 2025 the weekly number reached about -$30bn.. and SPX was ~6% lower 20 sessions after the first reading In March 2026 it reached about -$28bn.. SPX lost another 3.6% over the next week and was ~7% HIGHER 20 sessions after the first https://t.co/aWBk0G8NNC What did the five have in common? In 4 of them SPX closed lower at some point in the next 20 sessions, by anywhere from ~3% to 6% (Aug 2024 was the exception.. SPX was ~4% higher a week later and never closed below that first day) Go out to 40 sessions and 4 of the 5 were Was the first reading that low the end of the selling? In most of them it wasn't In Sep 2023 the weekly number stayed under that line for about two weeks and reached -$39bn In Mar 2025 it stayed there for more than a week and the largest of the five (Sep 2023) had SPX ~3% My view? The size of last week's CTA selling doesn't say much about the next month for SPX.. the same reading came before a 6% drop and a 7% rally What I'm watching is the 7500 line in SPX. With the index under it I think more likely lower.. this is the continuation that 7500", "eng": "", "url": "https://x.com/VolSignals/status/2122702155349905586", "headline": "thread (@VolSignals) · What: Sold more than $22bn of S&P 500 in the past week, only the sixth time in…", "tags": ["@VolSignals", "x-brief", "large-trades"], "posted": "2026-11-17T22:43:26+08:00", "chars": 2427, "sec": "CTAs / trend-followers (Goldman data)", "src": "large"}, {"id": "13b97c24", "name": "", "handle": "neilsethinew", "why": "", "text": "What: Modeled to sell ~$27bn more S&P 500 over the coming sessions, likely more after Monday's ~2% drop. Goldman puts exposure at ~$130bn against a ~$175bn ceiling; past deleveragings bottomed at $40–80bn.\nStatus: Suffering: mechanical selling as realized vol rises.\nX source:\n\nGoldman’s Brian Garrett (via ZeroHedge from @dailychartbook’s nightly email) flagged coming into Monday that global vol-control funds were modeled to sell roughly $27B more of S&P 500 stocks over the next few sessions. Then came Monday’s nearly 2% drop, which will almost certainly boost that number. Coming into the week, Tier1Alpha had noted the biggest day rolling out of the 1-month window this week was only a 1.2% decline. Monday’s drop should lift 1-month realized vol to about 22.5–23% and 3-month to around 15%. That’s roughly where Tier1Alpha projected 1-month vol for Friday if the S&P swung ±1% every day, and we got there in one session. BofA’s flat-market base case had vol control buying about $11B this week, but its down-market case had it selling about $10B. Monday put us in the down column. Goldman’s chart has exposure still around $130B, against a ceiling near $175B. Past deleveragings bottomed near $40B (2020), $80B (2022) and $65B (2025). The calendar works against a quick reset. The Nov. 5 drop of 4.4% doesn’t roll out of the 1-month window until Dec. 4, and Monday’s drop stays in it until mid-December. And that’s with Nvidia’s results on deck for Tuesday.", "eng": "", "url": "https://x.com/neilsethinew/status/2122650959641714824", "headline": "@neilsethinew · What: Modeled to sell ~$27bn more S&P 500 over the coming sessions, likely…", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-11-17T19:20:00+08:00", "chars": 1465, "sec": "Vol-control funds (Goldman's Brian Garrett; BofA, Tier1Alpha estimates)", "src": "large"}, {"id": "c218e020", "name": "", "handle": "DeItaone", "why": "", "text": "What: 95% of S&P 500 futures longs are underwater (average entry 7,768 vs 7,573), with $45.9bn at risk of liquidation. The recent 2.5% rebound was mostly short covering. Meanwhile Euro Stoxx 50 drew $4.9bn of new longs.\nStatus: Suffering: crowded longs at risk of forced selling.\nX source:\n\nCITI WARNS 95% OF S&P 500 LONG POSITIONS ARE UNDERWATER Citi warns that $45.9 billion in S&P 500 futures longs face liquidation risks as markets struggle to sustain their recovery. 🔸 95% of long positions are underwater. 🔸 Average entry: 7,768 vs. current 7,573. 🔸 Recent 2.5% rebound: Driven largely by short covering, not fresh buying. Meanwhile, European equities are attracting stronger demand, with Euro Stoxx 50 drawing $4.9 billion in new long positioning. Citi warns another S&P 500 reversal could trigger forced selling and accelerate downside momentum.", "eng": "", "url": "https://x.com/DeItaone/status/2122670327394140451", "headline": "@DeItaone · What: 95% of S&P 500 futures longs are underwater (average entry 7,768 vs…", "tags": ["@DeItaone", "x-brief", "large-trades"], "posted": "2026-11-17T20:36:58+08:00", "chars": 853, "sec": "S&P 500 futures longs (Citi positioning analysis)", "src": "large"}, {"id": "789bd0cc", "name": "", "handle": "wallstengine", "why": "", "text": "What: Short copper on the view that 'the Fed is not cutting, they're hiking'. Neither long nor short equities; in capital-preservation mode.\nStatus: Put on: short copper; flat equities.\nX source:\n\nSTANLEY DRUCKENMILLER ON THE MARKET: \"I can't remember a period where I had less clarity on where we're gonna be in 12 months.\" \"We're in capital preservation, trying to not lose money as opposed to make money.\" \"We're not long equities & we're not short.\" \"I'm really alert to the fact that the second half of '27 could be economically disappointing.\" \"I wouldn't dare go short with all the innovation going on.\" \"Those stocks are oversold, they're washed out. We have some small positions but we're basically staying away.\" We are short Copper, “The Fed is not cutting, they’re hiking.” \"I'm not playing. I play big when I'm hot, when I'm cold I do little bunts.\"", "eng": "", "url": "https://x.com/wallstengine/status/2122767953628402116", "headline": "@wallstengine · What: Short copper on the view that 'the Fed is not cutting, they're hiking'.…", "tags": ["@wallstengine", "x-brief", "large-trades"], "posted": "2026-11-18T03:04:53+08:00", "chars": 862, "sec": "Stanley Druckenmiller (Duquesne Family Office)", "src": "large"}, {"id": "f0dcaef1", "name": "", "handle": "FirstSquawk", "why": "", "text": "What: Added 110,201 contracts to their 2-year Treasury futures net short (now 1,112,745) and 48,694 to their 5-year net short (now 1,324,064).\nStatus: Put on: bigger front-end short positions (rate-hike / basis positioning).\nX source:\n\nCFTC DATA SHOWS SPECULATORS INCREASED THEIR CBOT U.S. 2-YEAR TREASURY FUTURES NET SHORT POSITION BY 110,201 CONTRACTS TO 1,112,745 AND THEIR 5-YEAR NET SHORT BY 48,694 CONTRACTS TO 1,324,064 IN THE WEEK TO NOVEMBER 10", "eng": "", "url": "https://x.com/FirstSquawk/status/2122427347454587205", "headline": "@FirstSquawk · What: Added 110,201 contracts to their 2-year Treasury futures net short (now…", "tags": ["@FirstSquawk", "x-brief", "large-trades"], "posted": "2026-11-17T04:31:27+08:00", "chars": 453, "sec": "Speculators in CBOT Treasury futures (CFTC data, week to Nov 10)", "src": "large"}, {"id": "d795a50e", "name": "", "handle": "JKempEnergy", "why": "", "text": "What: Net short of the equivalent of 2,184 bcf in the two main US gas futures and options contracts as of Nov 10. That is in the 1st percentile since 2010 and the most bearish since March 2020.\nStatus: Put on: near-record crowded short.\nX source:\n\nHEDGE FUNDS and other money managers had amassed a net short position in the two major U.S. gas futures and options contracts equivalent to 2,184 billion cubic feet by November 10. The position was among the most bearish on record and in the 1st percentile for all weeks since 2010. The last time funds were this bearish was in March 2020, when the country was on the leading edge of the coronavirus epidemic:", "eng": "", "url": "https://x.com/JKempEnergy/status/2122635505661546801", "headline": "@JKempEnergy · What: Net short of the equivalent of 2,184 bcf in the two main US gas futures…", "tags": ["@JKempEnergy", "x-brief", "large-trades"], "posted": "2026-11-17T18:18:35+08:00", "chars": 657, "sec": "Hedge funds and money managers in US natural gas (CFTC data)", "src": "large"}, {"id": "e0ec8dae", "name": "", "handle": "neilsethinew", "why": "", "text": "What: Global systematic positioning has fallen to ~$212bn, the lowest this year (from ~$350bn a month ago). BofA's base case is +$28bn of buying this week in a flat market and −$22bn in a down market.\nStatus: Suffering: de-levered after losses; set up to re-lever.\nX source:\n\nIn a positive for flows this week, after cleaning out positioning, BofA sees the systematic community ready to releverage: BofA estimates global systematic positioning slipped to ~$212B, its lowest this year, from ~$225B the prior week and ~$350B a month ago. It sees funds buying stocks this week as its base case: +$28B of buying in a flat market (from roughly $0 last week), as vol control (~$11B), risk parity (~$9B) and CTAs (~$8B, mostly Europe) all add. +$26B of buying in an “up” market (BofA’s high-percentile path, roughly +3.8% for S&P 500 futures over five days; from +$11B last week), almost all from CTAs rebuilding longs. −$22B of selling in a “down” market (BofA’s low-percentile path, roughly −5.9% for S&P futures; from −$37B last week), from CTAs (~$17B) and vol control (~$10B), partly offset by risk-parity buying (~$5B). That’s the smallest down-market estimate in at least eight weeks.", "eng": "", "url": "https://x.com/neilsethinew/status/2122298890355413210", "headline": "@neilsethinew · What: Global systematic positioning has fallen to ~$212bn, the lowest this…", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-11-16T20:01:00+08:00", "chars": 1184, "sec": "Systematic funds overall (BofA estimate)", "src": "large"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-18", "as_of": "2026-11-18T12:53:00+08:00", "time_known": true, "file": "large-trades.html", "mtime": "2026-11-18T12:53:37+08:00"}, "links": {}};

  var dtf = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  function fmtSGT(d){
    var p={}; dtf.formatToParts(d).forEach(function(x){p[x.type]=x.value});
    return p.weekday+' '+p.day+' '+p.month+' '+p.year+', '+p.hour+':'+p.minute+' SGT';
  }
  var dayF = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  function dayNum(d){var s=dayF.format(d).split('-');return Date.UTC(+s[0],+s[1]-1,+s[2])/864e5}
  function isDateOnly(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)}
  function parse(s){ if(!s) return null; var d = isDateOnly(s) ? new Date(s+'T00:00:00+08:00') : new Date(s); return isNaN(d)?null:d }
  function rel(s, now){
    var d=parse(s); if(!d) return {text:'time n/a', title:'Publication time not stated by the source', old:false};
    if(isDateOnly(s)){
      var n=dayNum(now)-dayNum(d), t = n<=0?'today':(n===1?'yesterday':n+'d ago');
      return {text:t, title:d.toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})+' (date only; time not stated)', old:n>=3};
    }
    var diff=(now-d)/1000, abs=Math.abs(diff), t;
    if(abs<60) t='just now';
    else if(abs<3600) t=Math.round(abs/60)+'m';
    else if(abs<172800) t=Math.floor(abs/3600)+'h';
    else t=Math.floor(abs/86400)+'d';
    if(abs>=60) t = diff>=0 ? t+' ago' : 'in '+t;
    return {text:t, title:fmtSGT(d), old:diff>3*86400};
  }

  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});

  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
