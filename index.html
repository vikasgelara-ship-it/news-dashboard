<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-10-25T08:49:57+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "041c3259", "name": "The Spectator Index", "handle": "spectatorindex", "why": "Oil and Iran are still the main macro driver going into the week. Trump's line about finishing the job with Iran was the most-viewed market-relevant post overnight (about 253K views, 1,848 likes, 120 reposts). @zerohedge separately flagged a Houthi missile attack on Saudi territory including the East-West pipeline (about 87K views, 558 likes), and @spectatorindex's year-to-date energy table (about 229K views, 1,520 likes, 350 reposts) shows how far the shock has run. Separate posts, not a thread. I didn't open the zerohedge article link.", "text": "BREAKING: Trump says 'I may have to finish the job with Iran, or we make a deal'.\n\n[Also: @zerohedge, https://x.com/zerohedge/status/2114051826123210973]\n\nHouthis Announce Massive Missile Attack On Saudi Territory, Including East-West Pipeline https://t.co/If0YQk2OZN\n\n[Also: @spectatorindex, https://x.com/spectatorindex/status/2114057951430529259]\n\nPrices, since start of the year.\n\nEuropean natural gas: +233%\nUK natural gas: +212%\nHeating oil: +134%\nBrent crude: +91%\nGasoline: +87%\nUS crude oil: +79%\nCoal: +40%", "eng": "", "url": "https://x.com/spectatorindex/status/2114092077500043547", "headline": "The Spectator Index (@spectatorindex) · BREAKING: Trump says 'I may have to finish the job with Iran, or we make a…", "tags": ["@spectatorindex", "x-brief"], "posted": "2026-10-25T04:30:03+08:00", "chars": 516, "sec": "Finance / markets", "src": "morning"}, {"id": "bea6117d", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Equity breadth: a useful counterpoint to Friday's headline losses. It says 61% of S&P 500 stocks are above their 50-day average and 57% above their 200-day, with breadth improving sharply even though the index has gone nowhere for three weeks. About 98K views, 439 likes, 46 reposts. Single post, no thread.", "text": "US equity market breadth is rapidly improving:\n\nThe proportion of S&P 500 stocks trading above their 50-day moving average surged +5 percentage points on Friday, to 61%, the highest reading since mid-August.\n\nSince the October 1st intraday low, this figure has more than tripled.\n\nAdditionally, the proportion of S&P 500 stocks trading above their 200-day moving average rose +3 percentage points on Friday, to 57%, the most since September 9th.\n\nOver the last 3 weeks, this figure has risen +17 percentage points.\n\nThis comes despite the S&P 500 remaining roughly unchanged over the same period.\n\nThis also ranks among the 3 sharpest improvements in market breadth over the last 3 years.\n\nOn Thursday alone, 335 S&P 500 stocks finished higher, despite the index declining -1.2% on that day.\n\nThe market is strengthening beneath the surface.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2114083152419316145", "headline": "The Kobeissi Letter (@KobeissiLetter) · US equity market breadth is rapidly improving:", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-25T03:54:35+08:00", "chars": 841, "sec": "Finance / markets", "src": "morning"}, {"id": "f5b011d6", "name": "The Kobeissi Letter", "handle": "KobeissiLetter", "why": "Growth: strong October PMIs (manufacturing 56.0, composite 57.6) going into a Fed week where oil is pushing inflation up. Relevant to how hawkish the Fed sounds on Wednesday. About 57K views, 245 likes, 27 reposts. The GDP-tracking figures are the author's claim. Single post, no thread.", "text": "BREAKING: The S&P Global US Manufacturing PMI index rose +0.1 point in October, to 56.0, its highest level since May 2022.\n\nThis exceeded expectations of a -0.4 point decline.\n\nThe improvement was particularly driven by job growth, which rose to its strongest level since March 2012.\n\nMeanwhile, the Services PMI index fell -0.9 points, to 57.9, its 2nd-highest level in 4 years.\n\nThis brought the Composite PMI index down -0.8 points, to 57.6, also its 2nd-highest in 4 years.\n\nDespite the slight decline, these readings point to GDP growth of +5.0% at an annualized rate in Q4 2026, following projected growth of +4.0% in Q3 2026.\n\nUS economic growth is booming amid the AI Revolution.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2114113892385464685", "headline": "The Kobeissi Letter (@KobeissiLetter) · BREAKING: The S&P Global US Manufacturing PMI index rose +0.1 point in…", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-10-25T05:56:44+08:00", "chars": 687, "sec": "Finance / markets", "src": "morning"}, {"id": "d9d5ed66", "name": "positioning", "handle": "zerohedge", "why": "Positioning: Goldman says hedge-fund stop-outs after the AI selloff have pushed net exposure to a one-year low, and its trader Pasquariello says the selloff \"cut into some bone\". Lower nets mean less forced selling left if the tape turns. About 48K and 65K views. Headlines only; I didn't open the linked articles. Separate posts, not a thread.", "text": "The AI Hangover: Goldman Says Buy The Dip As Hedge Fund Stop-Outs Push Nets To A One-Year Low https://t.co/poNzzly0dM\n\n[Also: @zerohedge, https://x.com/zerohedge/status/2114058118711673228]\n\n\"Licking My Wounds\": Goldman's Pasquariello Swims Closer To Shore After AI Selloff \"Cut Into Some Bone\" https://t.co/FFFTGtxKKY", "eng": "", "url": "https://x.com/zerohedge/status/2114099642304466972", "headline": "positioning (@zerohedge) · The AI Hangover: Goldman Says Buy The Dip As Hedge Fund Stop-Outs Push Nets To…", "tags": ["@zerohedge", "x-brief"], "posted": "2026-10-25T05:00:07+08:00", "chars": 318, "sec": "Finance / markets", "src": "morning"}, {"id": "398d9f1a", "name": "Ted Darling", "handle": "tdarling1", "why": "Fed week: the FOMC decides Wednesday (X's news summary says 27 to 28 Oct, with MSFT and GOOGL earnings the same day and GDP and core PCE on Thursday). Futures price only about a 10% chance of a hike; this thread argues for 60% based on inflation expectations, a contrarian view worth having in mind. Low engagement (about 369 views on the opener) but directly on point. The full 6-post thread is below in order; charts weren't visible to me. @ValueSpectre's weekend recap (about 807 views, 31 likes) lays out last week's index moves and next week's calendar.", "text": "Is the market about to be caught by surprise by the FOMC on Wednesday?\n\nCME Fed Funds Futures is showing only a 10% probability of an interest rate hike this week\n\n1/n https://t.co/bNTD9Ll2hS\n\nYet, inflation expectations have continued to accelerate.\n\nHere, the 10Y expected inflation (green line) ticked up to +2.7% with a clear acceleration\n\n2/n https://t.co/UolUUMrfWG\n\nThe 5-Year Breakeven Inflation Rate ramped to +2.48% this week and is also accelerating\n\n3/n https://t.co/PZJw21uejY\n\nThe unusual offset to this by an unusually abrupt decline in 5-Year, 5-Year Forward Inflation Expectation Rate to +2.2%\n\n4/n https://t.co/8pKVWrCa4e\n\nHow is the 5Y5Y forward reconciled with rising inflation expectations?\n\nOne word. Warsh.\n\nHe has told us that the Fed will take action to bring inflation to its 2% target\n\n5/n\n\nThe current acceleration in inflation is clearly inconsistent with the Fed mandate and Warsh's explicit statements\n\nThat's why I put a 60% probability of a +25 bps hike on Wednesday\n\nThe fact that the market is not positioned for a hike suggests BIG trouble if I am right\n\n/fin\n\n[Also: @ValueSpectre, https://x.com/ValueSpectre/status/2113879252131025279, a separate post]\n\n☀️ Good morning, investors!\n\nWhat a week on Wall Street! Next week could be even more interesting. 👀\n\n📊 Last week’s performance:\n\nS&P 500: −0.47%\nNasdaq: −0.71%\nDow Jones: +0.41%\nRussell 2000: +2.0%\n\nHere’s what matters heading into next week:\n\n🛢️ Oil: Brent surged above $116/barrel, reigniting inflation fears.\n\n📈 Bonds: The US 10-year Treasury yield approached 5%, putting pressure on growth stocks and highly leveraged AI companies.\n\n💰 Earnings: S&P 500 Q3 earnings are tracking 29.5% YoY growth, with 83% of reporting companies beating EPS estimates.\n\n📉 Valuations: The S&P 500 trades at 18.7x forward earnings, below its 10-year average of 19.1x.\n\n🔥 Next week is huge!\n\n179 S&P 500 companies are scheduled to report, including:\n$MSFT, $GOOGL, $AMZN, $V, $VRT and many more.\n\n🏦 Wednesday: Fed interest rate decision.\n\n📊 Important economic data and fresh AI capex guidance from the hyperscalers.\n\nMy biggest takeaway?\n\nEarnings are growing, valuations are becoming more attractive, but higher rates and AI spending concerns are creating uncertainty.\n\nNext week could tell us a lot about where this market is heading.\n\nEnjoy your weekend! ☕", "eng": "", "url": "https://x.com/tdarling1/status/2114053321203814594", "headline": "Ted Darling (@tdarling1) · Is the market about to be caught by surprise by the FOMC on Wednesday?", "tags": ["@tdarling1", "x-brief"], "posted": "2026-10-25T01:56:03+08:00", "chars": 2335, "sec": "Finance / markets", "src": "morning"}, {"id": "5e29f0cd", "name": "", "handle": "espnmma", "why": "Volkanovski stopped Movsar Evloev in round 2 to keep the featherweight title, and Petr Yan vs Merab Dvalishvili won fight of the night. @espnmma's post about 38K views, 3,165 likes; the UFC's own celebration post had about 68K views, 3,607 likes. Videos weren't visible to me. Separate posts, not a thread.", "text": "1. UFC 333 (trending #1 in the US and worldwide, with Volk, Merab, Petr Yan, Evloev): @espnmma and @ufc\n\nVOLK FINISHES EVLOEV IN THE SECOND ROUND TO RETAIN HIS FEATHERWEIGHT TITLE 🏆 #UFC333 https://t.co/CkwoSZpWIW\n\n[Also: @espnmma, https://x.com/espnmma/status/2114109086266433992]\n\nAfter his victory, Alex Volkanovski has now passed Jose Aldo for the most title fight wins in UFC featherweight history (9) 👏\n\nOne of the best to ever step foot inside the Octagon 👑 #UFC333 https://t.co/W67yk4QKJ4\n\n[Also: @ufc, https://x.com/ufc/status/2114116525842178324]\n\nONE FOR THE AGES 🫳\n\n@PetrYanUFC and Merab Dvalishvili earn FOTN honors after an iconic showdown at #UFC333!\n\nB2YB: @ToyoTires https://t.co/sq0duCbeHL", "eng": "", "url": "https://x.com/espnmma/status/2114103639761379440", "headline": "@espnmma · 1. UFC 333 (trending #1 in the US and worldwide, with Volk, Merab, Petr Yan,…", "tags": ["@espnmma", "x-brief", "other-trends"], "posted": "2026-10-25T05:16:00+08:00", "chars": 707, "sec": "Other trends", "src": "morning"}, {"id": "7b7b2105", "name": "", "handle": "spectatorindex", "why": "Second Saturday of mass protests in France (about 410,000 marchers per the Interior Ministry, nearly 1,000 arrests), with rioting reported in Barcelona late Saturday. @spectatorindex's Barcelona post about 105K views, 966 likes. The France write-up is from a smaller account (about 328 views) but gives the clearest full picture. Separate posts, not a thread.", "text": "2. Europe cost-of-living protests (Paris, Barcelona): @spectatorindex and @HeartlandsTrib\n\nBREAKING: Reports of rioting and looting in parts of Barcelona\n\n[Also: @HeartlandsTrib, https://x.com/HeartlandsTrib/status/2114115491405128041]\n\nFrance is back on the streets.\n\nMore than 400,000 people marched across France today in a second national day of mass protest over the rising cost of living, inequality and pressure on education.\n\nIn Paris alone, police put the crowd at 110,000.\n\nBy nightfall, the demonstrations had descended into clashes in parts of the capital and other cities. Tear gas and water cannon were deployed, and Interior Minister Laurent Nuñez says almost 1,000 people have been arrested, with that number expected to rise.\n\nThis is no longer a single bad weekend for France. The anger over falling living standards and deteriorating public services has returned to the streets for a second successive Saturday.\n\nAnd France is not alone. Protests have taken place across several European countries today.\n\nEurope's cost-of-living crisis is becoming increasingly difficult to contain.", "eng": "", "url": "https://x.com/spectatorindex/status/2114116899902816549", "headline": "@spectatorindex · 2. Europe cost-of-living protests (Paris, Barcelona): @spectatorindex and…", "tags": ["@spectatorindex", "x-brief", "other-trends"], "posted": "2026-10-25T06:08:41+08:00", "chars": 1102, "sec": "Other trends", "src": "morning"}, {"id": "a78c282a", "name": "", "handle": "cgtnafrica", "why": "Brazil votes today (Sunday) in the Lula vs Flávio Bolsonaro runoff, and Brazilian election hashtags filled the top of the worldwide trends. The most-viewed English poll post I found is small (about 1.3K views); most of the volume is in Portuguese hashtags. Single post.", "text": "3. Brazil presidential runoff today (trending worldwide: #EuVotoFazendoL, #ComLulaNaRua, #AposentadosComLula): @cgtnafrica\n\nFlavio Bolsonaro, Lula about even ahead of Brazil election runoff, CNT/MDA poll shows", "eng": "", "url": "https://x.com/cgtnafrica/status/2113998402274857452", "headline": "@cgtnafrica · 3. Brazil presidential runoff today (trending worldwide: #EuVotoFazendoL,…", "tags": ["@cgtnafrica", "x-brief", "other-trends"], "posted": "2026-10-24T22:17:49+08:00", "chars": 209, "sec": "Other trends", "src": "morning"}, {"id": "1a573872", "name": "", "handle": "iambolar", "why": "Aston Villa handed Man City their first league loss of the season, and per X's news summary Arsenal beat Everton 2-0 to draw level with City on 21 points. This full-time post about 1.1K views, 21 likes. I didn't find a strong post on the Chelsea and Spurs trends to quote. Single post.", "text": "4. Premier League (Chelsea, Spurs, Tottenham trending worldwide): @iambolar\n\nFT:\n\nAston Villa 2-1 Man City (Jackson x2; Haaland)\n\nAston Villa beat Man City again. It’s now three wins in a row against Man City. It’s also Man City’s first defeat of the season.\n\n#AVLMCI #AVFC https://t.co/UNqajv2VeE", "eng": "", "url": "https://x.com/iambolar/status/2113985335990563092", "headline": "@iambolar · 4. Premier League (Chelsea, Spurs, Tottenham trending worldwide): @iambolar", "tags": ["@iambolar", "x-brief", "other-trends"], "posted": "2026-10-24T21:25:54+08:00", "chars": 297, "sec": "Other trends", "src": "morning"}, {"id": "9b8e81ec", "name": "", "handle": "CFBStatSource", "why": "Illinois upset Oregon 21-10, which X's news summary says likely ends Oregon's playoff hopes, and fans turned on the Ducks' offensive coordinator. The box-score post is tiny (about 47 views) but has the cleanest full result; bigger posts were mid-game updates. Single post.", "text": "5. College football (Dan Lanning, Drew Mehringer, Michigan, Iowa trending in the US): @CFBStatSource\n\nFINAL — Oregon @ Illinois\n\n@oregonfootball 10\n@IlliniFootball 21\n\n• Illinois scored 21 unanswered points after trailing 10-0\n• Aidan Laughery 13 car • 123 YDS • 1 TD (75-yard TD run) for Illinois\n• Michael Clayton II 11/18 • 84 YDS • 2 TD for Illinois\n• Dylan Raiola 27/41 • 246 YDS for Oregon\n• Oregon outgained Illinois 426-314\n\n@oregonfootball @IlliniFootball\nFull sheet ↓ Follow @CFBStatSource for every P4 Final\n#CFB #B1G #Illinois #Oregon", "eng": "", "url": "https://x.com/CFBStatSource/status/2114121222074011939", "headline": "@CFBStatSource · 5. College football (Dan Lanning, Drew Mehringer, Michigan, Iowa trending in…", "tags": ["@CFBStatSource", "x-brief", "other-trends"], "posted": "2026-10-25T06:25:52+08:00", "chars": 546, "sec": "Other trends", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-25", "as_of": "2026-10-25T06:55:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-10-25T06:52:58+08:00"}, "large": {"kind": "large", "items": [{"id": "9c44f8d5", "name": "Global Markets Investor", "handle": "GlobalMktObserv", "why": "", "text": "Position: Suffering on Thursday Oct 22: all three major strategies lost more than 1% on the same day, a first since COVID. Goldman's hedge fund VIP longs versus most-shorted basket fell 4.2%, its worst day since 2011, and is down 10.4% month to date. Fundamental L/S -1.4%, TMT funds -2.7% (about -10% for October), systematic -1.3%, multi-strategy -1.9%; over two-thirds of funds finished red as crowded shorts were squeezed late in the session while AI longs sold off.\nStatus: Suffering from it\n\nHedge funds suffered their worst broad-based LOSSES in more than a DECADE: Goldman Sachs' hedge fund VIP long portfolio relative to the most-shorted stocks plunged -4.2% on Thursday, its worst daily move since 2011, and is now down -10.4% month to date. The only larger 1-day decline since the aftermath of the Great Financial Crisis was -8.26% on August 8th, 2011, the first trading day after S&P downgraded the US sovereign credit rating. The broader hedge fund industry also suffered heavy losses, with fundamental long/short managers falling -1.4%, their worst daily performance since July 16th, while technology, media and telecommunications-focused funds dropped an average of -2.7%. Systematic long/short managers lost -1.3%, while multistrategy funds fell -1.9%, their 2nd-worst day since the April 2025 tariff selloff. Overall, more than 66% of hedge funds ended Thursday in negative territory as concentrated short positions were squeezed during the 2nd half of the session. The selloff coincided with a -2.9% plunge in the Nasdaq 100, its largest daily decline since June, as doubts over massive AI infrastructure spending and rising oil-driven inflation intensified market pressure. The US equity market turmoil is spreading across portfolios.\n\nHoly shit, catastrophic week for hedge funds: -> ALL 3 major strategies tracked by Goldman Sachs lost more than 1% yesterday — first since COVID -> Meta slumped 7% on plans for a NEW share class — Nasdaq lost 2.6%, worst day since June -> Tech-focused hedge funds are DOWN about 10% this month — Asia-focused funds about 9% -> Retail was MORE calm than the pros — kept buying chip, storage and AI cloud stocks -> Hedge funds' crowded AI trades — BEING CUT -> Forced selling at the funds — TRIGGERED -> Hedge fund risk-taking — REINED IN -> Major strategies that escaped yesterday — ZERO Process that. Goldman Sachs told its hedge fund clients: \"If last Thursday felt bad, today has been worse.\" Losses in crowded AI bets forced the pros to cut, and tech-focused funds are down about 10% this month.", "eng": "", "url": "https://x.com/GlobalMktObserv/status/2113634549770965430", "headline": "Global Markets Investor (@GlobalMktObserv) · Position: Suffering on Thursday Oct 22: all three major strategies lost more…", "tags": ["@GlobalMktObserv", "x-brief", "large-trades"], "posted": "2026-10-23T22:12:00+08:00", "chars": 2553, "sec": "Hedge funds broadly (Goldman Sachs prime book: fundamental L/S, systematic, multi-strategy)", "src": "large"}, {"id": "afd50193", "name": "Melvin", "handle": "MelvinInvests", "why": "", "text": "Position: Net sellers of more than $1B of technology stocks on 7 of the last 10 trading days; the rolling 20-day net flow is about -$11B, one of the most extreme stretches of tech selling in two years.\nStatus: Put on (heavy selling)\n\nThis selloff is a lot closer to the bottom than we think. According to Jefferies, over the past 10 trading days, its clients have been net sellers of more than $1B worth of technology stocks on 7 separate days. This chart tracks the buying and selling activity of Jefferies' clients over a rolling 20 day period. When the purple line is above zero, investors are buying more than they're selling. When it's below zero, they're selling more than they're buying. Right now, that number has collapsed to approximately negative $11B, making this one of the most extreme periods of technology selling we've seen in the past two years. For comparison, even during the major selloffs earlier in 2025 and 2026, the selling pressure wasn't consistently this severe. And remember, this is just one investment bank's trading activity. [...]", "eng": "", "url": "https://x.com/MelvinInvests/status/2113625408855736636", "headline": "Melvin (@MelvinInvests) · Position: Net sellers of more than $1B of technology stocks on 7 of the last…", "tags": ["@MelvinInvests", "x-brief", "large-trades"], "posted": "2026-10-23T21:35:41+08:00", "chars": 1063, "sec": "Jefferies institutional clients (tech flows)", "src": "large"}, {"id": "1f65d2a8", "name": "Craig Shapiro", "handle": "ces921", "why": "", "text": "Position: A record $15B+ of forced market-on-close selling from SOXL and TQQQ on Oct 22 drove the index-level loss even as 68% of S&P 500 members closed green; the author calls it a passive-concentration unwind, with dealers modestly short gamma and buybacks in blackout into next week's FOMC.\nStatus: Forced selling (suffering from it)\n\nForced selling in mega-cap tech masked a market where 68% of stocks actually closed green. TL;DR 1/ A record $15B+ in forced MOC selling from SOXL and TQQQ drove an index-level loss while 68% of SPX constituents closed green: this is a passive-concentration unwind, not broad macro deterioration. 2/ The near-4-sigma bond rally pushed 10-year yields below 5%, but gold's failure to bid alongside falling yields and a weaker dollar is a loud warning that the flight-to-quality narrative is shakier than it looks. 3/ Brent above $114, Iran threatening Gulf energy infrastructure, and European natgas near 90 euros/MWh are feeding into financial conditions through the inflation channel and compounding the AI capex credibility crisis now showing up in credit spreads. 4/ With dealers modestly short gamma and the buyback blackout in force, any catalyst into next week's FOMC can feed on itself. Regime: Fragile. Favor defined-risk structures over outright directional index longs into next week's FOMC and geopolitical catalysts.", "eng": "", "url": "https://x.com/ces921/status/2113598765290381462", "headline": "Craig Shapiro (@ces921) · Position: A record $15B+ of forced market-on-close selling from SOXL and TQQQ…", "tags": ["@ces921", "x-brief", "large-trades"], "posted": "2026-10-23T19:49:49+08:00", "chars": 1365, "sec": "Leveraged tech ETFs (SOXL, TQQQ) rebalancing", "src": "large"}, {"id": "6eb1a5f7", "name": "", "handle": "Contagion0313", "why": "", "text": "Position: Max short Nasdaq 100, Russell 2000 and bonds, while still long S&P 500.\nStatus: Put on (positioning)\n\nCTAs are max short on NDX, RTY, and Bonds except for being long still SPX via CITI", "eng": "", "url": "https://x.com/Contagion0313/status/2113623291562967228", "headline": "@Contagion0313 · Position: Max short Nasdaq 100, Russell 2000 and bonds, while still long S&P…", "tags": ["@Contagion0313", "x-brief", "large-trades"], "posted": "2026-10-23T21:27:16+08:00", "chars": 194, "sec": "CTAs (trend followers), per Citi", "src": "large"}, {"id": "6f5ed4aa", "name": "", "handle": "TradeGateHub", "why": "", "text": "Position: Leveraged funds remain net short 2.11M 10-year T-note futures but covered 98,713 contracts on the week as the 10-year hovered near 5%; asset managers are net long 2.93M, up 26,854.\nStatus: Leveraged funds: suffering from the bond rally (covering shorts); asset managers: adding longs\n\nCFTC data for Oct. 20: asset managers were net long 2.93M 10-year T-note futures, up 26,854 WoW; leveraged funds remained net short 2.11M but covered 98,713. Both groups shifted longward as the cash 10-year yield hovered near 5%.", "eng": "", "url": "https://x.com/TradeGateHub/status/2113769686793900219", "headline": "@TradeGateHub · Position: Leveraged funds remain net short 2.11M 10-year T-note futures but…", "tags": ["@TradeGateHub", "x-brief", "large-trades"], "posted": "2026-10-24T07:08:59+08:00", "chars": 524, "sec": "Leveraged funds and asset managers in 10-year T-note futures (CFTC, Oct 20)", "src": "large"}, {"id": "1bfb0890", "name": "", "handle": "Alea_", "why": "", "text": "Position: Net short euro raised by 1,305 contracts to 94.1k, the largest since March 2020, roughly EUR 11.8bn of bearish exposure, driven by French political and debt stress, slowing euro-area growth and limited ECB hiking scope.\nStatus: Put on (crowded short)\n\nHedge funds' bearish euro bets rise to highest since March 2020 For the week to Oct 20, leveraged funds increased net short euro positions by 1,305 contracts to 94.1k contracts, the largest since March 2020, equivalent to roughly EUR 11.8bln of bearish exposure. Market concerns tied to French political turmoil, rising debt pressures and protests weighed on the euro. Investors also cited slowing Euro-area growth and limited ECB hiking scope, which could widen US–Europe rate differentials. EUR/USD fell 0.4% on the week.", "eng": "", "url": "https://x.com/Alea_/status/2113734739827789902", "headline": "@Alea_ · Position: Net short euro raised by 1,305 contracts to 94.1k, the largest since…", "tags": ["@Alea_", "x-brief", "large-trades"], "posted": "2026-10-24T04:50:07+08:00", "chars": 785, "sec": "Hedge funds / leveraged funds in euro futures (CFTC, week to Oct 20)", "src": "large"}, {"id": "dcf3a096", "name": "", "handle": "crossvol_x", "why": "", "text": "Position: The biggest BRL long in 86 weekly reports got its first cut: net long fell 8,937 contracts to 18,677 (the same bet as short USD/BRL, around 4.96).\nStatus: Trimming a large long\n\nThe biggest Brazilian real long in 86 weekly reports just got its first cut. Leveraged funds hold 18,677 net long futures as of Tuesday Oct 20, down 8,937 contracts from 27,614. That is the same bet as short $USDBRL, which trades at 4.9642 today.\n\nPositions and figures are as reported in the linked X posts; not independently verified.", "eng": "", "url": "https://x.com/crossvol_x/status/2113744188109926452", "headline": "@crossvol_x · Position: The biggest BRL long in 86 weekly reports got its first cut: net…", "tags": ["@crossvol_x", "x-brief", "large-trades"], "posted": "2026-   function fmtSGT(d){
    var p={}; dtf.formatToParts(d).forEach(function(x){p[x.type]=x.value});

  function dayNum(d){var s=dayF.format(d).split('-');return Date.UTC(+s[0],+s[1]-1,+s[2])/864e5}
  function isDateOnly(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)}
  function parse(s){ if(!s) return null; var d = isDateOnly(s) ? new Date(s+'T00:00:00+08:00') : new Date(s); return isNaN(d)?null:d }
  function rel(s, now){
    var d=parse(s); if(!d) return {text:'time n/a', title:'Publication time not stated by the source', old:false};
    if(isDateOnly(s)){
      var n=dayNum(now)-dayNum(d), t = n<=0?'today':(n===1?'yesterday':n+'d ago');
      return {text:t, title:d.toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})+' (date only; time not stated)', old:n>=3};
    }
    var diff=(now-d)/1000, abs=Math.abs(diff), t;
    if(abs<60) t='just now';
    else if(abs<3600) t=Math.round(abs/60)+'m';
    else if(abs<172800) t=Math.floor(abs/3600)+'h';
    else t=Math.floor(abs/86400)+'d';
    if(abs>=60) t = diff>=0 ? t+' ago' : 'in '+t;
    return {text:t, title:fmtSGT(d), old:diff>3*86400};

    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
