<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

iews when read.", "text": "1.7 X post\n\nS&P 500 Slips as Chipmaker Weakness Overshadows Inflation Data – US Market Wrap https://t.co/Jy26McNAsz", "eng": "", "url": "https://x.com/i/status/2121352760159563816", "headline": "@i · 1.7 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T05:21:25+08:00", "chars": 115, "sec": "Finance / markets", "src": "morning"}, {"id": "b235f7f5", "name": "", "handle": "i", "why": "Flows / hedge funds: post says non-dealer positioning in US equity futures is up $330bn, its 2nd highest on record, with asset managers, hedge funds and CTAs all long. Small account, very few views, unverified; treat with caution.", "text": "1.8 X post\n\nNon-dealer positioning in US equity futures is up +$330 billion, its 2nd-highest on record. Asset managers, hedge funds and CTAs are all long. Stretched positioning has historically capped upside as inflows stall, not a top. https://t.co/HLdjwlVT6x", "eng": "", "url": "https://x.com/i/status/2121302464683208766", "headline": "@i · 1.8 X post", "tags": ["@i", "x-brief"], "posted": "2026-11-14T02:01:34+08:00", "chars": 260, "sec": "Finance / markets", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-14", "as_of": "2026-11-14T19:00:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-11-18T12:23:36+08:00"}, "large": {"kind": "large", "items": [{"id": "08a2f1fe", "name": "", "handle": "BullRush__", "why": "", "text": "Who: Fundamental long/short hedge funds (Goldman Sachs prime book)\nWhat: Shorted US single stocks every day of the week through Thu 19 Nov — largest weekly shorting since June 2022, 3rd largest in a decade. Week of 13–19 Nov: $1.4 short sales per $1 long buys in US single stocks, ~$4.5 in global financials, ~$7 in US financials. Beta-adjusted net leverage fell from ~84% in June to ~48–55%; beta-adjusted gross leverage fell 8 pts to 208.8%, a 3-year low. De-risking came mostly from cutting high-beta longs.\nPut on or suffering: PUT ON (new shorts, extending from tech into banks/financials) and SUFFERING (forced de-grossing of high-beta longs)\n\n(BullRush), 2026-11-23 04:27 SGT\nFundamental L/S hedge fund net leverage just collapsed. Goldman Sachs data shows it fell from roughly 84% of fund equity in June to roughly 48% now on a beta-adjusted basis, below the April 2025 low and the late-2022 low.\n\nThey did not buy the dip. They shorted it. Goldman's prime book saw US single stocks shorted every day of the week through Thursday, the largest weekly shorting since June 2022 and the third largest of the past decade.\n\nIn the week of Nov 13-19, funds sold short $1.4 for every $1 of long buys in US single stocks, $4.5 in global financials and about $7 in US financials.\n\nFast money positioning is close to flushed. The short book is moving beyond tech and into the banks. The open question is whether real money, still long, follows.\n\n$SPY $QQQ", "eng": "", "url": "https://x.com/BullRush__/status/2124600800169111818", "headline": "@BullRush__ · Who: Fundamental long/short hedge funds (Goldman Sachs prime book)", "tags": ["@BullRush__", "x-brief", "large-trades"], "posted": "2026-11-23T04:27:58+08:00", "chars": 1452, "sec": "Hedge funds short the dip: biggest single-stock short wave since 2022, net leverage collapses", "src": "large"}, {"id": "90d95424", "name": "", "handle": "neilsethinew", "why": "", "text": "(Neil Sethi NEW account), 2026-11-22 21:30 SGT\nAnd the hedge fund selling continued to be in the higher risk part of the book (through Nov. 19):\n\n▪ Beta-adjusted gross leverage fell 8.0 points to 208.8%, a three-year low (0th percentile on both a one- and three-year basis).\n▪ Beta-adjusted net leverage fell 5.8 points to 54.6% (0th percentile one-year, 1st three-year).\n▪ Raw net leverage dipped just 0.6 points to 44.8%, so the de-risking came mostly from cutting high-beta longs.\n▪ Backing out the average beta of their longs, it slipped to about 1.05 from 1.09 (1.11 at the end of October).\n\nSo the hidden high-beta risk I flagged at the end of October has now mostly come out of their books.", "eng": "", "url": "https://x.com/neilsethinew/status/2124495616965226536", "headline": "@neilsethinew · (Neil Sethi NEW account), 2026-11-22 21:30 SGT", "tags": ["@neilsethinew", "x-brief", "large-trades"], "posted": "2026-11-22T21:30:00+08:00", "chars": 697, "sec": "Hedge funds short the dip: biggest single-stock short wave since 2022, net leverage collapses", "src": "large"}, {"id": "7f3fc535", "name": "", "handle": "zerohedge", "why": "", "text": "(zerohedge), 2026-11-22 22:00 SGT\nShorting The Dip: Hedge Funds Launch Biggest Single-Stock Short Wave Since 2022, Dump US Financials At Fastest Pace In Five Years https://t.co/WemVJuiNRC", "eng": "", "url": "https://x.com/zerohedge/status/2124503278113214785", "headline": "@zerohedge · (zerohedge), 2026-11-22 22:00 SGT", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-22T22:00:27+08:00", "chars": 187, "sec": "Hedge funds short the dip: biggest single-stock short wave since 2022, net leverage collapses", "src": "large"}, {"id": "0d1c771a", "name": "", "handle": "fintechfrank", "why": "", "text": "Who: Hedge funds and systematic funds (Goldman Sachs prime book / Cullen Morgan)\nWhat: HFs sold tech at the fastest pace on record over 6 weeks (net tech selling z-score −4.4; tech long/short ratio down from 2.9 to 1.79, near 10-yr lows). Prime-book net exposure at multi-year lows; global positioning near 10-year lows; CTA positioning in NDX futures near the bottom of its 10-year range. CFTC non-dealer positioning still near highs.\nPut on or suffering: SUFFERING / unwinding (liquidation of the crowded tech/AI long)\n\n(Frank Chaparro), 2026-11-23 06:38 SGT\nGoldman’s Cullen Morgan says the tech selloff looks “closer to the end than the beginning.”\n\nHedge funds have sold tech at the fastest pace on record over the past six weeks, global equity positioning is near 10-year lows, and systematic traders have aggressively reduced exposure.\n\n“Coming into this week, net exposure on our prime book was at multi-year lows. Globally, positioning is near 10-year lows. We saw HFs sell tech at the fast pace on record over the last 6-weeks. We have seen aggressive selling from the systematic community. CTA positioning in NDX futures is near the bottom end of the 10-year range. We have this cohort as small sellers of NDX over the next week and month. This seems closer to the end than the beginning to us. On the flip side, CFTC data still has non-dealer positioning near the highs.”", "eng": "", "url": "https://x.com/fintechfrank/status/2124633560908742808", "headline": "@fintechfrank · Who: Hedge funds and systematic funds (Goldman Sachs prime book / Cullen Morgan)", "tags": ["@fintechfrank", "x-brief", "large-trades"], "posted": "2026-11-23T06:38:09+08:00", "chars": 1383, "sec": "Record hedge-fund tech selling; Goldman says 'closer to the end than the beginning'", "src": "large"}, {"id": "64173561", "name": "", "handle": "nextbaggerx", "why": "", "text": "(Next Bagger), 2026-11-20 20:42 SGT\nLook at hedge fund positioning first.\n\nPer Goldman Sachs Prime Book data, net tech selling over the past 6 weeks is the heaviest in a decade, hitting a -4.4 z-score.\n\nTech long/short ratios fell from 2.9 to 1.79 (near 10-yr lows) as net leverage hit a 5-yr low.", "eng": "", "url": "https://x.com/nextbaggerx/status/2123758788205523028", "headline": "@nextbaggerx · (Next Bagger), 2026-11-20 20:42 SGT", "tags": ["@nextbaggerx", "x-brief", "large-trades"], "posted": "2026-11-20T20:42:07+08:00", "chars": 297, "sec": "Record hedge-fund tech selling; Goldman says 'closer to the end than the beginning'", "src": "large"}, {"id": "823ad37b", "name": "", "handle": "JJoonWick", "why": "", "text": "Who: CTAs / trend-following funds (Goldman Sachs estimates, via Bloomberg)\nWhat: Trend followers sold an estimated $57bn of equities over the past month, flipping to a ~$19bn net short in US stocks. Goldman's projected CTA selling over the coming week: $80.6bn if the market falls, $65.8bn flat, $28.6bn even if it rises. Goldman Panic Index at 9/10.\nPut on or suffering: PUT ON (net short in US equity futures) — systematic selling pressure\n\n(J2Wick | Seoul), 2026-11-22 08:12 SGT\nGOLDMAN SACHS: UP TO $80.6 BILLION IN ADDITIONAL CTA SELLING\n\nGoldman's Panic Index has reached 9/10.\n\nTrend-following funds have already sold an estimated $57 billion in equities over the past month, flipping to a $19 billion net short position in US stocks.\n\nProjected CTA selling over the coming week:\n\n• Market falls: $80.6B\n• Market stays flat: $65.8B\n• Market rises: $28.6B\n\nEven a rebound may face substantial systematic selling.\n\nMeanwhile, Korea faces Monday's opening after:\n\n• Nasdaq 100: −5.6%\n• SOX: −11.0%\n• KOSPI: −7.95% last week\n• Foreign outflows: $26B this quarter\n\nMy focus on Monday will be whether buying demand can absorb the selling pressure after the opening.\n\nAn oversold market is not necessarily a bottom.\n\nSource: Bloomberg, Nov. 20; Edaily, Nov. 22.\nhttps://t.co/m1Zg6tHZac", "eng": "", "url": "https://x.com/JJoonWick/status/2124294857598656751", "headline": "@JJoonWick · Who: CTAs / trend-following funds (Goldman Sachs estimates, via Bloomberg)", "tags": ["@JJoonWick", "x-brief", "large-trades"], "posted": "2026-11-22T08:12:16+08:00", "chars": 1285, "sec": "CTAs flip to net short US equities; up to $80.6bn more selling projected", "src": "large"}, {"id": "983dc145", "name": "", "handle": "Alea_", "why": "", "text": "Who: Global hedge funds (JPMorgan prime/research note, 20 Nov)\nWhat: 20-day global HF net selling ~2 standard deviations below average (North America >2σ). The 8-week drop in net leverage is ~2σ, among the most extreme since 2018; net leverage at the 26th percentile of its 5-yr range. Zerohedge headline: HFs had their worst week since Liberation Day 'and the real money hasn't sold yet'.\nPut on or suffering: SUFFERING (losses and forced net selling)\n\n(jck✨), 2026-11-22 17:06 SGT\n🛑 Hedge fund net selling and leverage declines approach extreme levels\n\n🛑 Over the past 20 trading days, global hedge fund net selling was about 2 standard deviations below average, with North America exceeding 2 standard deviations. Historically, markets have tended to rebound over the following month when heavy hedge fund net selling coincides with declines, but no such rebound has emerged this time. The pullback in net leverage from its 12-month high is approaching one of the most extreme episodes since 2018, with the eight-week change at about 2 standard deviations below average. Across strategies, net leverage is at the 26th percentile of its five-year range, according to a Nov. 20 JP Morgan research note.", "eng": "", "url": "https://x.com/Alea_/status/2124429202715779081", "headline": "@Alea_ · Who: Global hedge funds (JPMorgan prime/research note, 20 Nov)", "tags": ["@Alea_", "x-brief", "large-trades"], "posted": "2026-11-22T17:06:06+08:00", "chars": 1203, "sec": "JPMorgan: hedge funds' worst week since Liberation Day; net selling ~2σ", "src": "large"}, {"id": "3b32cd4e", "name": "", "handle": "zerohedge", "why": "", "text": "(zerohedge), 2026-11-22 05:30 SGT\n\"Abandon All Hope, Ye Who Trade Tech\": JPMorgan Finds Hedge Funds Just Had Their Worst Week Since Liberation Day... And The Real Money Hasn't Sold Yet https://t.co/dkRTE1jCEj", "eng": "", "url": "https://x.com/zerohedge/status/2124254135037927819", "headline": "@zerohedge · (zerohedge), 2026-11-22 05:30 SGT", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-22T05:30:27+08:00", "chars": 208, "sec": "JPMorgan: hedge funds' worst week since Liberation Day; net selling ~2σ", "src": "large"}, {"id": "497d97d4", "name": "", "handle": "zerohedge", "why": "", "text": "Who: Hedge funds' most crowded longs (Goldman HF VIP basket); Morgan Stanley prime brokerage\nWhat: Zerohedge headlines: 'Worst In 20 Years: Hedge Fund VIPs Crushed As Goldman Warns The Cyclicals They Fled To Are Next' and 'Morgan Stanley's Savone … As Hedge Fund Nets Close In On COVID Lows'. Goldman's Coppersmith: 'Panic Without A Washout' — hedge funds have puked, everyone else is still long. (Headlines only on X; details are behind the linked articles.)\nPut on or suffering: SUFFERING (crowded-long blowup)\n\n(zerohedge), 2026-11-23 00:30 SGT\nWorst In 20 Years: Hedge Fund VIPs Crushed As Goldman Warns The Cyclicals They Fled To Are Next https://t.co/NkWTVi4IjZ", "eng": "", "url": "https://x.com/zerohedge/status/2124541025284706647", "headline": "@zerohedge · Who: Hedge funds' most crowded longs (Goldman HF VIP basket); Morgan Stanley…", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-23T00:30:27+08:00", "chars": 667, "sec": "Hedge fund 'VIP' crowded longs: worst in 20 years; Morgan Stanley says HF nets near COVID lows", "src": "large"}, {"id": "329ca8da", "name": "", "handle": "zerohedge", "why": "", "text": "(zerohedge), 2026-11-23 05:05 SGT\n\"Pain\": Morgan Stanley's Savone Channels Clubber Lang As Hedge Fund Nets Close In On COVID Lows https://t.co/2hG1mSVpOF", "eng": "", "url": "https://x.com/zerohedge/status/2124610233150374267", "headline": "@zerohedge · (zerohedge), 2026-11-23 05:05 SGT", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-23T05:05:27+08:00", "chars": 153, "sec": "Hedge fund 'VIP' crowded longs: worst in 20 years; Morgan Stanley says HF nets near COVID lows", "src": "large"}, {"id": "38fca6b3", "name": "", "handle": "zerohedge", "why": "", "text": "(zerohedge), 2026-11-23 02:35 SGT\n\"Panic Without A Washout\": Goldman's Coppersmith Says Hedge Funds Have Puked... Everyone Else Is Still Long https://t.co/IzZzZ0IArk", "eng": "", "url": "https://x.com/zerohedge/status/2124572484317921597", "headline": "@zerohedge · (zerohedge), 2026-11-23 02:35 SGT", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-23T02:35:27+08:00", "chars": 165, "sec": "Hedge fund 'VIP' crowded longs: worst in 20 years; Morgan Stanley says HF nets near COVID lows", "src": "large"}, {"id": "7edc5e8a", "name": "", "handle": "zerohedge", "why": "", "text": "Who: Goldman Sachs Delta-One desk (market-wide equity flows)\nWhat: Quote: \"Sharply lower from the US open yesterday. A lot of confusion about what exactly went wrong. For many, myself included, the catalysts were meant to be supportive… instead we got a pretty violent liquidation.\"\nPut on or suffering: SUFFERING (market-wide liquidation)\n\n(zerohedge), 2026-11-20 20:24 SGT\nGoldman's Delta-One head not having a good day:\n\n\"Sharply lower from the US open yesterday. A lot of confusion about what exactly went wrong. For many, myself included, the catalysts were meant to be supportive… instead we got a pretty violent liquidation.\"", "eng": "", "url": "https://x.com/zerohedge/status/2123754257245479198", "headline": "@zerohedge · Who: Goldman Sachs Delta-One desk (market-wide equity flows)", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-11-20T20:24:07+08:00", "chars": 632, "sec": "Goldman Delta-One head: 'a pretty violent liquidation'", "src": "large"}, {"id": "69382a4b", "name": "", "handle": "wavg_de", "why": "", "text": "Who: Leveraged funds (CFTC data, positions as of 17 Nov) — typically basis-trade hedge funds\nWhat: Net short 2,482,443 10-yr Treasury futures; only two weeks since 2006 were more net short (26 Aug and 2 Sep 2025). Gross shorts 3,022,168, second only to 25 Nov 2025. Asset managers hold 4.02M longs.\nPut on or suffering: PUT ON (large short in 10y futures, consistent with cash-futures basis trade)\n\n(WAVG · Beta), 2026-11-21 22:00 SGT\n10-year Treasury futures: leveraged funds are net short 2,482,443 contracts.\n\nIn CFTC data since 2006, only two weeks were more net short: Aug 26 and Sep 2, 2025.\n\nTheir shorts, 3,022,168, are second only to Nov 25, 2025. Asset managers hold 4.02M longs.", "eng": "", "url": "https://x.com/wavg_de/status/2124140783989334345", "headline": "@wavg_de · Who: Leveraged funds (CFTC data, positions as of 17 Nov) — typically…", "tags": ["@wavg_de", "x-brief", "large-trades"], "posted": "2026-11-21T22:00:02+08:00", "chars": 689, "sec": "Leveraged funds near-record net short 10-year Treasury futures", "src": "large"}, {"id": "2500732d", "name": "", "handle": "KobeissiLetter", "why": "", "text": "Who: Hedge funds, CTAs and other speculators (Comex copper)\nWhat: Sold $1.3bn of Comex copper futures in the week to 10 Nov; $10.8bn cumulative since 22 Sep. Speculative long down to ~$5.2bn, lowest since Oct 2025. Copper −18.2% from its September peak.\nPut on or suffering: UNWINDING longs\n\n(The Kobeissi Letter), 2026-11-21 09:47 SGT\nInvestor positioning in copper is cratering:\n\nSpeculative investors sold -$1.3 billion in Comex copper futures in the week ending November 10th, marking the 7th consecutive weekly sale.\n\nThis group includes hedge funds, commodity trading advisers (CTAs), and other institutional investors.\n\nSince September 22nd, they have sold a cumulative -$10.8 billion.\n\nThis brings long speculative investor positioning down to ~$5.2 billion, its lowest since October 2025.\n\nMeanwhile, copper futures fell -5.3% on Wednesday, marking their largest daily decline since July 2026.\n\nCopper prices are now down -18.2% from their September peak, to $5.67 per pound, their lowest level since April.\n\nThe copper market is seeing a massive shift in sentiment.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2123956481540202786", "headline": "@KobeissiLetter · Who: Hedge funds, CTAs and other speculators (Comex copper)", "tags": ["@KobeissiLetter", "x-brief", "large-trades"], "posted": "2026-11-21T09:47:41+08:00", "chars": 1075, "sec": "Speculators dump copper futures for a 7th straight week", "src": "large"}, {"id": "45d6e84a", "name": "", "handle": "KobeissiLetter", "why": "", "text": "Who: Holders of 3x leveraged tech ETFs (SOXL, TQQQ)\nWhat: SOXL −90% from its June peak (2nd-largest drawdown since 2010 inception). TQQQ −53% from its June peak, −51% since 5 Oct alone.\nPut on or suffering: SUFFERING\n\n(The Kobeissi Letter), 2026-11-23 01:51 SGT\nUS technology ETFs are seeing massive wave of deleveraging:\n\nThe 3x leveraged long Semiconductor ETF, $SOXL, is down -90% from its June peak, to its lowest since September 2025.\n\nThis marks its 2nd-largest drawdown since the fund's inception in March 2010, surpassed only by the -91% decline during the 2022 bear market.\n\nBy comparison, the fund dropped -89% during the July 2024-April 2025 period.\n\nMeanwhile, the 3x leveraged long Nasdaq 100 ETF, $TQQQ, is down -53% from its June peak to its lowest since early April.\n\nSince October 5th alone, the fund has dropped -51%.\n\nFor perspective, $TQQQ fell -61% during the February-April 2025 drawdown.\n\nLeveraged tech funds have experienced a historic liquidation wave.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2124561296787943647", "headline": "@KobeissiLetter · Who: Holders of 3x leveraged tech ETFs (SOXL, TQQQ)", "tags": ["@KobeissiLetter", "x-brief", "large-trades"], "posted": "2026-11-23T01:51:00+08:00", "chars": 978, "sec": "Leveraged tech ETF liquidation wave", "src": "large"}, {"id": "2170cda5", "name": "", "handle": "joemccann", "why": "", "text": "Who: Asia-focused fundamental long/short hedge funds (Goldman Sachs); foreign investors\nWhat: Net leverage 10%, lowest in a decade; down 1.6% month-to-date in November (+12.4% YTD). November EM Asia net foreign selling $7.4bn: Taiwan −$6.0bn, Korea −$3.9bn, India +$2.7bn.\nPut on or suffering: DE-RISKED / suffering foreign outflows\n\n(Joe McCann), 2026-11-23 02:10 SGT\nAsia hedge fund net leverage hits 10%, lowest in a decade\n\n@GoldmanSachs puts Asia-focused fundamental long/short managers at 10% net leverage, the lowest in a decade. They're down 1.6% month to date in November, with returns still at 12.4% YTD. Positioning is constrained as foreign selling continues.     var ed=fmtEdition(x.date).replace(',','');
    if(k==='morning') return 'Morning brief \u00B7 '+ed+' (SGT)';
    var d=parse(x.as_of); return 'Large trade watch \u00B7 '+(d? (x.time_known? fmtSGT(d).replace(',','') : ed+' (SGT)') : ed);
  }
  function xGroup(){
    var m=XB.morning, l=XB.large, mf=xbFresh('morning'), lf=xbFresh('large');
    if(!mf && !lf && !m) return null;                 // nothing to show: no files (or only a stale large-trades file)
    var n=(mf?m.items.length:0)+(lf?l.items.length:0), secLabel='Finance \u203A Markets X News';
    var d=el('details','group xg'); d.id='g-fin-xbrief';
    var saved=LS.get('newsdash.open.fin-xbrief'); d.open = saved===null ? n>0 : saved==='1';
    d.addEventListener('toggle',function(){LS.set('newsdash.open.fin-xbrief', d.open?'1':'0')});
    var s=el('summary'); s.appendChild(el('span','gi','\uD83D\uDCE1')); s.appendChild(el('h2','gt','Markets X News'));
    s.appendChild(el('span','gc',n+(n===1?' post':' posts'))); s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    function sub(k,x){var t=el('div','xsub'); t.appendChild(document.createTextNode(xLabel(k,x).split(' \u00B7 ')[0]+' \u00B7 ')); t.appendChild(el('span',null,xLabel(k,x).split(' \u00B7 ').slice(1).join(' \u00B7 '))); return t}
    function gridItems(items, label){var w=el('div','items'); items.forEach(function(it){w.appendChild(renderXPost(it,label||secLabel))}); return w}
    function morningBody(){
      /* Preserve email order: Finance / markets, then Other trends (from item.sec); fall back to a flat grid. */
      var items=m.items, order=[], by={};
      items.forEach(function(it){var k=it.sec||''; if(!by[k]){by[k]=[]; order.push(k)} by[k].push(it)});
      var hasNamed=order.some(function(k){return !!k});
      if(!hasNamed || order.length<=1){ d.appendChild(gridItems(items)); return }
      order.forEach(function(k){
        var lab=k||'Posts';
        var t=el('div','xsub'); t.appendChild(el('span',null,lab)); d.appendChild(t);
        d.appendChild(gridItems(by[k], secLabel+' \u203A '+lab));
      });
    }
    if(m){
      if(mf){ d.appendChild(sub('morning',m)); morningBody() }
      else{
        var ageH=Math.round((Date.now()-Date.parse(m.as_of))/36e5);
        d.appendChild(el('div','xnote', m.items.length
          ? 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief is about '+ageH+' h old, older than '+XB.fresh_h.morning+' h, so its posts are hidden until the next run (daily 6:45 AM SGT).'
          : 'As of '+fmtEdition(m.date).replace(',','')+' (SGT): the latest morning brief had no readable posts. It will refresh with the next run (daily 6:45 AM SGT).'));
      }
    }
    if(lf){ d.appendChild(sub('large',l)); d.appendChild(gridItems(l.items, secLabel+' \u203A Large trade watch')) }
    return d;
  }

  function renderGroup(key, title, icon, items, openDefault, secLabel, tours){
    tours=tours||[];
    var d = el('details','group'); d.id='g-'+key;
    var saved = LS.get('newsdash.open.'+key);
    d.open = saved===null ? openDefault : saved==='1';
    d.addEventListener('toggle', function(){LS.set('newsdash.open.'+key, d.open?'1':'0')});
    var s = el('summary'); s.appendChild(el('span','gi',icon)); s.appendChild(el('h2','gt',title));
    s.appendChild(el('span','gc',items.length+(items.length===1?' item':' items')+(tours.length?' \u00B7 '+tours.length+(tours.length===1?' overview':' overviews'):'')));
    s.appendChild(el('span','chev','\u25B6')); d.appendChild(s);
    var w = el('div','items');
    if(!items.length) w.appendChild(el('div','empty','Nothing verified for this section yet.'));
    items.forEach(function(it){w.appendChild(renderItem(it, secLabel))});
    d.appendChild(w);
    tours.forEach(function(t){d.appendChild(renderTour(t, secLabel, title))});
    return d;
  }

  function askBar(){
    var w=el('div','askbar');
    var a=el('a','btn ask','\u2726 Ask Grok about today\u2019s news'); a.href=grokUrl(overallPrompt()); a.target='_blank'; a.rel='noopener noreferrer'; w.appendChild(a);
    var c=el('button','btn ghost','Copy question'); c.type='button';
    c.addEventListener('click',function(){copyText(overallPrompt()).then(function(ok){toast(ok?'Question copied \u2014 paste it into Grok':'Copy failed \u2014 long-press to copy')})});
    w.appendChild(c);
    w.appendChild(el('span','hint','Opens grok.com with a prefilled question. Each story also has its own Ask Grok button.'));
    return w;
  }

  /* ---------- feedback panel ---------- */
  var REPO='vikasgelara-ship-it/news-dashboard';
  var lastSent=[], fbNote='';
  function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});
  }
  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      out.push('',g[1]);
      xs.forEach(function(x){
        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');
  }
  function issueUrl(){
    var L=votedList(), up=L.filter(function(x){return x.v===1}).length, dn=L.length-up, title='Feedback '+dayF.format(new Date())+': +'+up+' / -'+dn;
    for(var lv=0;lv<3;lv++){
      var u='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&labels=feedback&body='+encodeURIComponent(fbText(lv));
      if(u.length<7000||lv===2) return {url:u, trimmed:lv>0, long:u.length>=7000};
    }
  }
  function updateFab(){var n=Object.keys(votes).length, b=document.getElementById('fab-n'); b.textContent=n; b.hidden=!n}
  function repaintAll(){
    var arts=document.querySelectorAll('article.item');
    for(var i=0;i<arts.length;i++){var a=arts[i]; if(a._btns) paintVotes(a.getAttribute('data-id'),a._btns)}
  }
  function openFb(){
    var sc=document.getElementById('scrim'), sh=document.getElementById('sheet'); sh.textContent='';
    sh.appendChild(el('h2',null,'Send feedback')).id='fb-t';
    var L=votedList();
    sh.appendChild(el('p','sub',L.length?'Your \uD83D\uDC4D/\uD83D\uDC4E marks. They shape what tomorrow\u2019s refresh picks.':'No marks yet. Tap \uD83D\uDC4D or \uD83D\uDC4E on any story, then come back here.'));
    [[1,'\uD83D\uDC4D More like this'],[-1,'\uD83D\uDC4E Less like this']].forEach(function(g){
      var xs=L.filter(function(x){return x.v===g[0]}); if(!xs.length) return;
      sh.appendChild(el('h5',null,g[1]+' ('+xs.length+')'));
      xs.forEach(function(x){
        var r=el('div','fbrow'); r.appendChild(el('span','v',g[0]>0?'\uD83D\uDC4D':'\uD83D\uDC4E'));
        var tx=el('div','tx'); tx.appendChild(el('div','t1',x.h)); tx.appendChild(el('div','t2',x.s+(x.t.length?' \u00B7 '+x.t.join(', '):''))); r.appendChild(tx);
        var rm=el('button','x','\u00D7'); rm.type='button'; rm.title='Remove'; rm.setAttribute('aria-label','Remove this mark');
        rm.addEventListener('click',function(){delete votes[x.id]; saveVotes(); repaintAll(); openFb()});
        r.appendChild(rm); sh.appendChild(r);
      });
    });
    var ta=el('textarea'); ta.placeholder='Optional note (e.g. "more cricket, fewer Brazil items")'; ta.value=fbNote; ta.setAttribute('aria-label','Optional note');
    ta.addEventListener('input',function(){fbNote=ta.value; refresh()});
    var after=el('div','after'); after.hidden=true;
    function ask(){
      after.hidden=false; after.textContent='';
      after.appendChild(el('div',null,'Sent it? Clear these '+lastSent.length+' votes from this device?'));
      var rw=el('div','row'); var y=el('button','btn','Clear sent votes'); y.type='button'; var n=el('button','btn ghost','Keep them'); n.type='button';
      y.addEventListener('click',function(){lastSent.forEach(function(id){delete votes[id]}); fbNote=''; saveVotes(); repaintAll(); toast('Cleared'); openFb()});
      n.addEventListener('click',function(){after.hidden=true});
      rw.appendChild(y); rw.appendChild(n); after.appendChild(rw);
    }
    var row=el('div','row'), send=el('a','btn ask','\u2726 Send to News'.replace('\u2726 ','')); send.target='_blank'; send.rel='noopener noreferrer';
    var cp=el('button','btn','Copy'); cp.type='button'; var cl=el('button','btn ghost','Close'); cl.type='button';
    var warn=el('p','warn'); warn.hidden=true;
    function refresh(){var u=issueUrl(); send.href=u.url; warn.hidden=!u.trimmed; warn.textContent=u.long?'Very long list: the GitHub link was trimmed. Use Copy for the full text.':'Long list: tags were shortened in the GitHub link. Use Copy for full detail.'}
    send.addEventListener('click',function(){lastSent=votedList().map(function(x){return x.id}); setTimeout(ask,400)});
    cp.addEventListener('click',function(){copyText(fbText(0)).then(function(ok){toast(ok?'Feedback copied \u2014 paste it into chat':'Copy failed'); if(ok){lastSent=votedList().map(function(x){return x.id}); ask()}})});
    cl.addEventListener('click',closeFb);
    if(!L.length){send.setAttribute('aria-disabled','true'); send.style.opacity='.5'; send.style.pointerEvents='none'; cp.disabled=true; cp.style.opacity='.5'}
    row.appendChild(send); row.appendChild(cp); row.appendChild(cl);
    sh.appendChild(el('h5',null,'Note')); sh.appendChild(ta); sh.appendChild(row); sh.appendChild(warn);
    sh.appendChild(el('p','sub','\u201CSend to News\u201D opens a prefilled GitHub issue on your phone \u2014 just tap Submit. \u201CCopy\u201D puts the same text on your clipboard to paste into chat.')).style.marginTop='10px';
    sh.appendChild(after); refresh();
    sc.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
  }
  function closeFb(){document.getElementById('scrim').hidden=true; document.body.style.overflow=''}
  document.getElementById('fab').addEventListener('click',openFb);
  document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this) closeFb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeFb()});
  updateFab();

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
