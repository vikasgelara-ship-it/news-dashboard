<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}

     "h": "What's happening",
     "b": [
      "The New York Times reports that US intelligence agencies have identified Alice Huang, also known as Huang Le, as an alleged Chinese intelligence asset. She was formerly a senior executive at Megaspeed, a Singapore-based data-centre company, and built close ties with Nvidia chief executive Jensen Huang.",

     "b": [

      "Megaspeed had bought about $2bn of Nvidia chips and runs data centres in Malaysia and Indonesia. US officials have looked at whether chips were diverted to China. The Justice Department took over a Commerce Department investigation this year."
     ]
    },
    {
     "h": "The responses",
     "b": [
      "Nvidia spokesman John Rizzo said the interactions were 'not unusual or unexpected'. He said Megaspeed received 'ordinary business information' and that the smuggling claims had been 'investigated and debunked last year'.",
      "China's foreign ministry spokesman Guo Jiakun called the report 'groundless speculation' and an 'attempt to smear China'. Liu Chang of the Chinese embassy also denied it.",

me time, personal consumption expenditures rose +6.3% YoY, the 2nd-highest YoY growth since December 2024. In other words, consumer spending continues to outpace income growth, putting further pressure on household savings and increasing household reliance on borrowing. Elevated inflation and record prices are putting further pressure on consumer savings.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2116630555135517067", "headline": "2) The Kobeissi Letter (@KobeissiLetter) · — 1 Nov, 4:37 AM SGT", "tags": ["@KobeissiLetter", "x-brief"], "posted": "2026-11-01T04:37:04+08:00", "chars": 968, "sec": "Finance / markets", "src": "morning"}, {"id": "5093b7b0", "name": "3) The Kobeissi Letter", "handle": "KobeissiLetter", "why": "", "text": "— 1 Nov, 5:44 AM SGT\nCredit: a $1.9 trillion junk-debt maturity wall while high-yield refinancing costs are up about 150bp in a year. About 323 likes, 40 reposts, 69K views. Chart attached (not shown here). A related Kobeissi post on record November investment-grade issuance and AI-driven borrowing is at https://x.com/KobeissiLetter/status/2116614948071539134.\n\nUS companies are facing a massive debt maturity wall: ~$1.9 trillion in US speculative-grade corporate bonds and loans mature over the next 5 years, including $438 billion due by the end of 2028. By comparison, in 2020, 2021, and 2022, this figure ranged from $1.4 trillion to $1.5 trillion. The amount of junk-rated debt maturing within 2 years alone has surged +31% YoY. At the same time, $1.6 trillion of investment-grade corporate debt is coming due by 2031. Meanwhile, refinancing is becoming increasingly expensive, with the effective yield on publicly issued US junk debt rising +150 basis points over the last 12 months, to 8.0%. The corporate refinancing burden is becoming a major issue.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2116647408465563761", "headline": "3) The Kobeissi Letter (@KobeissiLetter) · — 1 Nov, 5:44 AM SGT", "tags": ["@KobeissiL SGT", "tags": ["@jerryN1932", "x-brief", "other-trends"], "posted": "2026-11-01T05:53:13+08:00", "chars": 1732, "sec": "Other trends", "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-11-01", "as_of": "2026-11-01T06:53:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-11-01T06:53:18+08:00"}, "large": {"kind": "large", "items": [{"id": "406c8b6f", "name": "", "handle": "MgnStnlyDerivs", "why": "", "text": "Trade/position: Biggest unwind of equity exposure since at least 2017: active de-grossing (cutting both longs and shorts) has passed 8% of total gross exposure since June, taking US long/short gross leverage down to the 10th percentile of the past year. Andreas Steno called it the biggest deleveraging event in more than 10 years.\n\nPut on or suffering: Suffering from it: funds are being forced to shrink books after AI/tech losses.\n\nThe unwind in Hedge Fund equity exposures this year has been the biggest since at least 2017. Active de-grossing (reduction in long + short positions) by global hedge funds has now hit over 8% of total gross exposure since June, according to the Morgan Stanley Prime Brokerage Content team. This has taken gross leverage for US long/short funds down to the 10th percentile versus the last year.", "eng": "", "url": "https://x.com/MgnStnlyDerivs/status/2116246769960911083", "headline": "@MgnStnlyDerivs · Trade/position: Biggest unwind of equity exposure since at least 2017: active…", "tags": ["@MgnStnlyDerivs", "x-brief", "large-trades"], "posted": "2026-10-31T03:12:02+08:00", "chars": 829, "sec": "Global hedge funds (Morgan Stanley Prime Brokerage data)", "src": "large"}, {"id": "d7bfeb37", "name": "", "handle": "realMeetKevin", "why": "", "text": "Trade/position: Heavy shorting: short sales outpaced long purchases about 5 to 1 in October, short leverage sits at the 99th percentile of five years, and fundamental long/short net leverage is near a three-year low. Posts also cite CTAs cutting equity length from about $125B to $43.5B in a month and non-dealers dumping about $70B of S&P futures. Goldman flagged short-squeeze risk if markets bounce.\n\nPut on or suffering: Put on (crowded short), with squeeze risk. A post also mentions unconfirmed rumors that four funds were liquidated on Friday; that is a rumor only.\n\nBREAKING: Hedge funds are going short $5 for every $1 long! ➡️ Rumors 4 funds got liquidated TODAY ✅ Short leverage: 99th percentile of the last 5 years. REALLY SHORT! ✅ CTAs cut equity length by two thirds in a month. $125b long to $43.5b. 😇 That's money that flows back in SUPER FAST in the future. ✅ Non-dealers dumped $70b of S&P futures. Largest unwind in 15 years! 😇 going back to 2011.... ✅ Wells Fargo: ~$1b of mostly Nasdaq 100 selling through Thursday. ➡️ Rates vol gets part of the blame. 😇 Broad-based shorting by hedge funds and selling, in part due to Anthropic concerns. ➡️ IMO everyone who could sell already did. That's the setup, not the end. I'm not chasing the short. $QQQ", "eng": "", "url": "https://x.com/realMeetKevin/status/2116265161380282850", "headline": "@realMeetKevin · Trade/position: Heavy shorting: short sales outpaced long purchases about 5 to…", "tags": ["@realMeetKevin", "x-brief", "large-trades"], "posted": "2026-10-31T04:25:07+08:00", "chars": 1266, "sec": "Hedge funds in Goldman Sachs' prime book", "src": "large"}, {"id": "62ef798d", "name": "", "handle": "InvestiBrew", "why": "", "text": "(excerpt) Now look at Goldman's prime book: Short leverage: 99th percentile Gross leverage: 94th percentile AI long/short ratio: 7th percentile That does not look like investors adding conviction It looks like institutions are hedging aggressively while reducing exposure", "eng": "", "url": "https://x.com/InvestiBrew/status/2115913402220703783", "headline": "@InvestiBrew · (excerpt) Now look at Goldman's prime book: Short leverage: 99th percentile…", "tags": ["@InvestiBrew", "x-brief", "large-trades"], "posted": "2026-10-30T05:07:21+08:00", "chars": 271, "sec": "Hedge funds in Goldman Sachs' prime book", "src": "large"}, {"id": "5970db2a", "name": "", "handle": "BigBreakingWire", "why": "", "text": "Hedge Funds Short $5 for Every $1 Bought as Anthropic IPO Raises AI Stock Squeeze Risks Goldman Sachs data show hedge fund clients sold short approximately $5 worth of stocks for every $1 purcha...", "eng": "", "url": "https://x.com/BigBreakingWire/status/2115844141909410204", "headline": "@BigBreakingWire · Hedge Funds Short $5 for Every $1 Bought as Anthropic IPO Raises AI Stock…", "tags": ["@BigBreakingWire", "x-brief", "large-trades"], "posted": "2026-10-30T00:32:08+08:00", "chars": 197, "sec": "Hedge funds in Goldman Sachs' prime book", "src": "large"}, {"id": "afc2556f", "name": "", "handle": "GlobalMktObserv", "why": "", "text": "Trade/position: Hedge funds sold more tech last week than at any point since September 2024; IT was the most-sold US sector over the 4 weeks to Oct 23; global equities net sold 3 weeks running, single stocks 6 weeks, with long sales outpacing short covers 3.4 to 1.\n\nPut on or suffering: Unwinding existing longs, a sign of losses and falling risk appetite.\n\nHedge funds are dumping US TECH stocks at a rapid pace: Hedge funds sold more tech stocks last week than at any point since September 2024, bringing TMT net trading flows down to -2.3% of US gross market value since the start of 2026. Over the 4 weeks ending October 23rd, Information Technology was the most sold US sector. Overall, hedge funds sold global equities for 3 consecutive weeks and single stocks for 6 consecutive weeks, with long sales outpacing short covers by 3.4 to 1. This signals aggressive reductions in existing positions rather than a surge in new short bets. The selloff reflects deteriorating risk appetite as AI concerns dominate market moves. Sentiment toward US tech is souring.", "eng": "", "url": "https://x.com/GlobalMktObserv/status/2115799191846793448", "headline": "@GlobalMktObserv · Trade/position: Hedge funds sold more tech last week than at any point since…", "tags": ["@GlobalMktObserv", "x-brief", "large-trades"], "posted": "2026-10-29T21:33:31+08:00", "chars": 1064, "sec": "Hedge funds selling US tech (Goldman prime data)", "src": "large"}, {"id": "66e37887", "name": "", "handle": "KobeissiLetter", "why": "", "text": "Trade/position: Record net long of about +$55B in Nasdaq futures as of Oct 20, up about $60B since August and $19B in October alone, going into Big Tech earnings. Nasdaq then fell roughly 3.4% on Friday.\n\nPut on or suffering: Suffering from it: a record crowded long hit by the AI-capex selloff.\n\nInvestors grew extremely bullish on tech heading into Big Tech earnings: Long speculative positioning in Nasdaq futures surged to +$55 billion as of October 20th, its highest on record. This captures hedge funds, Commodity Trading Advisors (CTAs), and other institutional investors such as leveraged funds. Since August, net long positioning in Nasdaq futures soared +$60 billion. In October alone, this figure rose +$19 billion. By comparison, in May 2025 and August 2026, investors held net short positions of -$5 billion. Investor appetite for tech is through the roof.", "eng": "", "url": "https://x.com/KobeissiLetter/status/2115895602248864055", "headline": "@KobeissiLetter · Trade/position: Record net long of about +$55B in Nasdaq futures as of Oct 20,…", "tags": ["@KobeissiLetter", "x-brief", "large-trades"], "posted": "2026-10-30T03:56:37+08:00", "chars": 869, "sec": "Speculators in Nasdaq futures (hedge funds, CTAs, leveraged funds)", "src": "large"}, {"id": "8a2c5989", "name": "", "handle": "TeCLaro", "why": "", "text": "Trade/position: Estimated mechanical selling into Friday's close: about $31B from vol-control funds on a -2% S&P close (about $67B on -3%), about $35B of leveraged-ETF rebalancing (3rd largest ever), and about $110B in aggregate including dealer short gamma. The S&P closed about -1.8%, near that -2% trigger.\n\nPut on or suffering: Forced/mechanical selling, not discretionary.\n\nCharlie McElligott from Nomura just put numbers on the \"mechanical\" selling that could hit into today's close: • Vol control funds: ~$31B to sell on a -2% $SPX close, ~$67B on -3%. • Leveraged ETFs: ~$35B end-of-day rebalance selling, the 3rd largest ever. 87% of that AUM is tech-concentrated. • Add dealer short gamma in the index and key single names, and a -2% SPX close projects ~$110B of selling in aggregate. What stands out: SPX skew is still calm and nobody is chasing puts. Dispersion is high (9 S&P sectors up on the week while the Mag7 drag), and funds have already cut exposure, so they don't need to hedge. In $QQQ the wings are getting bid. The backdrop is the same question again: is AI capex sustainable, and how does it get financed, after soft megacap earnings. So the risk today isn't discretionary funds rushing for the exit, they're already light. It's the systematic flow that doesn't have an opinion, it just executes. Year-end cleanup? $SPY", "eng": "", "url": "https://x.com/TeCLaro/status/2116248572656025668", "headline": "@TeCLaro · Trade/position: Estimated mechanical selling into Friday's close: about $31B…", "tags": ["@TeCLaro", "x-brief", "large-trades"], "posted": "2026-10-31T03:19:12+08:00", "chars": 1344, "sec": "Vol-control funds, leveraged ETFs and dealers (Nomura's Charlie McElligott, as relayed on X)", "src": "large"}, {"id": "82c83f8f", "name": "", "handle": "GardinerIsland", "why": "", "text": "Trade/position: Local macro funds lost as much as 24% on Monday after Lula's surprise runoff win, with some of the biggest winners after the first round among the hardest hit.\n\nPut on or suffering: Suffering from it.\n\nHedge Funds in Brazil Reel as Losses Reach 24% After Lula Shock Brazilian hedge-fund managers suffered steep losses after leftist incumbent Luiz Inácio Lula da Silva's victory in the presidential runoff, which defied virtually all polls as well as prediction markets. Local macro hedge funds lost as much as 24% on Monday, the worst day of the rout, with some of the biggest winners after the first-round vote being among the hardest hit, including funds run by Vista Capital, Legacy Capital, Ace Capital and Mar Asset Management. The turmoil this week hit a local fund industry already under pressure, with hedge funds alone seeing 9.3 billion reais in net outflows this year through September, and some investors expecting the industry to lose even more relevance if it doesn't reinvent itself. ....methinks you would see similar losses if somebody like Kamala or @AOC or ( shudder) @GavinNewsom won in 2028", "eng": "", "url": "https://x.com/GardinerIsland/status/2116180875087868231", "headline": "@GardinerIsland · Trade/position: Local macro funds lost as much as 24% on Monday after Lula's…", "tags": ["@GardinerIsland", "x-brief", "large-trades"], "posted": "2026-10-30T22:50:12+08:00", "chars": 1127, "sec": "Brazilian macro hedge funds (Vista Capital, Legacy Capital, Ace Capital, Mar Asset Management named)", "src": "large"}, {"id": "48fb2a78", "name": "", "handle": "infra_marginal", "why": "", "text": "Trade/position: Per Reuters (via X), funds are moving capital out of the Treasury cash-futures basis trade into swap-spread arbitrage as higher yields and financing costs stall the basis. CFTC data for Oct 27: leveraged funds' net short in 10-year Treasury futures and options deepened by 63,383 to 2.28M contracts, while leveraged-fund spread positions dropped 359,968.\n\nPut on or suffering: Repositioning (putting on swap-spread trades, trimming basis-related spreads).\n\nHedge funds are moving capital from the Treasury basis trade into swap spread arbitrage, per Reuters Higher yields, higher financing costs and more bank capacity for Treasuries have stalled the basis trade after years of rapid growth. Fed research put hedge fund cash-futures basis positions at about $830B in September 2025, 35% of their long Treasury exposure. Swap spread positions were $305B, or 13%, the second-largest Treasury-related trade. Dallas Fed research shows swap spread trades carry significantly more dollar risk per dollar of notional than basis trades. On-the-run vs off-the-run and TIPS vs nominal spreads are also drawing capital.", "eng": "", "url": "https://x.com/infra_marginal/status/2116156918456615122", "headline": "@infra_marginal · Trade/position: Per Reuters (via X), funds are moving capital out of the…", "tags": ["@infra_marginal", "x-brief", "large-trades"], "posted": "2026-10-30T21:15:00+08:00", "chars": 1124, "sec": "Hedge funds in US Treasuries (basis trade and swap spreads)", "src": "large"}, {"id": "7be8aec9", "name": "", "handle": "TradeGateHub", "why": "", "text": "CFTC data for Oct. 27: in 10-year Treasury futures and options, asset managers' net long rose 67,821 to 3.02M contracts, while leveraged funds' net short deepened 63,383 to 2.28M. Open interest fell 430,375 as leveraged-fund spread positions dropped 359,968.", "eng": "", "url": "https://x.com/TradeGateHub/status/2116290376369594497", "headline": "@TradeGateHub · CFTC data for Oct. 27: in 10-year Treasury futures and options, asset…", "tags": ["@TradeGateHub", "x-brief", "large-trades"], "posted": "2026-10-31T06:05:19+08:00", "chars": 258, "sec": "Hedge funds in US Treasuries (basis trade and swap spreads)", "src": "large"}, {"id": "8268b67a", "name": "", "handle": "zvawda", "why": "", "text": "Trade/position: Leveraged/speculative funds increased their S&P 500 CME net short by 24,072 contracts to 372,747; asset managers raised their net long by 23,050 to 917,513.\n\nPut on or suffering: Put on (larger index short by leveraged funds).\n\nCFTC Positions in the Week of October 27th 2026 -Equity fund speculators increase S&P 500 CME net short position by 24,072 contracts to 372,747 -Equity fund managers raise S&P 500 CME net long position by 23,050 contracts to 917,513", "eng": "", "url": "https://x.com/zvawda/status/2116255166806556771", "headline   function fbText(level){
    var L=votedList(), day=dayF.format(new Date());

    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){

      out.push('',g[1]);

        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');

    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each). Finance & Macro mirrors the daily Markets X News email (morning brief + large trade watch). X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
