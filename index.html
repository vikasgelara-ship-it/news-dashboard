<style>
:root{
  --bg:#0b0c0d; --bg2:#121416; --card:#15181a; --line:#24282b; --text:#ece6dc; --muted:#948e83;
  --teal:#2dd4bf; --teal-dim:#1c8f82; --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(var(--sab) + 28px);min-height:100vh}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---- sticky top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,12,13,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 0}
.bar-in{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand i{color:var(--teal);font-style:normal}
.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:22px}
.tabs .tab{flex:0 0 auto;scroll-snap-align:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--sans);
  padding:10px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.tab .n{font-size:11px;font-weight:600;color:var(--bg);background:var(--teal-dim);border-radius:9px;padding:0 6px;line-height:17px}
.tab[aria-selected="true"] .n{background:var(--teal)}

/* ---- content ---- */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.panel[hidden]{display:none}
.lede{font-family:var(--serif);color:var(--muted);font-style:italic;margin:2px 0 14px;font-size:15px}
details.group{border:1px solid var(--line);background:var(--bg2);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
details.group[open]>summary .chev{transform:rotate(90deg)}
.gt{font-family:var(--serif);font-size:19px;font-weight:700;margin:0}
.gc{font-size:12px;color:var(--muted)}
.gi{font-size:18px;width:26px;text-align:center}
.items{display:grid;gap:12px;padding:2px 12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.items.flat{padding:0}
article.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;display:flex;flex-direction:column}
.chip{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:999px;padding:1px 8px;margin-bottom:8px}
.hl{font-family:var(--serif);font-size:18px;line-height:1.28;font-weight:700;margin:0 0 7px;letter-spacing:-.005em}
.sum{margin:0 0 12px;color:#cfc9bf;font-size:14.5px;line-height:1.55}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .src{font-weight:600}
.foot .dot{opacity:.5}
time.rec{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted);cursor:help}
time.rec.old{opacity:.65}
article.item.tweet{border-left:3px solid var(--teal)}
article.item.tweet .hl{font:600 14px var(--sans);color:var(--text);margin-bottom:6px}
article.item.tweet .sum{font:400 13.5px/1.5 var(--sans);color:#b9b3a8;white-space:normal;margin-bottom:10px}
/* card additions */
.quote{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);white-space:pre-line}
.hl a{color:inherit}
.rt{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal-dim);text-decoration:none}
.btn.read{border-color:rgba(45,212,191,.45);color:var(--teal)}
.btn.read .car{font-size:10px;transition:transform .2s}
.btn.read[aria-expanded="true"] .car{transform:rotate(180deg)}
.btn.ask{background:var(--teal);border-color:var(--teal);color:#06201c}
.btn.ask:hover{background:#5eead4;border-color:#5eead4}
.btn.ghost{color:var(--muted);font-weight:500}
.votes{margin-left:auto;display:flex;gap:6px}
.btn.vote{min-width:42px;justify-content:center;padding:0 10px;font-size:16px;line-height:1}
.btn.vote[aria-pressed="true"].up{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.btn.vote[aria-pressed="true"].down{background:rgba(244,114,94,.16);border-color:#f4725e;color:#f4725e}
.brief{margin-top:12px;padding:12px 2px 2px;border-top:1px dashed var(--line)}
.brief[hidden]{display:none}
.brief h4{margin:14px 0 5px;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.brief h4:first-child{margin-top:0}
.brief ul{margin:0;padding-left:18px}
.brief li{margin:0 0 5px;font-size:14.5px;line-height:1.55;color:#d9d3c9}
.brief .bnote{margin:12px 0 0;padding:8px 10px;border-left:3px solid #c9a227;background:rgba(201,162,39,.08);color:#d8c98a;font-size:13px;border-radius:0 8px 8px 0}
.brief .bsrc{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* sports: synthesised briefings (Read is the main action; sources are a quiet footnote) */
.foot .src.plain{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.acts.sp .btn.read{flex:1 1 100%;justify-content:center;min-height:44px;font-size:14.5px;background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.acts.sp .btn.read:hover{background:rgba(45,212,191,.22)}
.srcs{margin:14px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.srcs summary{cursor:pointer;display:inline-block;list-style:none;opacity:.85}
.srcs summary::-webkit-details-marker{display:none}
.srcs summary::before{content:"\25B8 ";font-size:10px}
.srcs[open] summary::before{content:"\25BE "}
.srcs ul{margin:6px 0 0;padding-left:18px}
.srcs li{font-size:12px;margin:0 0 3px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(148,142,131,.45)}
.srcs a:hover{color:var(--text)}
.srcs .sn{margin:6px 0 0;font-size:12px}
.srcs.posts li{margin:0 0 8px}
.srcs.posts .pm{color:var(--muted);font-size:11.5px}
.srcs.posts .pt{margin-top:2px;font-size:12.5px;line-height:1.45;color:#b9b3a8;overflow-wrap:anywhere}
.brief .srcs.posts{margin-top:12px}

  var XB = {"dir": "/workspace/latest-x-brief", "synced_at": "2026-10-18T05:52:49+08:00", "fresh_h": {"morning": 36, "large": 48}, "morning": {"kind": "morning", "items": [{"id": "3285f8dc", "name": "", "handle": "joinautopilot", "why": "", "text": "1. @joinautopilot (Autopilot)\nBest single wrap of Friday's US session: Warsh gave no October signal (hike odds cut to 15% from 28%), AI-debt stress in neoclouds, Philly Semi index -3.83%, VIX +24% to 20.41, Brent +3.44% to $109.56 on a Hormuz ship sinking, 10Y held 5.10%, energy up and tech down, S&P -1.09% / Nasdaq -2.15%. (~16,205 views, 93 likes, 10 reposts at time of reading).\n\nEverything you missed in the stock market on October 16th:\n\n1. Stocks sold off after Fed Chair Kevin Warsh gave no rate signal in Bangkok, cutting October hike odds to 15% from 28%\n\n2. $CRWV cratered 11.91% and $NBIS sank 12.18% as AI debt fears spread through neoclouds\n\n3. $META fell 3.72%, $GOOGL slid 2.47%, $MSFT dropped 1.93%, and $TSLA lost 2.13% after its Roadster pop faded\n\n4. $MSTR plunged 9.56% after MSCI adopted rules that could boot it from its indexes in November\n\n5. $MU fell 5.63%, $SNDK sank 6.85%, and $STX dropped 7.50% despite Goldman Sachs calling China memory fears overblown\n\n6. $AMD slid 5.95%, $ARM fell 6.97%, and $INTC lost 5.79% as the Philly Semi Index dropped 3.83%\n\n7. $PLTR fell 7.22%, $SNOW sank 8.47%, and $SMCI cratered 9.86% as high-multiple AI software got dumped\n\n8. $VRNS climbed 2.92% after Thoma Bravo's Proofpoint agreed to buy it for $6.3 billion, or $49.75 per share\n\n9. The VIX jumped 24.00% to 20.41, the Nasdaq's worst week since June\n\n10. Brent crude surged 3.44% to $109.56 after Iran sank a container ship in the Strait of Hormuz\n\n11. The 10-year yield held at 5.10%, energy stocks gained 2.52% and tech fell 3.03%, with $JPM, $WFC, and $BRK.B all up more than 1%\n\n12. The S&P 500 fell 1.09%, the Dow slipped 0.34%, and the Nasdaq dropped 2.15%\n\nAnd that's just ONE trading day", "eng": "", "url": "https://x.com/joinautopilot/status/2111190218665582705", "headline": "@joinautopilot · 1. @joinautopilot (Autopilot)", "tags": ["@joinautopilot", "x-brief"], "posted": "2026-10-17T04:19:06+08:00", "chars": 1714, "src": "morning"}, {"id": "fb87611c", "name": "", "handle": "DrDavidKass", "why": "", "text": "2. @DrDavidKass (David Kass)\nBonds: Ed Yardeni (quoted by David Kass, posted Fri morning ET, describing Thursday's session) on why Treasury yields fell despite hot CPI and PPI: the market is questioning the AI capex boom (CoreWeave bonds below 80 cents, Gartner revenue gap), which lowers growth expectations. Low engagement, high macro relevance. (~8,764 views, 51 likes, 5 reposts at time of reading).\n\nEd Yardeni:\n\"US Treasury yields fell sharply today, extending Wednesday's retreat from intraday highs. The 10-year yield dropped 9bps to 5.10%, while the 30-year fell 10bps to 5.43%. Even the 2-year yield declined slightly to 4.77%.\n\nRemarkably, this broad-based decline occurred despite two hotter-than-expected inflation reports. Normally, such surprises would push Treasury yields higher as investors priced in a more hawkish Fed.\n\nSo, what's going on? We think the bond market is focusing on the sustainability of the AI investment boom. That issue came to the fore this week as CoreWeave's bonds plunged below 80 cents on the dollar and debt financing major data center projects also tumbled. A new Gartner report estimates AI data center operators will need $8.5 trillion in revenues through 2030 to cover costs and earn healthy returns, versus projected revenues of \"just\" $3.6 trillion.\n\nWhy does this matter? The AI buildout has become a major engine of US economic growth. But doubts about future returns are pushing up borrowing costs, potentially constraining access to capital and ultimately slowing investment spending.\n\nAs a result, investors may be lowering their economic growth expectations amid concerns that the AI boom could slow, pushing Treasury yields lower. This reinforces our longstanding view that the earlier surge in Treasury yields largely reflected stronger-than-expected nominal GDP growth.", "eng": "", "url": "https://x.com/DrDavidKass/status/2111066440136638557", "headline": "@DrDavidKass · 2. @DrDavidKass (David Kass)", "tags": ["@DrDavidKass", "x-brief"], "posted": "2026-10-16T20:07:15+08:00", "chars": 1828, "src": "morning"}, {"id": "0af76dff", "name": "", "handle": "misterrcrypto", "why": "", "text": "3. @misterrcrypto (Mister Crypto)\nFed path: frames the split in pricing after Warsh, about 82.8% odds of no October hike but about 89% odds of at least one hike by December, and the 2018 analogy of a rally into the midterms then a selloff. Chart attached (not visible via the API). (~3,902 views, 64 likes, 4 reposts at time of reading).\n\n🚨 THE FED COULD BE REPEATING 2018!\n\nMarkets are pricing an 82.8% chance of no rate hike in October.\n\nBut December is a different story, with an 89% chance of at least one hike by then.\n\nWe could see a rally into the midterms, followed by another selloff ahead of the December Fed meeting.\n\nThis is similar to what happened in 2018.\n\nCould history repeat?", "eng": "", "url": "https://x.com/misterrcrypto/status/2111186919669563653", "headline": "@misterrcrypto · 3. @misterrcrypto (Mister Crypto)", "tags": ["@misterrcrypto", "x-brief"], "posted": "2026-10-17T04:06:00+08:00", "chars": 693, "src": "morning"}, {"id": "5c2feda6", "name": "", "handle": "LaurelonCapital", "why": "", "text": "4. @LaurelonCapital (market participant)\nEquity market as a whole: a numbers-based look at what a 2008-style S&P drawdown would actually require, with breadth stats (84% of S&P stocks at least 10% off highs, 59% at least 20%, 41% at least 30%), equal-weight forward P/E near 16x, and earnings revisions as the real risk. (~9,038 views, 55 likes, 6 reposts at time of reading).\n\nWhat does a repeat of '08 look like?\n\nI have seen a lot of doomsday like takes around here last few days, so I thought I'd review 2008-scale drawdown requirements, grounded in numbers.\n\n> S&P 500 fell ~57% peak-to-trough in 2008.\nReaching anything close from current levels needs simultaneous pressure on both the concentrated mega-caps and the already-weak remainder of the index, plus earnings deterioration.\n\n> Mag7 / top 10 must fall hard.\nThey are ~35% of the index. A 25% decline in these names produces only a ~10% index drag. A 40%+ decline is required to generate the bulk of a crisis-level move. Several already trade at mid-to-high teens to low-20s forward P/E (let's put NVDA aside for cyclical concerns, we still have META ~21–22x, AMZN ~24–28x); a further 40% price drop would push many into the low-to-mid teens for the best companies in the world.\n\n> The rest of the index still needs another large leg lower.\nEqual-weight forward P/E is already ~16x (near or below recent averages). 84% of S&P 500 stocks are ≥10% off highs, 59% ≥20% off, and 41% ≥30% off. Another major (30%+) decline in the average stock is required on top of that. Pure multiple compression from ~16x offers only limited room (~10–15% to reach long-run norms); most of any additional drop would have to come from earnings estimate cuts (will get to that next).\n\n> Earnings must be revised down substantially.\nConsensus growth expectations remain elevated. This is the real systemic risk, I think. A 25% reduction in forward earnings estimates across the index (recession, margin pressure, AI capex ROI disappointment) would drive much of the required price decline even without extreme multiple compression. This is the thing to watch. HOWEVER, the major AI players are tending to see earnings ACCELERATION (see $ASML's report from Weds).\n\n> A systemic catalyst is probably necessary.\n2008 was driven by credit collapse, forced deleveraging, and recession. Comparable drivers today would include datacenter financing stress, private credit issues tied to AI infrastructure / capex, a sharp slowdown in hyperscaler spending, runaway higher rates, or a broader economic contraction that hits consumer and enterprise demand.\n\nThese things are all possible and straining, hence smart folks shouting for a crash - but valuation and breadth alone are not enough. And it will take something much larger than CoreWeave having a bunch of debt that matures in 2031.", "eng": "", "url": "https://x.com/LaurelonCapital/status/2111118037424439370", "headline": "@LaurelonCapital · 4. @LaurelonCapital (market participant)", "tags": ["@LaurelonCapital", "x-brief"], "posted": "2026-10-16T23:32:17+08:00", "chars": 2820, "src": "morning"}, {"id": "f80d5fc1", "name": "", "handle": "Kalshi", "why": "", "text": "5. @Kalshi (Kalshi)\nGlobal rates / FX: BOJ signalling another hike is inevitable matters for yen carry and global yields in a week of 5%+ US 10Y. The highest-engagement central-bank post found. The post is one line plus two images (image contents not visible via the API). (~63,332 views, 1,276 likes, 148 reposts at time of reading).\n\nJUST IN: BOJ says another rate hike is inevitable https://t.co/6UXFAE2GG0", "eng": "", "url": "https://x.com/Kalshi/status/2111069646883291539", "headline": "@Kalshi · 5. @Kalshi (Kalshi)", "tags": ["@Kalshi", "x-brief"], "posted": "2026-10-16T20:20:00+08:00", "chars": 409, "src": "morning"}], "notes": [], "parsed_by": "bs4", "date": "2026-10-17", "as_of": "2026-10-17T06:50:00+08:00", "time_known": true, "file": "morning.html", "mtime": "2026-10-17T11:52:27+08:00"}, "large": {"kind": "large", "items": [{"id": "9c05d4f9", "name": "", "handle": "zerohedge", "why": "", "text": "(08:27 SGT 17 Oct)\nhe did it again [quoting zerohedge's 13 Oct 'almost time for round two' Ken Griffin meme] [Attached desk note image, transcribed:] US Equities: De-Grossing, Not De-Risking This week's action looks like a positioning reset rather than broad equity liquidation, action very similar to the Situational Awareness driven unwind a couple months ago. The desk saw a notable pick up in High Touch flows not just here in the US but all three regions, here in the US defensive: Long Onlys finished 36/64 buy/sell and Hedge Funds 42/50/8 buy/sell/short, with persistent long selling and de-grossing but relatively little fresh single stock shorting. AI/Momentum remains the epicenter, with sustained supply across Semis, Memory and AI infrastructure and virtually no meaningful buy-the-dip sponsorship, while Software, defensives and less-crowded exposures absorbed some of the rotation midweek. The underlying factor reversal was extreme, with Memory -16%, Spec Growth -12% and Momentum L/S -8% on the week versus Consumer Staples +5% and Value L/S +6%, reinforcing a broader shift toward Quality/Value over Growth and crowded Momentum.", "eng": "", "url": "https://x.com/zerohedge/status/2111252790656070096", "headline": "@zerohedge · (08:27 SGT 17 Oct)", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-10-17T08:27:45+08:00", "chars": 1145, "src": "large"}, {"id": "c293dcb1", "name": "", "handle": "zerohedge", "why": "", "text": "(19:54 SGT 16 Oct)\nQuants Suffer Worst Day Since August As Hedge Funds Notch Third \"Never Since COVID\" Day Of 2026 https://t.co/eXX6cIwN0J", "eng": "", "url": "https://x.com/zerohedge/status/2111063212825407721", "headline": "@zerohedge · (19:54 SGT 16 Oct)", "tags": ["@zerohedge", "x-brief", "large-trades"], "posted": "2026-10-16T19:54:26+08:00", "chars": 138, "src": "large"}, {"id": "ed3c5254", "name": "", "handle": "ETMarkets", "why": "", "text": "(13:15 SGT 16 Oct)\nGlobal hedge funds suffered steep losses this week as a sharp unwinding of artificial intelligence-related investments battered portfolios. Asia-focused stock pickers bore the brunt of the selloff, according to a Goldman Sachs prime brokerage note cited by Reuters. #ETMarkets Read more here https://t.co/mFo4Hbavnr", "eng": "", "url": "https://x.com/ETMarkets/status/2110962929122087399", "headline": "@ETMarkets · (13:15 SGT 16 Oct)", "tags": ["@ETMarkets", "x-brief", "large-trades"], "posted": "2026-10-16T13:15:56+08:00", "chars": 334, "src": "large"}, {"id": "f264913e", "name": "", "handle": "i_am_contagion", "why": "", "text": "(20:51 SGT 16 Oct)\nHedge funds just had one of their rarest bad days, the third such day this year. On October 15, every major type of hedge fund lost more than 0.8% in a single day, according to Goldman Sachs prime brokerage data. That covers three kinds of funds: -stock pickers, which research and bet on individual companies -quants, which let computer models do the trading multi-strategy funds -giant firms that split their money across dozens of separate teams so no single bet can sink them. Goldman says this did not happen once from the COVID crash through the end of 2025. In 2026, it has now happened three times: February 4, July 28 and October 15. AI was at the center each time. In February, a new legal AI tool from Anthropic set off a sell-off in software stocks. In July, funds dumped AI chip stocks, and Asia-focused funds had their worst month in Goldman's records. This week, worries about how much AI companies are borrowing hit the same trade again. The losses on October 15 were: -stock pickers −0.9% -quants and multi-strategy funds about −1% each -tech-focused funds −2% -Asia-focused funds −2.6% For quants, it was the worst day since August. The reason this keeps happening is that these funds work very differently but ended up owning the same AI stocks. When those stocks drop, everyone sells at once, and that selling pushes prices down further. Between October 8 and 14, hedge funds sold off all the AI stock buying they had added since January 2025. There may be a floor forming. Goldman's data shows hedge funds are now betting less on the market going up than they usually do, at historically low levels. That suggests much of the forced selling may already be done.", "eng": "", "url": "https://x.com/i_am_contagion/status/2111077493247750459", "headline": "@i_am_contagion · (20:51 SGT 16 Oct)", "tags": ["@i_am_contagion", "x-brief", "large-trades"], "posted": "2026-10-16T20:51:10+08:00", "chars": 1701, "src": "large"}, {"id": "69d0f2f7", "name": "", "handle": "JeffParoddy", "why": "", "text": "(02:52 SGT 17 Oct)\nClean one fund out by Monday and the leverage is still sitting there. Goldman's prime book says stock pickers lost money every single day this week, down 2.9% through Oct 15. S3 Partners blames the forced selling at Situational Awareness on concentrated positions, crowded trades and high leverage, not a short attack. That's not one blown-up fund. That's the whole AI trade meeting its margin calls.", "eng": "", "url": "https://x.com/JeffParoddy/status/2111168304270246341", "headline": "@JeffParoddy · (02:52 SGT 17 Oct)", "tags": ["@JeffParoddy", "x-brief", "large-trades"], "posted": "2026-10-17T02:52:02+08:00", "chars": 419, "src": "large"}, {"id": "545656e6", "name": "", "handle": "jimcramer", "why": "", "text": "(01:46 SGT 17 Oct)\nA combination of oil and, perhaps, a big hedge fund blowing up, is just making this one of the worst days of the year", "eng": "", "url": "https://x.com/jimcramer/status/2111151907842527594", "headline": "@jimcramer · (01:46 SGT 17 Oct)", "tags": ["@jimcramer", "x-brief", "large-trades"], "posted": "2026-10-17T01:46:52+08:00", "chars": 136, "src": "large"}, {"id": "9354edc2", "name": "(02:25 SGT 17 Oct)", "handle": "jimcramer", "why": "", "text": "Maybe we clean out this blown up hedge fund and start fresh on Monday..", "eng": "", "url": "https://x.com/jimcramer/status/2111161651542298802", "headline": "(02:25 SGT 17 Oct) (@jimcramer) · Maybe we clean out this blown up hedge fund and start fresh on Monday..", "tags": ["@jimcramer", "x-brief", "large-trades"], "posted": "2026-10-17T02:25:35+08:00", "chars": 71, "src": "large"}, {"id": "9042800c", "name": "", "handle": "jimcramer", "why": "", "text": "(03:18 SGT 17 Oct)\nPossible scenario. Margin clerks thought they could margin out the wayward hedge fund over the course of the day, but then oil spiked and they had to hustle to get the Data Center & Friends positions off their sheets", "eng": "", "url": "https://x.com/jimcramer/status/2111174993770111108", "headline": "@jimcramer · (03:18 SGT 17 Oct)", "tags": ["@jimcramer", "x-brief", "large-trades"], "posted": "2026-10-17T03:18:36+08:00", "chars": 235, "src": "large"}, {"id": "8730d598", "name": "", "handle": "MartinShkreli", "why": "", "text": "(02:56 SGT 16 Oct)\nGODEL TERMINAL: VARA FUND \"DOING FINE\", HAS NOT SHUT DOWN OR BLOWN UP --PERSON FAMILIAR", "eng": "", "url": "https://x.com/MartinShkreli/status/2110806934144065864", "headline": "@MartinShkreli · (02:56 SGT 16 Oct)", "tags": ["@MartinShkreli", "x-brief", "large-trades"], "posted": "2026-10-16T02:56:04+08:00", "chars": 106, "src": "large"}, {"id": "201d94a8", "name": "", "handle": "DarioCpx", "why": "", "text": "(02:23 SGT 17 Oct)\nJane Street lost 15bn$ when Situational Awareness HF had to fire sale its assets to Citadel Jane Street is one of those firms so big and massively levered that can move the whole market this much this quickly if they start imploding Just a pure gut feeling I'd like to share", "eng": "", "url": "https://x.com/DarioCpx/status/2111161184032313716", "headline": "@DarioCpx · (02:23 SGT 17 Oct)", "tags": ["@DarioCpx", "x-brief", "large-trades"], "posted": "2026-10-17T02:23:44+08:00", "chars": 293, "src": "large"}, {"id": "70e8a7e7", "name": "", "handle": "DarioCpx", "why": "", "text": "(09:12 SGT 17 Oct)\nThat fund is much smaller than Situational Awareness and nevertheless holding very concentrated AI bets, similar to Situational Awareness an eventual liquidation would not have bothered the whole S&P500 and the VIX", "eng": "", "url": "https://x.com/DarioCpx/status/2111264169114911155", "headline": "@DarioCpx · (09:12 SGT 17 Oct)", "tags": ["@DarioCpx", "x-brief", "large-trades"], "posted": "2026-10-17T09:12:57+08:00", "chars": 233, "src": "large"}   function votedList(){
    return Object.keys(votes).map(function(id){var x=votes[id]; return {id:id,v:x.v,h:x.h,s:x.s,t:x.t||[],ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts});

  function fbText(level){
    var L=votedList(), day=dayF.format(new Date());
    var out=['Dashboard feedback '+day+' (SGT)'];
    [[1,'MORE LIKE THIS'],[-1,'LESS LIKE THIS']].forEach(function(g){

      out.push('',g[1]);

        var h=x.h.replace(/\s+/g,' '); if(level>=2&&h.length>70) h=h.slice(0,67)+'...';
        var tg=level>=2?'':(level===1?x.t.slice(0,2):x.t).join(', ');
        out.push((g[0]>0?'+ ':'- ')+'['+x.s+'] '+h+(tg?' | tags: '+tg:'')+' | id: '+x.id);
      });
    });
    if(fbNote.trim()) out.push('','NOTES',fbNote.trim());
    return out.join('\n');

  function build(){
    var tabs=document.getElementById('tabs'), main=document.getElementById('main');
    main.textContent='';
    main.appendChild(askBar());
    TABS.forEach(function(t){
      var b=el('button','tab'); b.type='button'; b.id='tab-'+t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls','p-'+t.id);
      b.appendChild(document.createTextNode(t.label)); var cn=t.count(); if(cn!=null) b.appendChild(el('span','n',String(cn))); if(t.empty) b.classList.add('nopaper');
      b.addEventListener('click',function(){select(t.id,true)});
      b.addEventListener('keydown',function(e){
        var i=TABS.findIndex(function(x){return x.id===t.id}), j=-1;
        if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i+TABS.length-1)%TABS.length;
        if(j>=0){e.preventDefault(); select(TABS[j].id,true); document.getElementById('tab-'+TABS[j].id).focus()}
      });
      tabs.appendChild(b);
      var p=el('section','panel'); p.id='p-'+t.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t.id); p.hidden=true;
      if(t.lede) p.appendChild(el('p','lede',t.lede));
      t.render(p);
      main.appendChild(p);
    });
    var saved=LS.get('newsdash.tab'); select(TABS.some(function(t){return t.id===saved})?saved:TABS[0].id, false);
    tabsOverflow(); window.addEventListener('resize',tabsOverflow);
  }
  window.addEventListener('resize',sizePaperFrame); window.addEventListener('orientationchange',sizePaperFrame);
  function tabsOverflow(){var tb=document.getElementById('tabs'); tb.classList.toggle('ovf', tb.scrollWidth>tb.clientWidth+2)}

  function select(id, persist){
    TABS.forEach(function(t){
      var on = t.id===id, b=document.getElementById('tab-'+t.id);
      b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1;
      document.getElementById('p-'+t.id).hidden = !on;
    });
    var cur=TABS.filter(function(t){return t.id===id})[0];
    document.body.classList.toggle('paper-tab', !!(cur && cur.paper));
    if(cur && cur.onShow) cur.onShow();
    var sel=document.getElementById('tab-'+id), tb=document.getElementById('tabs');
    if(sel && tb.scrollWidth>tb.clientWidth){ var left=sel.offsetLeft-(tb.clientWidth-sel.offsetWidth)/2; if(tb.scrollTo) tb.scrollTo({left:Math.max(0,left),behavior:persist?'smooth':'auto'}); else tb.scrollLeft=Math.max(0,left) }
    if(persist){ LS.set('newsdash.tab', id); window.scrollTo({top:0}) }
    else LS.set('newsdash.tab', id);
  }

  function tick(){
    var now=new Date();
    var nodes=document.querySelectorAll('time.rec');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], r=rel(n.getAttribute('data-published'), now);
      n.textContent=r.text; n.title=r.title; n.classList.toggle('old', r.old);
    }
    var g=parse(DATA.meta && DATA.meta.generated_at), st=document.getElementById('stamp-t');
    if(g){ st.textContent=fmtSGT(g); st.title='Data compiled '+rel(DATA.meta.generated_at, now).text }
    var sy=parse(XB.synced_at), sx=document.getElementById('stamp-x');
    if(sy && (XB.morning||XB.large)){ sx.hidden=false; document.getElementById('stamp-xt').textContent=fmtSGT(sy); sx.title='Markets X News files last re-read by the build '+rel(XB.synced_at, now).text }
  }

  build(); tick();
  document.getElementById('foot').textContent =
    'Compiled from public web sources and the X API. Sports, finance and Trending-on-X briefings are synthesised from several sources (listed in a small footnote under each); X trend summaries are only leads and every fact is checked against articles; tweets are quoted from X and may be truncated. All times shown in SGT (UTC+8). Not financial advice.';
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick() });
  window.addEventListener('pageshow', tick);
})();
</script>
</body>
</html>
